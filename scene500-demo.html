<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PAI Word · 组合场景体验</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--soft:#eef2f7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}.wrap{max-width:980px;margin:auto;padding:20px 16px 60px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin:8px 0 20px}.title h1{margin:0;font-size:28px;letter-spacing:-.02em}.title p{margin:8px 0 0;color:var(--muted);line-height:1.55}.back{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;text-decoration:none;color:var(--text);white-space:nowrap}.notice{background:#fff8e8;border:1px solid #f0dfae;border-radius:14px;padding:12px 14px;color:#6b5717;font-size:13px;line-height:1.55;margin-bottom:16px}.toolbar{position:sticky;top:0;z-index:5;background:rgba(246,247,249,.94);backdrop-filter:blur(10px);padding:10px 0 12px}.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font-size:16px;outline:none}.groups{display:flex;gap:8px;overflow:auto;padding:10px 0 2px;scrollbar-width:none}.groups::-webkit-scrollbar{display:none}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:13px;white-space:nowrap;cursor:pointer}.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin:14px 2px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;transition:.15s}.card:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(17,24,39,.06)}.card-top{display:flex;justify-content:space-between;gap:10px}.scene-id{font-size:12px;color:var(--muted)}.priority{font-size:11px;background:var(--soft);padding:4px 7px;border-radius:999px}.card h3{margin:9px 0 8px;font-size:17px;line-height:1.4}.nodes{font-size:12px;color:var(--muted);line-height:1.5}.modal{position:fixed;inset:0;background:rgba(17,24,39,.38);display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.open{display:flex}.sheet{width:min(720px,100%);max-height:82vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.15)}.sheetbar{display:flex;justify-content:space-between;gap:16px}.close{border:0;background:var(--soft);width:36px;height:36px;border-radius:50%;font-size:20px}.sheet h2{margin:4px 0 10px;font-size:24px}.label{font-size:12px;color:var(--muted);margin-top:18px}.pillrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.pill{background:var(--soft);padding:7px 9px;border-radius:999px;font-size:12px}.cta{width:100%;border:0;border-radius:14px;padding:13px 14px;margin-top:20px;background:#e5e7eb;color:#6b7280;font-size:15px}.empty{text-align:center;color:var(--muted);padding:60px 10px}@media(max-width:640px){.grid{grid-template-columns:1fr}.title h1{font-size:24px}.top{align-items:center}.back{padding:8px 11px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="title"><h1>PAI Word · 组合场景体验</h1><p>从 500 个语义节点组合成 120 个更接近真实使用的学习场景。</p></div><a class="back" href="./">返回主应用</a></div>
  <div class="notice">这是 Scene500 信息架构体验版。120 个组合场景已经定义，但正式 KU 词库映射仍在审核，因此本页只展示场景结构，不把未验证候选作为正式背词内容。</div>
  <div class="toolbar"><input id="q" class="search" placeholder="搜索场景，如：机场、医生、面试、论文、气候…"><div id="groups" class="groups"></div></div>
  <div class="meta"><span id="summary">加载中…</span><span>点击场景查看组成节点</span></div>
  <div id="grid" class="grid"></div>
</div>
<div id="modal" class="modal"><div class="sheet"><div class="sheetbar"><div><div id="mGroup" class="scene-id"></div><h2 id="mTitle"></h2></div><button id="close" class="close">×</button></div><div class="label">来源节点</div><div id="mNodes" class="pillrow"></div><div class="label">学习状态</div><div class="pillrow"><span class="pill">组合场景已定义</span><span class="pill">KU 映射待审核</span><span class="pill">不会自动上线未验证候选</span></div><button class="cta" disabled>正式背词内容尚未开放</button></div></div>
<script>
(async()=>{
 const res=await fetch('./data/scene500-composed-scenes-v1.json',{cache:'no-store'}); if(!res.ok) throw new Error('组合场景数据加载失败');
 const data=await res.json(); const groups=[{id:'ALL',nameZh:'全部'},...(data.groups||[])]; const scenes=data.scenes||[]; let active='ALL';
 const $=id=>document.getElementById(id), q=$('q'), grid=$('grid'), groupBar=$('groups'), summary=$('summary'), modal=$('modal');
 const groupMap=new Map((data.groups||[]).map(g=>[g.id,g.nameZh]));
 function renderGroups(){groupBar.innerHTML=groups.map(g=>`<button class="chip ${g.id===active?'active':''}" data-id="${g.id}">${g.nameZh}</button>`).join(''); groupBar.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{active=b.dataset.id;renderGroups();render()})}
 function filtered(){const t=q.value.trim().toLowerCase();return scenes.filter(s=>(active==='ALL'||s.groupId===active)&&(!t||s.nameZh.toLowerCase().includes(t)||(s.sourceNodeIds||[]).join(' ').toLowerCase().includes(t)))}
 function render(){const arr=filtered();summary.textContent=`显示 ${arr.length} / ${scenes.length} 个组合场景`;grid.innerHTML=arr.length?arr.map(s=>`<article class="card" data-id="${s.id}"><div class="card-top"><span class="scene-id">${s.id} · ${groupMap.get(s.groupId)||s.groupId}</span><span class="priority">P${s.priority||2}</span></div><h3>${s.nameZh}</h3><div class="nodes">${(s.sourceNodeIds||[]).join(' · ')}</div></article>`).join(''):'<div class="empty">没有匹配的场景</div>'; grid.querySelectorAll('.card').forEach(c=>c.onclick=()=>openScene(c.dataset.id))}
 function openScene(id){const s=scenes.find(x=>x.id===id);if(!s)return;$('mGroup').textContent=`${s.id} · ${groupMap.get(s.groupId)||s.groupId}`;$('mTitle').textContent=s.nameZh;$('mNodes').innerHTML=(s.sourceNodeIds||[]).map(x=>`<span class="pill">${x}</span>`).join('');modal.classList.add('open')}
 $('close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};q.oninput=render;renderGroups();render();
})().catch(e=>{document.getElementById('grid').innerHTML=`<div class="empty">${e.message}</div>`;document.getElementById('summary').textContent='加载失败';console.error(e)});
</script>
</body></html>
