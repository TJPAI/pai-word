<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scene500 MicroRec A/B</title><style>body{font:15px system-ui,sans-serif;max-width:1120px;margin:auto;padding:22px;background:#f7f8fb;color:#152132}textarea{width:100%;min-height:70px;font:inherit;padding:12px;box-sizing:border-box}button{padding:10px 24px;background:#164d8c;border:0;color:white;border-radius:8px;cursor:pointer}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:20px}section{background:white;border:1px solid #dde3ec;border-radius:12px;padding:15px}ol{padding-left:22px}li{margin:9px 0}small{color:#546378}#status{margin:12px 0;color:#536174}</style><h2>PAI Word · Scene500 候选推荐引擎并排比较</h2><p>独立实验版。对比基础规则、词汇检索、字符哈希、融合检索及意图修正。不代表最新 Core20K 混合生产 Runtime。</p><textarea id="query" placeholder="输入中英混合短句">不坐地铁，改坐公交</textarea><p><button id="go">并排推荐 Top 5</button></p><div id="status">正在读取固定的 500 场景目录…</div><main id="results"></main><script type="module">
import {createScene500Recommender} from '../../scene500-recommendation/engine.mjs';
import {createMicroRec} from './microrec.mjs';
import {createIntentAware} from './intent-aware.mjs';
let catalog,base,micro,intent;
const status=document.querySelector('#status'),results=document.querySelector('#results');
try{const response=await fetch('../../scene500-recommendation/catalog-v0.2.json');if(!response.ok)throw Error('catalog HTTP '+response.status);catalog=await response.json();base=createScene500Recommender({catalog});micro=createMicroRec(catalog);intent=createIntentAware(catalog);status.textContent='已载入 '+Object.keys(catalog.scenes).length+' 场景。单次耗时仅为本机提示性结果；严格性能请看 CI。';}catch(e){status.textContent='加载失败：'+e.message+'。请通过 HTTP(S) 服务访问此页面，不要使用 file://';}
const configs=[['现有基础规则',q=>base.search(q,{limit:5}).results],['A: Lexical',q=>micro.search(q,{method:'lexical'})],['B: Hashed',q=>micro.search(q,{method:'hashed-semantic'})],['C: Hybrid',q=>micro.search(q,{method:'hybrid'})],['D: Intent-aware',q=>intent.search(q)]];
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');}
function run(){if(!base)return;const q=document.querySelector('#query').value.trim();results.textContent='';for(const [name,fn] of configs){const t=performance.now(),rows=fn(q),ms=performance.now()-t,section=document.createElement('section');section.innerHTML='<strong>'+esc(name)+'</strong><p><small>'+ms.toFixed(2)+' ms · '+rows.length+' 结果</small></p><ol>'+rows.map(x=>'<li><b>'+esc(x.sceneId)+'</b> '+esc(x.name)+' <small>score '+esc(x.score)+'</small></li>').join('')+'</ol>';results.append(section);}}
document.querySelector('#go').addEventListener('click',run);document.querySelector('#query').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')run()});if(base)run();
</script></html>
