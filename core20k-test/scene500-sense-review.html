<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAI Word · Scene500 Sense Review</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f7f7f7;color:#111}.wrap{max-width:1100px;margin:0 auto;padding:24px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}.meta{color:#666;font-size:13px}.target{font-weight:650;margin:8px 0}.candidate{display:block;border-top:1px solid #eee;padding:10px 0;cursor:pointer}.candidate:first-of-type{border-top:0}.meaning{margin-left:24px;color:#333}.badge{display:inline-block;padding:2px 7px;border:1px solid #ccc;border-radius:999px;font-size:12px;margin-left:6px}button,select{font:inherit;padding:8px 10px}textarea{width:100%;min-height:220px;box-sizing:border-box;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.danger{color:#a00}.ok{color:#075}</style></head><body><div class="wrap"><h1>Scene500 Sense / KU 审核</h1><p>审核页只生成 membership patch，不直接修改正式可学习词池。单候选也必须人工确认。</p><div class="toolbar"><label>场景 <select id="scene"><option value="">全部</option></select></label><label><input id="ambiguous" type="checkbox" checked> 仅多候选</label><button id="refresh">刷新</button><button id="patch">生成 patch</button></div><div id="summary" class="meta">加载中…</div><div id="rows"></div><h2>Patch JSON</h2><textarea id="output" readonly placeholder="选择候选 KU 后点击“生成 patch”"></textarea></div><script src="mobile.js?v=core13000-1"></script><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako_inflate.min.js"></script><script src="lazy-loader.js?v=tap-v47"></script><script>
(async()=>{
 const VERSION='sense-review-workbench-v1';
 const script=src=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src+'?v='+VERSION;s.onload=resolve;s.onerror=reject;document.body.appendChild(s)});
 try{
  await loadLearningCatalog();
  const r=await fetch('data/scene500-playable-membership-v2.json',{cache:'no-store'});if(!r.ok)throw Error('membership V2 加载失败');window.PAI_SCENE500_MEMBERSHIP=await r.json();
  await script('scene500-integrated.js');await script('scene500-sense-review.js');
  const api=window.PAI_SCENE500_SENSE_REVIEW,selections={};
  const sceneSel=document.getElementById('scene'),amb=document.getElementById('ambiguous'),rowsEl=document.getElementById('rows'),summary=document.getElementById('summary'),out=document.getElementById('output');
  for(const spec of (window.PAI_SCENE500?.specs||[]).filter(x=>!['cs206','cs215','cs223','cs254','cs321'].includes(x.id))){const o=document.createElement('option');o.value=spec.id;o.textContent=spec.id+' · '+spec.name;sceneSel.appendChild(o)}
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function render(){
   const options={sceneId:sceneSel.value||null,ambiguousOnly:amb.checked},q=api.queue(options);summary.textContent=`待审 ${q.length} 条；当前筛选：${amb.checked?'仅多候选':'全部待审'}`;
   rowsEl.innerHTML=q.map(row=>`<div class="card"><div><strong>${esc(row.sceneId)} · ${esc(row.sceneName)}</strong><span class="badge">rank ${row.sceneRank??'-'}</span><span class="badge">${esc(row.reviewState)}</span></div><h3>${esc(row.lemma)}</h3><div class="target">目标义：${esc(row.targetSenseZh||'未填写——需先明确场景义')}</div><div class="meta">当前 fallback KU: ${esc(row.currentKuId||'—')} · 候选 ${row.candidateCount}</div>${row.candidates.length?row.candidates.map(c=>`<label class="candidate"><input type="radio" name="${esc(row.key)}" value="${esc(c.kuId)}" ${selections[row.key]===c.kuId?'checked':''}> <code>${esc(c.kuId)}</code><span class="badge">rank ${c.coreRank??'-'}</span><span class="badge">${esc(c.pos||'')}</span><div class="meaning">${esc(c.meaningZh||c.title||'（目录未提供中文义项）')} ${c.scene?`<span class="meta">· Core scene ${esc(c.scene)}</span>`:''}</div></label>`).join(''):'<p class="danger">当前 Core 无 Sense KU 候选</p>'}</div>`).join('');
   rowsEl.querySelectorAll('input[type=radio]').forEach(el=>el.addEventListener('change',e=>{selections[e.target.name]=e.target.value}));
  }
  document.getElementById('refresh').onclick=render;sceneSel.onchange=render;amb.onchange=render;
  document.getElementById('patch').onclick=()=>{const result=api.buildMembershipPatch(selections,{reviewedBy:'scene500_review_workbench'});out.value=JSON.stringify(result,null,2);summary.innerHTML=result.errors.length?`<span class="danger">patch ${result.patches.length} 条，错误 ${result.errors.length} 条</span>`:`<span class="ok">patch ${result.patches.length} 条；未自动写库</span>`};
  render();
 }catch(e){document.getElementById('summary').textContent='加载失败：'+e.message;console.error(e)}
})();
</script></body></html>
