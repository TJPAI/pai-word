<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>PAI Word B184 · 四选一隔离预览</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#183251;background:#f6f9fe}*{box-sizing:border-box}body{margin:0}main{max-width:620px;margin:auto;padding:calc(28px + env(safe-area-inset-top)) 18px calc(32px + env(safe-area-inset-bottom))}.kicker{color:#5575a1;font-weight:700;font-size:12px;letter-spacing:.09em}h1{font-size:26px;margin:8px 0 10px}.note{color:#60758d;font-size:13px;line-height:1.6}.panel{background:white;border:1px solid #e2eaf3;border-radius:20px;padding:22px;box-shadow:0 8px 35px #284d8310}.count{color:#617997;font-size:13px}.prompt{font-size:20px;line-height:1.5;font-weight:680;margin:18px 0 20px}.choices{display:grid;gap:10px}.choice{min-height:56px;width:100%;padding:12px 16px;text-align:left;color:#1b385e;border:1px solid #d1ddea;border-radius:13px;background:#f8fbff;font:inherit;font-weight:550}.choice:not(:disabled){cursor:pointer}.choice:focus-visible,.next:focus-visible{outline:3px solid #4285f4;outline-offset:2px}.choice.correct{background:#ecfaf1;border-color:#56ad78}.choice.wrong{background:#fff0ed;border-color:#df8379}.choice:disabled{opacity:1}.result{border-top:1px solid #edf1f6;margin-top:19px;padding-top:17px}.result strong{color:#135d42}.result p{line-height:1.65;margin:8px 0}.result .zh{color:#66778d}.next{background:#246ee9;color:#fff;border:0;border-radius:13px;padding:14px 20px;min-height:48px;font-size:16px;font-weight:650;margin-top:16px;cursor:pointer}.hidden{display:none!important}.tag{display:inline-block;border-radius:7px;padding:5px 8px;background:#fff3df;color:#91621b;font-size:12px;font-weight:700;margin-bottom:14px}footer{font-size:12px;color:#7a899c;margin-top:18px;line-height:1.65}
</style></head><body><main>
<div class="kicker">PAI WORD · STAGING PREVIEW</div><h1>英语搭配 · 四选一识别</h1>
<p class="note">B184独立教学预览：四道候选题，仅供查看结构和交互。不会保存答题记录，不会影响正式KU、SRS或学习进度。</p>
<div class="tag">TEST ONLY · NOT PRODUCTION READY</div>
<div id="app" class="panel" aria-live="polite"><p>正在读取隔离候选……</p></div>
<footer>选项随机排列；作答前不展示正确短语及完整语境例句。作答反馈仅供预览，不是SRS判分。</footer>
</main><script type="module">
import {fromJsonl,publicQuestion,revealAnswer} from './contract.mjs';
const app=document.getElementById('app');let records=[],index=0,answered=false;
function node(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function show(){
 answered=false;const r=records[index],q=publicQuestion(r);app.replaceChildren();
 app.append(node('div','count',`第 ${index+1} / ${records.length} 题`),node('div','prompt',q.prompt));
 const choices=node('div','choices');app.append(choices);
 for(const value of q.choices){
  const button=node('button','choice',value);button.type='button';button.addEventListener('click',()=>respond(value,button,choices,r));choices.append(button);
 }
}
function respond(value,clicked,choices,r){
 if(answered)return;answered=true;const result=revealAnswer(r,value);
 for(const el of choices.children){el.disabled=true;if(el.textContent===result.answer)el.classList.add('correct');else if(el===clicked)el.classList.add('wrong')}
 const panel=node('section','result');panel.append(node('strong','',result.correct?'选择正确':'正确答案：'+result.answer));
 if(result.correct)panel.append(node('p','',`正确答案：${result.answer}`));
 panel.append(node('p','',result.example_en),node('p','zh',result.example_zh));
 panel.append(node('p','note','本题未写入学习记录；SRS评分：不适用。'));app.append(panel);
 const next=node('button','next',index===records.length-1?'重新练习':'下一题 →');next.type='button';
 next.addEventListener('click',()=>{index=(index+1)%records.length;show()});app.append(next);
}
try{
 const response=await fetch('./candidates-b184.jsonl',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);
 records=fromJsonl(await response.text()).records;show();
}catch(e){app.replaceChildren(node('p','',`候选加载或验证失败：${String(e.message||e)}`))}
</script></body></html>
