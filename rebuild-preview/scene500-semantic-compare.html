<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scene500 语义实验对比</title>
<style>body{font:16px system-ui;margin:2rem auto;padding:0 1rem;max-width:1100px;background:#f6f7fa;color:#192638}textarea{box-sizing:border-box;width:100%;font:inherit;padding:12px;border-radius:8px}button{padding:10px 18px;margin:10px 6px 10px 0;border:0;border-radius:8px;background:#2358a8;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:white;border-radius:12px;padding:16px}li{padding:10px 0;border-bottom:1px solid #ddd}.small{font-size:13px;color:#647085}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head>
<body><h1>Scene500 推荐对比实验室</h1><p>同一查询，左侧原推荐，右侧从500场景画像独立召回强匹配候选并与原结果融合；不修改学习状态。</p>
<textarea id="q" rows="3">我想学习人工智能和机器学习</textarea><div><button id="go">比较Top5</button><button id="sample">换个示例</button></div><p id="status">准备中…</p>
<div class="grid"><section class="card"><h2>默认Hybrid</h2><div id="left"></div></section><section class="card"><h2>语义增强实验</h2><div id="right"></div></section></div>
<script type="module">
const root=new URL('../scene500-recommendation/',import.meta.url),$=id=>document.getElementById(id);
let catalog,rule,hybrid,overlay,serial=0,n=0;
const examples=['早上起床洗漱准备上班','我要坐飞机去旅行并订酒店','买一件冬天的衣服','我想学习人工智能和机器学习','数学方程和物理实验','去医院检查身体','周末在家做饭','我想准备英语考试','这个问题横跨工作和旅行','完全无关的随机字符'];
const norm=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/\s+/g,'');
function enhance(query,ids){const q=norm(query);const pool=new Set(ids);for(const id of Object.keys(overlay?.scenes||{}))pool.add(id);const rows=[...pool].map((id,index)=>{const s=overlay?.scenes?.[id];let score=0;const reasons=[];if(s){for(const [key,w] of [['actions',4.5],['objects',3],['aliases',2.5],['example_queries',1.1]]){let best=0,term='';for(const raw of s[key]||[]){const t=norm(raw);if(t.length<2||!q.includes(t))continue;const v=w*(t.length<3?.35:t.length<4?.65:1);if(v>best){best=v;term=raw}}if(best){score+=best;reasons.push(key+': '+term)}}for(const raw of s.negative_terms||[])if(norm(raw).length>=2&&q.includes(norm(raw)))score-=8}return{id,index,score,reasons,baseRank:ids.indexOf(id)}});
const eligible=rows.filter(x=>x.score>=3&&x.reasons.length>=1).sort((a,b)=>b.score-a.score||a.index-b.index);const top=eligible.slice(0,5);const remaining=ids.filter(id=>!top.some(x=>x.id===id));const ranked=[...top.map(x=>x.id),...remaining];const changed=ranked.slice(0,5).join('|')!==ids.slice(0,5).join('|');return{rows:ranked.map(id=>rows.find(x=>x.id===id)),triggered:eligible.length>0,changed,newCandidates:top.filter(x=>x.baseRank<0).length,maxScore:Math.max(0,...rows.map(x=>x.score)),candidateCount:eligible.length}}
function list(ids,detail){return ids.length?'<ol>'+ids.slice(0,5).map(id=>{const x=detail?.find(v=>v.id===id);return '<li><b>'+id+'</b> '+(catalog.scenes[id]?.name||'')+(x?.reasons?.length?'<div class="small">'+x.reasons.join(' / ')+'</div>':'')+'</li>'}).join('')+'</ol>':'<p>无结果</p>'}
function run(){if(!catalog)return;const ticket=++serial,q=$('q').value.trim(),active=hybrid||rule;const t=performance.now(),a=active.search(q,{limit:500}),ids=[...new Set(a.results.map(x=>x.sceneId))],ms=performance.now()-t;const t2=performance.now(),out=enhance(q,ids),extra=performance.now()-t2;if(ticket!==serial)return;$('left').innerHTML=list(ids)+'<p class="small">耗时 '+ms.toFixed(1)+' ms · '+(hybrid?.mode||'rule_fallback')+'</p>';$('right').innerHTML=list(out.rows.map(x=>x.id),out.rows)+'<p class="small">额外耗时 '+extra.toFixed(1)+' ms · 候选 '+out.candidateCount+' · '+(out.changed?'Top5已变化（新增候选 '+out.newCandidates+'）':out.triggered?'语义证据触发，但Top5未变化':'未达实验门槛（最高分 '+out.maxScore.toFixed(1)+'）')+'</p>'}
$('go').onclick=run;$('q').oninput=()=>serial++;$('sample').onclick=()=>{$('q').value=examples[++n%examples.length];run()};
try{const [c,e,l,v,o]=await Promise.all([fetch(new URL('catalog-v0.2.json',root)).then(r=>r.json()),import(new URL('engine.mjs',root)),import(new URL('chinese-lexicon-loader.mjs',root)),import(new URL('semantic-overlay-validator.mjs',root)),fetch(new URL('../data/scene500-semantic-overlay-v1.2.json',import.meta.url)).then(r=>r.json())]);catalog=c;overlay=o;const checked=v.validateSemanticOverlayV12(o,Object.keys(c.scenes));if(!checked.ok)throw Error(checked.errors.slice(0,3).join(','));rule=e.createScene500Recommender({catalog:c});$('status').textContent='500场景画像已就绪，中文Hybrid后台加载中';run();l.loadScene500WithChineseLexicon({catalog:c,lexiconUrl:new URL('zh-core20k-v094.min.json',root).href,associationUrl:new URL('v094-lexical-associations.json',root).href,timeoutMs:4000}).then(x=>{hybrid=x;$('status').textContent='当前引擎：'+x.mode+'；实验数据：500场景草稿';run()}).catch(err=>{$('status').textContent='中文Hybrid加载失败，规则回退：'+String(err)})}catch(err){$('status').textContent='初始化失败：'+String(err)}
</script></body></html>
