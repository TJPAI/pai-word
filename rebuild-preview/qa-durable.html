<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAI Word · IndexedDB 隔离测试</title>
<style>body{font:16px system-ui,sans-serif;max-width:780px;margin:28px auto;padding:0 16px;line-height:1.55}button{font:inherit;padding:10px 18px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f5f7;padding:16px;border-radius:8px}.pass{color:#087a37}.fail{color:#b42318}</style></head>
<body><h1>PAI Word · IndexedDB 事务测试</h1>
<p>此页面只使用临时 QA 数据库，不会打开、修改或清空正式版及预览版的学习记录。点击按钮运行真实浏览器 IndexedDB 测试。</p>
<button id="run">运行测试</button><pre id="log" aria-live="polite">等待开始</pre>
<script>
const output=document.querySelector('#log'),button=document.querySelector('#run');
const lines=[];function log(s,ok){lines.push(s);output.textContent=lines.join('\n');if(ok===false)output.className='fail';}
function assert(condition,message){if(!condition)throw Error(message);log('PASS '+message,true)}
const delay=ms=>new Promise(r=>setTimeout(r,ms));
async function deleteDB(name){await new Promise((resolve,reject)=>{const request=indexedDB.deleteDatabase(name);request.onsuccess=resolve;request.onerror=()=>reject(request.error);request.onblocked=()=>reject(Error('Temporary QA database blocked by another tab'))})}
button.onclick=async()=>{
 button.disabled=true;lines.length=0;output.className='';
 const name='pai-word-qa-tmp-'+Date.now()+'-'+Math.random().toString(36).slice(2);
 let a=null,b=null,reopened=null;
 try{
  if(!window.indexedDB)throw Error('此浏览器不支持 IndexedDB');
  const response=await fetch('./ku-durable-store.js',{cache:'no-store'});
  if(!response.ok)throw Error('Cannot load durable-store source: '+response.status);
  const source=await response.text();
  const original="const NAME='pai-word-preview-ku-durable-v2';";
  if(!source.includes(original))throw Error('Source contract changed: review test isolation before running');
  const isolated=source.replace(original,'const NAME='+JSON.stringify(name)+';');
  const sandbox={indexedDB,PAI_KU_STORAGE_READY:false};
  // Execute the exact store implementation against a randomly named disposable database.
  new Function('window','indexedDB','structuredClone',isolated)(sandbox,indexedDB,structuredClone);
  const store=sandbox.PAI_KU_DURABLE;
  assert(sandbox.PAI_KU_DURABLE_DB_NAME===name,'QA storage namespace is isolated');
  a=await store.open();b=await store.open();
  const initial={records:{},stats:{known:0,unknown:0},learningSession:{queue:[]}};
  const base=await store.initialize(a,initial);
  assert(base.version===0,'Fresh snapshot version is zero');
  const snapshot1=structuredClone(base.snapshot);snapshot1.records.word1={grade:'good'};
  const first=await store.commit(a,{snapshot:snapshot1,attemptId:'qa-attempt-1',expectedVersion:0});
  assert(first.status==='committed'&&first.version===1,'First rating commits once');
  const duplicate=await store.commit(a,{snapshot:snapshot1,attemptId:'qa-attempt-1',expectedVersion:1});
  assert(duplicate.status==='duplicate','Duplicate attempt ID is rejected');
  const stale=await store.commit(b,{snapshot:{records:{word2:{grade:'hard'}}},attemptId:'qa-attempt-2',expectedVersion:0});
  assert(stale.status==='conflict'&&stale.version===1,'Stale second-tab writer cannot overwrite first tab');
  const afterConflict=await store.read(b);
  assert(afterConflict.version===1&&!!afterConflict.snapshot.records.word1&&!afterConflict.snapshot.records.word2,'Conflict leaves first-tab state intact');
  const invalid={records:{word1:{grade:'good'}},bad:()=>{}};
  let aborted=false;
  try{await store.commit(a,{snapshot:invalid,attemptId:'qa-attempt-aborted',expectedVersion:1})}catch(e){aborted=true;log('Expected abort: '+String(e?.name||e))}
  assert(aborted,'Uncloneable snapshot aborts transaction');
  const afterAbort=await store.read(a);
  assert(afterAbort.version===1&&!!afterAbort.snapshot.records.word1,'Aborted transaction does not change state');
  const retry=await store.commit(b,{snapshot:{records:{word1:{grade:'good'},word3:{grade:'again'}}},attemptId:'qa-attempt-aborted',expectedVersion:1});
  assert(retry.status==='committed'&&retry.version===2,'Aborted attempt ID is not left behind');
  a.close();a=null;b.close();b=null;
  reopened=await store.open();const persisted=await store.read(reopened);reopened.close();reopened=null;
  assert(persisted.version===2&&!!persisted.snapshot.records.word3,'Committed state survives reopen');
  log('完成：所有测试通过。未触碰用户学习数据。');
 }catch(e){log('FAIL '+String(e?.stack||e),false)}
 finally{
  try{a?.close();b?.close();reopened?.close();await deleteDB(name);log('临时 QA 数据库已清理')}catch(e){log('临时 QA 数据库清理失败：'+String(e),false)}
  button.disabled=false;
 }
};
</script></body></html>
