<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAI Word · 6条Sense隔离教学预览</title><style>body{font-family:-apple-system,"PingFang SC",sans-serif;max-width:660px;margin:auto;padding:18px;background:#f4f7fa;color:#152b3e}a{color:#1864bb}.warn{background:#fff2ca;padding:14px;border-radius:12px;font-size:14px;line-height:1.6}.card{background:white;padding:24px 16px;border-radius:22px;margin:16px 0;min-height:390px;box-shadow:0 6px 26px #20304013}#w{text-align:center;font-size:50px;font-weight:750;margin:25px 0 6px}#ipa{text-align:center;color:#64778b}#prompt{font-size:20px;line-height:1.6;margin:30px 0;text-align:center}#answer{background:#eaf3fc;padding:15px;border-radius:12px;line-height:1.7}button{min-height:46px;padding:10px;border:1px solid #d1dce8;border-radius:12px;background:white;font-size:15px}button.sel{background:#d5e8ff;border-color:#438cd2}.row{display:flex;gap:8px;justify-content:space-between;margin-top:13px}.row button{flex:1}.muted{font-size:12px;color:#687788}#show{width:100%;background:#2168bb;color:white}#speaker{min-width:48px}</style></head><body><a href="index.html">← 返回完整PAI Word</a><h2>英文Core20K教学隔离体验</h2><div class="warn"><b>Staging · 非正式KU</b>：6条Sense候选通过L2 AI内容审阅，但未正式认证或注册。本页不读取或写入正式SRS、学习记录及系统设置；评分仅保存在本页临时内存中。</div><p><label><input type="checkbox" id="auto"> 自动浏览（6秒/题）</label>　<label><input type="checkbox" id="voice"> 自动发音</label></p><div class="card"><div id="count" class="muted"></div><div id="w"></div><div id="ipa"></div><p style="text-align:center"><button id="speaker" aria-label="手动发音">🔊</button></p><div id="prompt"></div><button id="show">显示答案</button><div id="answer" hidden></div><p id="ident" class="muted"></p></div><div class="row"><button data-v="不认识">不认识</button><button data-v="模糊">模糊</button><button data-v="认识">认识</button></div><div class="row"><button id="prev">← 上一题</button><button id="pause">暂停</button><button id="next">下一题 →</button></div><p class="muted">可左右滑动切题，评分可反复修改。刷新即清空临时评分。手动喇叭始终可以发音。来源Git blob：2d7e17509adaec37c04cb5854549ca51a62d864a</p><script>
const data=[{"w":"person","ipa":"/ˈpɝː.sən/","p":"In the sentence 'One person is waiting outside', what does person mean?","a":"一个人；个人","en":"One person is waiting outside.","zh":"有一个人在外面等候。","k":"w_0266_person_ku01","s":"w_0266_person_s01","h":"core20k:rank:108"},{"w":"time","ipa":"/taɪm/","p":"In 'We need more time to finish', what does time mean?","a":"时间；完成事情所需的时长","en":"We need more time to finish.","zh":"我们需要更多时间才能完成。","k":"w_0049_time_ku01","s":"w_0049_time_s01","h":"core20k:rank:111"},{"w":"know","ipa":"/noʊ/","p":"In 'I know the answer', what does know mean?","a":"知道；了解","en":"I know the answer.","zh":"我知道答案。","k":"w_0041_know_ku01","s":"w_0041_know_s01","h":"core20k:rank:138"},{"w":"people","ipa":"/ˈpiː.pəl/","p":"In 'Many people live here', what does people mean?","a":"人们；许多人","en":"Many people live here.","zh":"许多人住在这里。","k":"w_0057_people_ku01","s":"w_0057_people_s01","h":"core20k:rank:142"},{"w":"talk","ipa":"/tɑːk/","p":"In 'We talk every evening', what does talk mean?","a":"交谈；说话","en":"We talk every evening.","zh":"我们每天晚上交谈。","k":"w_0139_talk_ku01","s":"w_0139_talk_s01","h":"core20k:rank:145"},{"w":"here","ipa":"/hɪr/","p":"In 'Please come here', what does here mean?","a":"这里；到这里","en":"Please come here.","zh":"请到这里来。","k":"w_0099_here_ku01","s":"w_0099_here_s01","h":"core20k:rank:153"}];let i=0,shown=false,paused=false,timer=null,touch=null;const marks=new Map();const $=id=>document.getElementById(id);
function speak(){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(data[i].w);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
function draw(){const r=data[i];$('count').textContent=(i+1)+' / '+data.length+' · Sense';$('w').textContent=r.w;$('ipa').textContent=r.ipa;$('prompt').textContent=r.p;$('answer').textContent=r.a+' · '+r.en+' — '+r.zh;$('answer').hidden=!shown;$('show').hidden=shown;$('ident').textContent='Staging KU: '+r.k+' · Sense: '+r.s;document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('sel',marks.get(r.k)===b.dataset.v));if($('voice').checked)speak()}
function schedule(){clearTimeout(timer);if($('auto').checked&&!paused)timer=setTimeout(()=>step(1),6000)}
function step(d){i=(i+d+data.length)%data.length;shown=false;draw();schedule()}
$('speaker').onclick=speak;$('show').onclick=()=>{shown=true;draw();schedule()};$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('auto').onchange=()=>{paused=false;schedule()};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'恢复':'暂停';schedule()};document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{marks.set(data[i].k,b.dataset.v);shown=true;draw();schedule()});addEventListener('touchstart',e=>{touch=e.touches[0].clientX},{passive:true});addEventListener('touchend',e=>{if(touch===null)return;const delta=e.changedTouches[0].clientX-touch;if(Math.abs(delta)>70)step(delta<0?1:-1);touch=null},{passive:true});document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(timer);speechSynthesis?.cancel()}else schedule()});draw();
</script></body></html>
