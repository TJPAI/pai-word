<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>PAI Word · 教学内容临时预览</title><style>*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f8fb;color:#1c2330;margin:0}.wrap{max-width:620px;margin:0 auto;padding:18px 16px 48px}.notice{font-size:13px;line-height:1.6;color:#71501b;background:#fff6df;border:1px solid #f1dfa9;padding:12px 14px;border-radius:12px;margin-bottom:16px}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}.tabs button{background:white;border:1px solid #dce1eb;border-radius:20px;padding:9px 14px;font-size:15px;cursor:pointer}.tabs button[aria-pressed=true]{background:#1d416e;color:#fff;border-color:#1d416e}.card{background:white;border:1px solid #e4e7ee;border-radius:20px;padding:24px 22px;box-shadow:0 5px 24px #1d2b4410}.word{font-size:32px;font-weight:750;letter-spacing:-.6px}.ipa{color:#687586;margin-top:4px}.answer-section{padding:18px 0;border-top:1px solid #edf0f5}.answer-label{font-size:13px;color:#7b8797;margin-bottom:9px}.definition-line{display:flex;align-items:center;gap:10px}.pos-chip{font-size:12px;border-radius:7px;background:#edf3fa;color:#42658c;padding:5px 8px}.definition{font-size:23px;font-weight:650}.english{font-size:17px;line-height:1.6}.translation{color:#687586;margin-top:8px;line-height:1.7}.empty{color:#9aa3af;font-size:13px}.foot{font-size:12px;color:#7c8795;line-height:1.7;margin-top:18px}h1{font-size:20px;margin:5px 0 7px}.subtitle{font-size:14px;color:#697586}</style></head><body><main class="wrap"><h1>PAI Word · 答案页教学内容预览</h1><div class="subtitle">沿用现有答案页的信息组织方式，临时展示真实教学包中的六个KU</div><div class="notice"><b>仅供隔离预览，非正式教学发布。</b>数据来自Batch93 Staging，尚未满足生产发布门禁。本页不加载主学习系统，不记录评分，不修改SRS、用户数据或冻结Runtime。</div><nav class="tabs" id="tabs" aria-label="选择KU"></nav><article class="card" id="card"></article><p class="foot">展示规则：只展示源教学包实际存在的字段；搭配、辨析等没有数据时不虚构。此页面用于查看教学内容加入答案页后的效果，并非主系统已完成正式接入的证明。</p></main><script>const records=[{"headword":"person","ku_id":"w_0266_person_ku01","pos":"n.","us_ipa":"/ˈpɝː.sən/","gloss_zh":"人；个人","gloss_en":"individual human being","example_en":"One person is waiting outside.","example_zh":"有一个人在外面等候。","explanation_zh":"人；个人","quality_status":"AI_REVIEWED_STAGING"},{"headword":"time","ku_id":"w_0049_time_ku01","pos":"n.","us_ipa":"/taɪm/","gloss_zh":"时间；时长","gloss_en":"measurable duration","example_en":"We need more time to finish.","example_zh":"我们需要更多时间才能完成。","explanation_zh":"时间；时长","quality_status":"AI_REVIEWED_STAGING"},{"headword":"know","ku_id":"w_0041_know_ku01","pos":"v.","us_ipa":"/noʊ/","gloss_zh":"知道；了解","gloss_en":"possess information","example_en":"I know the answer.","example_zh":"我知道答案。","explanation_zh":"知道；了解","quality_status":"AI_REVIEWED_STAGING"},{"headword":"people","ku_id":"w_0057_people_ku01","pos":"n.","us_ipa":"/ˈpiː.pəl/","gloss_zh":"人们；人","gloss_en":"human beings collectively","example_en":"Many people live here.","example_zh":"许多人住在这里。","explanation_zh":"人们；人","quality_status":"AI_REVIEWED_STAGING"},{"headword":"talk","ku_id":"w_0139_talk_ku01","pos":"v.","us_ipa":"/tɑːk/","gloss_zh":"说话；交谈","gloss_en":"speak or converse","example_en":"We talk every evening.","example_zh":"我们每天晚上交谈。","explanation_zh":"说话；交谈","quality_status":"AI_REVIEWED_STAGING"},{"headword":"here","ku_id":"w_0099_here_ku01","pos":"adv.","us_ipa":"/hɪr/","gloss_zh":"这里；在这里","gloss_en":"at or to this place","example_en":"Please come here.","example_zh":"请到这里来。","explanation_zh":"这里；在这里","quality_status":"AI_REVIEWED_STAGING"}];const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const tabs=document.getElementById("tabs"),card=document.getElementById("card");function render(i){const r=records[i];tabs.innerHTML=records.map((x,j)=>'<button type="button" aria-pressed="'+(i===j)+'" data-i="'+j+'">'+esc(x.headword)+'</button>').join("");card.innerHTML='<div class="word">'+esc(r.headword)+'</div><div class="ipa">美 '+esc(r.us_ipa)+'</div><section class="answer-section"><div class="answer-label">释义</div><div class="definition-line"><span class="pos-chip">'+esc(r.pos)+'</span><div class="definition">'+esc(r.gloss_zh)+'</div></div></section><section class="answer-section"><div class="answer-label">英文释义</div><div class="english">'+esc(r.gloss_en)+'</div></section><section class="answer-section"><div class="answer-label">例句</div><div class="english">'+esc(r.example_en)+'</div><div class="translation">'+esc(r.example_zh)+'</div></section>'+(r.explanation_zh&&r.explanation_zh!==r.gloss_zh?'<section class="answer-section"><div class="answer-label">教学解释</div>'+esc(r.explanation_zh)+'</section>':'')+'<div class="foot">KU：'+esc(r.ku_id)+'<br>内容状态：'+esc(r.quality_status)+'</div>';}tabs.addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(b)render(Number(b.dataset.i))});render(0);</script></body></html>
