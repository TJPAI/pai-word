<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAI Word · B93 教学预览</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#192b39;background:#f5f7f9}*{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:auto;padding:22px 16px 64px}h1{font-size:25px;margin:0 0 8px}.warning{background:#fff1d6;border:1px solid #d7a748;border-radius:12px;padding:14px;line-height:1.6;margin:16px 0 22px}.tag{display:inline-block;background:#9d3c18;color:white;border-radius:6px;padding:4px 9px;font-weight:750;letter-spacing:.03em}p{line-height:1.6}.nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.nav button{border:1px solid #c8d3df;background:white;border-radius:9px;padding:10px 14px;font-size:15px;cursor:pointer}.nav button.active{background:#193d60;color:white}.card{background:white;border:1px solid #e2e8ef;border-radius:18px;padding:24px;box-shadow:0 6px 24px #152d4010}.word{font-size:39px;font-weight:750}.ipa{color:#657887;margin-top:5px}.gloss{font-size:24px;font-weight:650;margin:20px 0 8px}.en{font-size:21px;line-height:1.5;margin:18px 0 5px}.zh{font-size:17px;color:#425568;line-height:1.6}.label{font-size:12px;color:#647789;font-weight:700;margin-top:20px}.meta{font-size:12px;color:#667;overflow-wrap:anywhere;margin-top:22px}a{color:#174c83}.error{color:#a32323}</style></head>
<body><main class="wrap"><h1>PAI Word · 英文教学答案页预览</h1><p>Batch 93 · 6条Sense教学记录</p><div class="warning"><span class="tag">STAGING_ONLY · 未认证</span><div>仅用于展示教学内容，不属于正式学习。无评分、无SRS、无学习记录写入，不修改正式Core20K Runtime。旧KU身份与当前Runtime尚未完成精确匹配。</div></div><nav id="nav" class="nav" aria-label="选择单词"></nav><section id="card" class="card" aria-live="polite">正在加载教学内容…</section><p class="meta">数据来源：英文教学生产线 Batch 93（AI_REVIEWED_STAGING，非独立语义认证）。<a href="./">返回PAI Word学习系统</a></p></main>
<script>
(async function(){
const card=document.getElementById('card'),nav=document.getElementById('nav');
try{
const response=await fetch('./batch93-staging-preview.json',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);
const pack=await response.json();if(pack.status!=='STAGING_ONLY'||pack.schema_version!=='pai-core20k-teaching-preview-v1'||!Array.isArray(pack.records)||pack.records.length!==6||pack.records.some(x=>x.content_certified!==false||x.production_ready!==false))throw Error('隔离状态校验失败');
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const show=i=>{const x=pack.records[i];if(!x)return;nav.querySelectorAll('button').forEach((b,j)=>{b.classList.toggle('active',i===j);b.setAttribute('aria-pressed',String(i===j))});card.innerHTML='<div class="word">'+escape(x.headword)+'</div><div class="ipa">'+escape(x.us_ipa)+'</div><div class="label">中文释义</div><div class="gloss">'+escape(x.gloss_zh)+'</div><div class="label">英文释义</div><p>'+escape(x.gloss_en)+'</p><div class="label">英文例句</div><div class="en">'+escape(x.example_en)+'</div><div class="label">例句中文翻译</div><div class="zh">'+escape(x.example_zh)+'</div><div class="meta">原始KU ID：'+escape(x.ku_id)+'<br>身份状态：尚未与当前Runtime精确确认<br>认证状态：STAGING_ONLY</div>';};
pack.records.forEach((x,i)=>{const b=document.createElement('button');b.type='button';b.textContent=x.headword;b.onclick=()=>show(i);nav.appendChild(b)});show(0);
}catch(e){card.classList.add('error');card.textContent='预览数据加载失败：'+String(e.message||e)}
})();
</script></body></html>
