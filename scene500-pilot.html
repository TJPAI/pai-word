<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PAI Word · Scene500 Pilot</title><meta name="theme-color" content="#f6f7f9"><style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",system-ui,sans-serif}.wrap{max-width:980px;margin:auto;padding:18px 16px 90px}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}h1{font-size:24px;margin:0 0 7px}.sub{color:var(--muted);font-size:13px;line-height:1.5}.badge{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.scene{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;min-height:125px;display:flex;flex-direction:column;justify-content:space-between}.scene:active{transform:scale(.99)}.scene h2{font-size:17px;margin:0 0 10px}.meta{font-size:12px;color:var(--muted)}.count{margin-top:16px;font-size:13px;font-weight:600}.panel{display:none}.panel.on{display:block}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}.back{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font-size:14px}.title{font-size:20px;font-weight:700}.progress{color:var(--muted);font-size:13px;margin-left:auto}.card{background:#fff;border:1px solid var(--line);border-radius:22px;min-height:390px;padding:28px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.rank{font-size:12px;color:var(--muted);margin-bottom:16px}.word{font-size:44px;line-height:1.05;font-weight:750;letter-spacing:-1px}.ipa{margin-top:10px;color:var(--muted);font-size:16px}.pos{margin-top:18px;font-size:13px;border:1px solid var(--line);padding:5px 8px;border-radius:999px}.meaning{font-size:22px;line-height:1.5;margin-top:22px;max-width:680px}.ku{font-size:13px;color:var(--muted);margin-top:10px}.rich{display:none;margin-top:18px;width:100%;max-width:680px;border-top:1px solid var(--line);padding-top:16px;text-align:left;white-space:pre-wrap;line-height:1.55;font-size:14px}.rich.on{display:block}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.btn{border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:650}.secondary{background:#fff;border:1px solid var(--line)}.primary{background:var(--accent);color:#fff}.status{padding:30px;text-align:center;color:var(--muted)}.note{margin-top:16px;color:var(--muted);font-size:12px;line-height:1.5}@media(max-width:680px){.grid{grid-template-columns:1fr}.word{font-size:40px}.card{min-height:360px}header{display:block}.badge{display:inline-block;margin-top:10px}}</style></head><body><div class="wrap">
<header><div><h1>Scene500 · 真词卡 Pilot</h1><div class="sub">10个代表性组合场景 · 直接读取 Core-13000 / 16,616 KU · 不复制词库</div></div><div class="badge">PILOT · pending editorial review</div></header>
<div id="status" class="status">正在加载 Core-13000 目录…</div><div id="home" class="panel"><div id="grid" class="grid"></div><div class="note">说明：本页用于体验新“组合场景 → KU词卡”交互。词条来自当前 Core-13000；场景内选词为保守 pilot，不代表正式已验证的 Scene500 映射。</div></div>
<div id="study" class="panel"><div class="toolbar"><button class="back" id="back">← 场景</button><div class="title" id="sceneTitle"></div><div class="progress" id="progress"></div></div><div class="card"><div class="rank" id="rank"></div><div class="word" id="word"></div><div class="ipa" id="ipa"></div><div class="pos" id="pos"></div><div class="meaning" id="meaning"></div><div class="ku" id="ku"></div><div class="rich" id="rich"></div></div><div class="actions"><button class="btn secondary" id="reveal">显示完整词卡</button><button class="btn primary" id="next">下一个</button></div></div>
</div><script>
const ROOT='data/learning-v3/';
const PILOT=[
{id:'CS001',name:'第一次见面并互相介绍',words:['hello','introduce','name','meet','stranger','friend','welcome','greet','conversation','contact']},
{id:'CS023',name:'看菜单、点菜并说明口味',words:['menu','order','dish','meal','taste','spicy','sweet','salt','waiter','restaurant']},
{id:'CS031',name:'步行问路并确认方向',words:['direction','map','street','turn','straight','left','right','corner','nearby','route']},
{id:'CS046',name:'机场值机、托运和安检',words:['airport','flight','passport','luggage','baggage','check','security','gate','boarding','ticket']},
{id:'CS051',name:'描述身体部位、症状和疼痛',words:['pain','headache','fever','symptom','stomach','throat','cough','hurt','sick','doctor']},
{id:'CS062',name:'课堂听讲、提问和记笔记',words:['lecture','question','answer','note','class','teacher','student','explain','understand','example']},
{id:'CS072',name:'阅读招聘信息并准备简历',words:['job','career','resume','skill','experience','position','apply','candidate','salary','employer']},
{id:'CS076',name:'安排、参加并主持会议',words:['meeting','schedule','agenda','attend','participant','discuss','chair','present','decision','minutes']},
{id:'CS081',name:'电脑、手机和文件管理',words:['computer','phone','file','folder','screen','keyboard','download','upload','software','device']},
{id:'CS116',name:'讨论气候变化、能源和可持续发展',words:['climate','energy','environment','carbon','pollution','renewable','sustainable','emission','resource','recycle']}
];
let manifest,catalog,byLemma=new Map(),scene=null,index=0,current=null,chunkCache=new Map();
const $=id=>document.getElementById(id);
function show(id){for(const x of ['home','study'])$(x).classList.remove('on');$(id).classList.add('on')}
async function ungzipB64(text){if(!('DecompressionStream'in window))throw Error('当前浏览器不支持 gzip 解压');const bytes=Uint8Array.from(atob(text.trim()),c=>c.charCodeAt(0));const raw=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();return JSON.parse(new TextDecoder().decode(raw))}
async function loadAsset(file){const r=await fetch(ROOT+file);if(!r.ok)throw Error('词库文件加载失败：'+file);return ungzipB64(await r.text())}
async function init(){try{manifest=await fetch(ROOT+'manifest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('manifest加载失败');return r.json()});catalog=await loadAsset(manifest.catalog.file);for(const row of catalog){const [rank,lemma,pos,senses]=row;const item={rank,lemma,pos,senses};if(!byLemma.has(lemma))byLemma.set(lemma,[]);byLemma.get(lemma).push(item)}$('status').remove();renderHome();show('home')}catch(e){$('status').textContent='加载失败：'+e.message}}
function resolveScene(s){return s.words.map(w=>{const found=byLemma.get(w)?.[0];if(!found)return null;const sense=found.senses?.[0];return sense?{...found,sense}:null}).filter(Boolean)}
function renderHome(){const g=$('grid');g.innerHTML='';for(const s of PILOT){const units=resolveScene(s);const d=document.createElement('div');d.className='scene';d.innerHTML=`<div><h2>${s.name}</h2><div class="meta">${s.id} · 保守 pilot</div></div><div class="count">${units.length} 个真实 Core-13000 词条 →</div>`;d.onclick=()=>openScene(s);g.appendChild(d)}}
function openScene(s){scene={...s,units:resolveScene(s)};index=0;$('sceneTitle').textContent=s.name;show('study');renderCard()}
function renderCard(){if(!scene?.units.length)return;current=scene.units[index];const [kuId,oldScene,kuType,kuTitle,sp,meaning]=current.sense;$('progress').textContent=`${index+1} / ${scene.units.length}`;$('rank').textContent=`Core-13000 #${current.rank}`;$('word').textContent=current.lemma;$('ipa').textContent='';$('pos').textContent=sp||current.pos||'';$('meaning').textContent=meaning||'—';$('ku').textContent=`KU ${kuId} · ${kuType||''}${kuTitle?' · '+kuTitle:''}`;$('rich').classList.remove('on');$('rich').textContent='';$('reveal').textContent='显示完整词卡'}
async function hydrate(){if(!current)return;const ci=Math.floor((current.rank-1)/manifest.chunkSize);let rows=chunkCache.get(ci);if(!rows){rows=await loadAsset(manifest.chunks[ci].file);chunkCache.set(ci,rows)}const full=rows.find(x=>x.rank===current.rank);if(!full)return;const [kuId]=current.sense;const parts=[];if(full.ipaUS)$('ipa').textContent='/'+String(full.ipaUS).replace(/^\/?|\/?$/g,'')+'/';if(full.root)parts.push('词根/词源：'+full.root);const rich=full.rich?.[kuId];if(rich){if(typeof rich==='string')parts.push(rich);else parts.push(JSON.stringify(rich,null,2))}if(Array.isArray(full.allSenses)&&full.allSenses.length)parts.push('其他义项：'+full.allSenses.map(x=>typeof x==='string'?x:JSON.stringify(x)).join('；'));$('rich').textContent=parts.length?parts.join('\n\n'):'该 KU 暂无更多富内容。';$('rich').classList.add('on');$('reveal').textContent='已显示完整词卡'}
$('back').onclick=()=>show('home');$('next').onclick=()=>{if(!scene)return;index=(index+1)%scene.units.length;renderCard()};$('reveal').onclick=()=>hydrate().catch(e=>{$('rich').textContent='加载完整词卡失败：'+e.message;$('rich').classList.add('on')});
init();
</script></body></html>
