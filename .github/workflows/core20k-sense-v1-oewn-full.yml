name: Core20K Sense V1 OEWN full 20K
on:
  workflow_dispatch:
  push:
    branches: [core20k-sense-v1-audit-20261027]
    paths:
      - 'tools/core20k_sense_v1/oewn_full20k.py'
      - 'tools/core20k_sense_v1/align_oewn_runtime.py'
      - '.github/workflows/core20k-sense-v1-oewn-full.yml'
jobs:
  full_alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'wn>=0.13,<1'
      - run: python -c "import wn; wn.download('oewn:2024')"
      - run: python tools/core20k_sense_v1/oewn_full20k.py
      - name: Cross-align OEWN candidates and existing Sense-KUs
        run: python tools/core20k_sense_v1/align_oewn_runtime.py
      - uses: actions/upload-artifact@v4
        with:
          name: sense-v1-oewn-full20k
          path: |
            tools/core20k_sense_v1/reports/oewn_full20k_sense_candidates.jsonl
            tools/core20k_sense_v1/reports/oewn_full20k_summary.json
            tools/core20k_sense_v1/reports/oewn_vs_runtime_review.jsonl
            tools/core20k_sense_v1/reports/oewn_runtime_alignment_summary.json
          retention-days: 30
