name: Core20K ENLEX ENTEACH staging handoff
on:
  workflow_dispatch:
  push:
    branches: [core20k-sense-v1-audit-20261027]
    paths:
      - 'tools/core20k_sense_v1/build_enlex_enteach_staging.py'
      - '.github/workflows/core20k-enlex-enteach-staging.yml'
jobs:
  staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/core20k_sense_v1/build_enlex_enteach_staging.py
      - uses: actions/upload-artifact@v4
        with:
          name: core20k-enlex-enteach-staging-20k
          path: tools/core20k_sense_v1/reports/enlex_enteach_handoff/
          retention-days: 30
