name: CG ENLEX Muse Integrated Pack V1
on:
  push:
    branches: [experiment/enlex-v3-production-rebuild-20261030]
    paths:
      - tools/core20k_lexicon/production_v3/build_mu_integrated_v1.py
      - .github/workflows/cg-enlex-mu-integrated-v1.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/core20k_lexicon/production_v3/build_mu_integrated_v1.py
      - shell: bash
        run: |
          set -euo pipefail
          D=tools/core20k_lexicon/production_v3/qa_reports/cg_enlex_mu_integrated_v1
          mkdir -p /tmp/mu-integrated
          cp "$D"/*.json* /tmp/mu-integrated/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin experiment/enlex-v3-production-rebuild-20261030
            git reset --hard origin/experiment/enlex-v3-production-rebuild-20261030
            mkdir -p "$D"; cp /tmp/mu-integrated/* "$D/"
            git add "$D"
            if git diff --cached --quiet; then break; fi
            git commit -m "CG ENLEX Muse integrated 27471 KU review candidate"
            if git push origin HEAD:experiment/enlex-v3-production-rebuild-20261030; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
          done
          python3 - <<'PY'
          import pathlib,json,hashlib
          d=pathlib.Path("tools/core20k_lexicon/production_v3/qa_reports/cg_enlex_mu_integrated_v1")
          m=json.loads((d/"summary.json").read_text());p=d/"integrated_review_pack.jsonl"
          assert m["total"]==27471 and m["conflicts"]==0
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m["sha256"]
          print("VERIFIED",m)
          PY
