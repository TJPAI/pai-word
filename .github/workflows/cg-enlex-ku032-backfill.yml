name: CG-ENLEX KU032 gap backfill
on:
  push:
    branches:
      - experiment/enlex-v3-production-rebuild-20261030
    paths:
      - .github/workflows/cg-enlex-ku032-backfill.yml
      - tools/core20k_lexicon/production_v3/backfill_gaps_032.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate gap-only KU drafts
        run: python3 tools/core20k_lexicon/production_v3/backfill_gaps_032.py
      - name: Validate and commit only new KU files
        run: |
          python3 tools/core20k_lexicon/production_v3/audit_coverage_fast.py /tmp/enlex_coverage_032.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/core20k_lexicon/production_v3/ku_drafts/v2/ku_recognition_032_*.jsonl
          if git diff --cached --quiet; then echo "No new KU"; exit 0; fi
          git commit -m "CG-ENLEX: gap-only KU032 50-record shards"
          git push origin HEAD:experiment/enlex-v3-production-rebuild-20261030
