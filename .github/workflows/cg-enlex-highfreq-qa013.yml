name: CG-ENLEX KU QA 013
on:
  push:
    branches: [experiment/enlex-v3-production-rebuild-20261030]
    paths: [.github/workflows/cg-enlex-highfreq-qa013.yml, tools/core20k_lexicon/production_v3/audit_highfreq_ku_batch013.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cg-enlex-qa-013
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/core20k_lexicon/production_v3/audit_highfreq_ku_batch013.py
      - name: Submit only missing groups with remote synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r tools/core20k_lexicon/production_v3/teaching_qa/batch013 /tmp/batch013-generated
          rm -rf tools/core20k_lexicon/production_v3/teaching_qa/batch013
          for n in $(seq -w 1 10); do
            file="tools/core20k_lexicon/production_v3/teaching_qa/batch013/qa_recognition_013_${n}.jsonl"
            for attempt in 1 2 3 4 5 6 7 8; do
              git fetch origin experiment/enlex-v3-production-rebuild-20261030
              git reset --hard origin/experiment/enlex-v3-production-rebuild-20261030
              if [ -f "$file" ]; then break; fi
              mkdir -p "$(dirname "$file")"
              cp "/tmp/batch013-generated/qa_recognition_013_${n}.jsonl" "$file"
              git add "$file"
              git commit -m "CG-ENLEX Batch013 group ${n} (50)"
              if git push origin HEAD:experiment/enlex-v3-production-rebuild-20261030; then break; fi
              if [ "$attempt" -eq 8 ]; then exit 1; fi
            done
          done
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin experiment/enlex-v3-production-rebuild-20261030
            git reset --hard origin/experiment/enlex-v3-production-rebuild-20261030
            file="tools/core20k_lexicon/production_v3/teaching_qa/batch013/summary.json"
            if [ -f "$file" ]; then break; fi
            cp /tmp/batch013-generated/summary.json "$file"
            git add "$file"
            git commit -m "CG-ENLEX Batch013 summary"
            if git push origin HEAD:experiment/enlex-v3-production-rebuild-20261030; then break; fi
            if [ "$attempt" -eq 8 ]; then exit 1; fi
          done
