name: Core20K Full OEWN Sense Source Extraction
on:
  workflow_dispatch:
  push:
    branches: [core20k-sense-v1-audit-20261027]
    paths:
      - tools/core20k_sense_v1/oewn2025_full20k.py
      - tools/core20k_sense_v1/join_editorial_full20k.py
      - tools/core20k_sense_v1/pack_full20k_oewn_sense_ku.py
      - tools/core20k_sense_v1/inventory_oewn_gap_fallback.py
      - tools/core20k_sense_v1/merge_runtime_fallback_20k.py
      - tools/core20k_sense_v1/triage_remaining487_sources.py
      - tools/core20k_sense_v1/merge_all_native_runtime_ku.py
      - tools/core20k_sense_v1/build_all_source_sense_teaching.py
      - .github/workflows/core20k-full-oewn-sources.yml
jobs:
  full-oewn-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "wn>=0.13,<2"
      - run: python -c "import wn; wn.download('oewn:2025')"
      - name: Extract source-linked Sense candidates for all 20000 frozen headwords
        run: python3 tools/core20k_sense_v1/oewn2025_full20k.py
      - name: Package full20k sourced Sense/definition-KU drafts in 40 batches
        run: python3 tools/core20k_sense_v1/pack_full20k_oewn_sense_ku.py
      - name: Restore verified historical bilingual editorial drafts
        uses: actions/download-artifact@v4
        with:
          name: core20k-v21-missing-review-batch001-500
          run-id: 40670776773
          github-token: ${{ github.token }}
          path: .
      - name: Attach historical original-context KU drafts to full OEWN packs
        run: python3 tools/core20k_sense_v1/join_editorial_full20k.py
      - name: Classify OEWN no-match headwords using frozen runtime source evidence
        run: python3 tools/core20k_sense_v1/inventory_oewn_gap_fallback.py
      - name: Merge native Core20K source Sense and KU candidates for OEWN gaps
        run: python3 tools/core20k_sense_v1/merge_runtime_fallback_20k.py
      - name: Triage 487 remaining source gaps with alternative OEWN spelling forms
        run: python3 tools/core20k_sense_v1/triage_remaining487_sources.py
      - name: Preserve native runtime Sense/KU records across full Core20K staging
        run: python3 tools/core20k_sense_v1/merge_all_native_runtime_ku.py
      - name: Materialize 60204 Sense-specific English recognition lesson drafts
        run: python3 tools/core20k_sense_v1/build_all_source_sense_teaching.py
      - uses: actions/upload-artifact@v4
        with:
          name: core20k-oewn2025-full-source-candidates
          path: |
            tools/core20k_sense_v1/reports/oewn-full20k-staging/
            tools/core20k_sense_v1/reports/oewn2025_full20k_sense_candidates.jsonl
            tools/core20k_sense_v1/reports/oewn2025_full20k_summary.json
          retention-days: 30
