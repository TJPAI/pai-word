name: CG-ENLEX high-frequency KU QA 008
on:
  push:
    branches: [experiment/enlex-v3-production-rebuild-20261030]
    paths: [.github/workflows/cg-enlex-highfreq-qa008.yml, tools/core20k_lexicon/production_v3/audit_highfreq_ku_batch008.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cg-enlex-highfreq-qa-008
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/core20k_lexicon/production_v3/audit_highfreq_ku_batch008.py
      - name: Commit missing groups with safe rebased retries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for n in $(seq -w 1 10); do
            file="tools/core20k_lexicon/production_v3/teaching_qa/batch008/qa_recognition_008_${n}.jsonl"
            for attempt in 1 2 3 4 5; do
              git fetch origin experiment/enlex-v3-production-rebuild-20261030
              git rebase origin/experiment/enlex-v3-production-rebuild-20261030
              if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
                break
              fi
              git add "$file"
              git commit -m "CG-ENLEX Batch008 recovered group ${n} (50)"
              if git push origin HEAD:experiment/enlex-v3-production-rebuild-20261030; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
            done
          done
          git fetch origin experiment/enlex-v3-production-rebuild-20261030
          git rebase origin/experiment/enlex-v3-production-rebuild-20261030
          git add tools/core20k_lexicon/production_v3/teaching_qa/batch008/summary.json
          git diff --cached --quiet || git commit -m "CG-ENLEX: recover Batch008 summary"
          git push origin HEAD:experiment/enlex-v3-production-rebuild-20261030
