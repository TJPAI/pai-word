name: CG-ENLEX lexical review overlay QA
on:
  push:
    branches:
      - experiment/enlex-v3-production-rebuild-20261030
    paths:
      - .github/workflows/cg-enlex-lexical-overlay.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/core20k_lexicon/production_v3/merge_lexical_reviews.py
      - name: Publish validated draft overlay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/core20k_lexicon/production_v3/lexical_review_overlay_v1.jsonl tools/core20k_lexicon/production_v3/lexical_review_overlay_v1_summary.json
          git diff --cached --quiet || git commit -m "CG-ENLEX: publish validated 539-entry draft lexical overlay"
          git push origin HEAD:experiment/enlex-v3-production-rebuild-20261030
