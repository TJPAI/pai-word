name: Core20K V2.1 Collocation27 authority audit
on:
  workflow_dispatch:
  push:
    branches: [core20k-sense-v1-audit-20261027]
    paths:
      - 'tools/core20k_sense_v1/editorial/triage_legacy_collocations27.py'
      - '.github/workflows/core20k-v21-collocation27-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/core20k_sense_v1/editorial/triage_legacy_collocations27.py
      - uses: actions/upload-artifact@v4
        with:
          name: core20k-v21-collocation27-authority-audit
          path: |
            tools/core20k_sense_v1/editorial/v21_batch27_collocation_authority_triage.jsonl
            tools/core20k_sense_v1/editorial/v21_batch27_collocation_authority_summary.json
