name: CG-REC-EVAL Scene1341 independent lexical A/B
on:
  push:
    branches: [cg-rec-eval-isolated-20261027]
    paths:
      - '.github/workflows/cg-rec-eval-scene1341.yml'
      - 'tools/cg-rec-eval/scene1341-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scene1341-lexical-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: evaluation
      - uses: actions/checkout@v4
        with:
          repository: TJPAI/pai-word
          ref: 17c6c758e1dfd27cfa2fe1669d3f1784bedb0668
          path: source-data
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: TJPAI/pai-word
          ref: 83a94cb1b6fd2a08143886b6be845ebc408e41e8
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: TJPAI/pai-word
          ref: e5c1f2dbf8e7958639f034273b5a502fe7d5bf69
          path: browser
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: TJPAI/pai-word
          ref: 2d143b98953a3010e72ae51059ea7557eeef1aec
          path: candidate-latest
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: TJPAI/pai-word
          ref: 111539d59691e4032da215580e533822fcbb6f41
          path: candidate-browser
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: TJPAI/pai-word
          ref: fbe6dc1fc71a294165f3d361655d05b2d9d65dd1
          path: browser-current
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: TJPAI/pai-word
          ref: 8ea1addac4dcd2df766bb6bed0e92a493e0c1463
          path: candidate-current
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned Scene1341 source identities
        run: |
          set -euo pipefail
          test "$(git -C source-data rev-parse HEAD)" = "17c6c758e1dfd27cfa2fe1669d3f1784bedb0668"
          test "$(git -C candidate rev-parse HEAD)" = "83a94cb1b6fd2a08143886b6be845ebc408e41e8"
          test "$(git -C source-data hash-object tools/integration/scene1341-ranked/manifest.json)" = "803d2fccfd2d1ec200723f7f38e73d57495a5dd0"
          test "$(git -C source-data hash-object tools/integration/scene1341-source/PAI_Word_Scene50_V1.5_Structural_Catalog.csv)" = "56e3761d968e20cf6d8c89009e0f6744a2a387b8"
          for v in $(seq 51 61); do test -s "source-data/tools/integration/scene1341-ranked/v${v}-ranked.csv"; done
      - name: Install independent evaluator only
        run: |
          mkdir -p candidate/tools/cg-rec-eval
          cp evaluation/tools/cg-rec-eval/scene1341-evaluate.mjs candidate/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/scene1341-negation-audit.mjs candidate/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/scene1341-old-vs-fixed.mjs candidate/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/scene1341-browser-core-parity.mjs candidate/tools/cg-rec-eval/
      - name: Execute true engine vs title-only A/B on 22 provisional cases
        env:
          CG_REC_SHA: 83a94cb1b6fd2a08143886b6be845ebc408e41e8
        run: |
          set -euo pipefail
          cd candidate
          node tools/cg-rec-eval/scene1341-evaluate.mjs \
            ../source-data/tools/integration/scene1341-source/PAI_Word_Scene50_V1.5_Structural_Catalog.csv \
            ../source-data/tools/integration/scene1341-ranked \
            17c6c758e1dfd27cfa2fe1669d3f1784bedb0668 \
            803d2fccfd2d1ec200723f7f38e73d57495a5dd0 \
            ../evaluation/tools/cg-rec-eval/scene1341-provisional-22.v0.1.json \
            | tee ../scene1341-lexical-vs-title-ab22.json
      - name: Execute controlled negation Set.size source ablation
        run: |
          set -euo pipefail
          cd candidate
          node tools/cg-rec-eval/scene1341-negation-audit.mjs \
            ../source-data/tools/integration/scene1341-source/PAI_Word_Scene50_V1.5_Structural_Catalog.csv \
            ../source-data/tools/integration/scene1341-ranked \
            17c6c758e1dfd27cfa2fe1669d3f1784bedb0668 \
            803d2fccfd2d1ec200723f7f38e73d57495a5dd0 \
            | tee ../scene1341-negation-ablation14.json
      - name: Compare historical and fixed CG-REC on unchanged 22+14 queries
        run: |
          set -euo pipefail
          test "$(git -C candidate-latest rev-parse HEAD)" = "2d143b98953a3010e72ae51059ea7557eeef1aec"
          cd candidate
          node tools/cg-rec-eval/scene1341-old-vs-fixed.mjs \
            ../source-data/tools/integration/scene1341-source/PAI_Word_Scene50_V1.5_Structural_Catalog.csv \
            ../source-data/tools/integration/scene1341-ranked \
            17c6c758e1dfd27cfa2fe1669d3f1784bedb0668 \
            803d2fccfd2d1ec200723f7f38e73d57495a5dd0 \
            ../evaluation/tools/cg-rec-eval/scene1341-provisional-22.v0.1.json \
            ../scene1341-negation-ablation14.json \
            | tee ../scene1341-old-vs-fixed-36.json
      - name: Verify fixed Node ranker equals upstream browser-safe core on 72 paired cases
        run: |
          set -euo pipefail
          test "$(git -C candidate-browser rev-parse HEAD)" = "111539d59691e4032da215580e533822fcbb6f41"
          cd candidate
          node tools/cg-rec-eval/scene1341-browser-core-parity.mjs \
            ../source-data/tools/integration/scene1341-source/PAI_Word_Scene50_V1.5_Structural_Catalog.csv \
            ../source-data/tools/integration/scene1341-ranked \
            17c6c758e1dfd27cfa2fe1669d3f1784bedb0668 \
            803d2fccfd2d1ec200723f7f38e73d57495a5dd0 \
            ../evaluation/tools/cg-rec-eval/scene1341-provisional-22.v0.1.json \
            ../scene1341-negation-ablation14.json \
            | tee ../scene1341-browser-core-parity72.json
      - name: Compare exact browser home search with actual CG-REC candidate
        run: |
          set -euo pipefail
          mkdir -p browser/tools/cg-rec-eval
          cp evaluation/tools/cg-rec-eval/scene1341-browser-parity.mjs browser/tools/cg-rec-eval/
          cd browser
          node tools/cg-rec-eval/scene1341-browser-parity.mjs \
            ../source-data/tools/integration/scene1341-source/PAI_Word_Scene50_V1.5_Structural_Catalog.csv \
            ../source-data/tools/integration/scene1341-ranked \
            17c6c758e1dfd27cfa2fe1669d3f1784bedb0668 \
            803d2fccfd2d1ec200723f7f38e73d57495a5dd0 \
            ../evaluation/tools/cg-rec-eval/scene1341-provisional-22.v0.1.json \
            | tee ../scene1341-browser-vs-engine-27.json
      - name: Independently reject numeric-equivalent duplicate Scene1341 source ranks
        env:
          CG_REC_SHA: 8ea1addac4dcd2df766bb6bed0e92a493e0c1463
        run: |
          set -euo pipefail
          mkdir -p browser-current/tools/cg-rec-eval
          cp evaluation/tools/cg-rec-eval/scene1341-rank-canonical-mutation.mjs browser-current/tools/cg-rec-eval/
          cd browser-current
          node tools/cg-rec-eval/scene1341-rank-canonical-mutation.mjs \
            ../source-data/tools/integration/scene1341-source/PAI_Word_Scene50_V1.5_Structural_Catalog.csv \
            ../source-data/tools/integration/scene1341-ranked \
            17c6c758e1dfd27cfa2fe1669d3f1784bedb0668 \
            803d2fccfd2d1ec200723f7f38e73d57495a5dd0 \
            | tee ../scene1341-rank-collision-negative14.json
      - name: Check latest PR75 core with 3 scene-metadata tamper and 240 query-normalization probes
        env:
          CG_REC_SHA: 8ea1addac4dcd2df766bb6bed0e92a493e0c1463
        run: |
          set -euo pipefail
          mkdir -p browser-current/tools/cg-rec-eval
          cp evaluation/tools/cg-rec-eval/scene1341-metadata-query-normalization.mjs browser-current/tools/cg-rec-eval/
          cd browser-current
          node tools/cg-rec-eval/scene1341-metadata-query-normalization.mjs \
            ../source-data/tools/integration/scene1341-source/PAI_Word_Scene50_V1.5_Structural_Catalog.csv \
            ../source-data/tools/integration/scene1341-ranked \
            17c6c758e1dfd27cfa2fe1669d3f1784bedb0668 \
            803d2fccfd2d1ec200723f7f38e73d57495a5dd0 \
            ../evaluation/tools/cg-rec-eval/scene1341-blind-intake-24.v1.json \
            | tee ../scene1341-pr75-metadata-query-normalization.json
      - name: Collect latest CG-REC 32 nonblind diagnostic pairs with source QA invariants
        run: |
          set -euo pipefail
          node candidate-current/scene500-recommendation/qa/scene1341-nonblind-error-casebook.mjs \
            source-data/tools/integration/scene1341-source/PAI_Word_Scene50_V1.5_Structural_Catalog.csv \
            source-data/tools/integration/scene1341-ranked \
            17c6c758e1dfd27cfa2fe1669d3f1784bedb0668 \
            803d2fccfd2d1ec200723f7f38e73d57495a5dd0 \
            | tee scene1341-rec-nonblind-diagnostics32.json
          node --input-type=module -e "
            import fs from 'node:fs';
            const r=JSON.parse(fs.readFileSync('scene1341-rec-nonblind-diagnostics32.json','utf8'));
            if(r.caseCount!==32||r.queryExecutions!==64||r.independentGoldCount!==0||r.engineReleaseAllowed!==false)throw Error('NONBLIND_CASEBOOK_CONTRACT');
            if(r.cohorts?.length!==4||r.cohorts.some(x=>x.pairs!==8)||r.cases?.length!==32)throw Error('NONBLIND_COHORT_COUNTS');
            for(const c of r.cases)for(const q of [c.control,c.contrast]){
              if(q.top10.length>10||new Set(q.top10.map(x=>x.scene_id)).size!==q.top10.length)throw Error('DUPLICATE_OR_OVERLIMIT_SCENE');
            }
            console.log(JSON.stringify({status:'INDEPENDENT_NONBLIND_DIAGNOSTIC_CONTRACT_PASS',cases:32,queries:64,top1Changes:r.top1ChangedCount,empty:r.emptyQueryCount,formalGold:0}));
          "
      - name: Reconstruct the original source senses behind all 32 nonblind diagnostic pairs
        run: |
          set -euo pipefail
          node candidate-current/scene500-recommendation/qa/scene1341-casebook-provenance-trace.mjs \
            scene1341-rec-nonblind-diagnostics32.json \
            source-data/tools/integration/scene1341-source/PAI_Word_Scene50_V1.5_Structural_Catalog.csv \
            source-data/tools/integration/scene1341-ranked \
            17c6c758e1dfd27cfa2fe1669d3f1784bedb0668 \
            803d2fccfd2d1ec200723f7f38e73d57495a5dd0 \
            | tee scene1341-rec-diagnostics32-provenance.json
          node --input-type=module -e "
            import fs from 'node:fs';
            const r=JSON.parse(fs.readFileSync('scene1341-rec-diagnostics32-provenance.json','utf8'));
            if(r.caseCount!==32||r.cases?.length!==32||r.watched?.length!==4||r.sourceSenseRows!==19371||r.sourceSceneRows!==1341||r.independentGoldCount!==0||r.release_allowed!==false)throw Error('PROVENANCE_CONTRACT_INVALID');
            for(const c of r.cases)for(const k of ['control','contrast'])for(const item of c[k].results){
              if(!item.scene_name||!item.scene_category||!item.scene_id)throw Error('MISSING_SCENE_IDENTITY');
              if(item.matched_source_sense_id&&(!item.matched_source_expression||!item.matched_source_meaning||!item.source_shard))throw Error('MISSING_SOURCE_SENSE_PROVENANCE');
            }
            const lookup=(q,id)=>r.watched.find(w=>w.query===q)?.sceneDirectory.find(s=>s.scene_id===id);
            if(lookup('食物会不会过期','SC50-0046')?.retrievalRank!==1)throw Error('KNOWN_LEXICAL_NOISE_CHANGED_REVIEW_REQUIRED');
            console.log(JSON.stringify({status:'INDEPENDENT_PROVENANCE_AUDIT_PASS',pairs:32,sourceSenses:19371,sourceScenes:1341,watched:4,gold:0}));
          "
      - name: Validate independent source-linked four-risk nonblind triage
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const doc=JSON.parse(fs.readFileSync('evaluation/tools/cg-rec-eval/scene1341-nonblind-source-risk4.v1.json','utf8'));
            const source=JSON.parse(fs.readFileSync('scene1341-rec-diagnostics32-provenance.json','utf8'));
            if(doc.status!=='NONBLIND_SOURCE_ANCHORED_RISK_NOT_ADJUDICATED'||doc.certifiedGoldCount!==0||doc.productionReleaseAllowed!==false||doc.risks?.length!==4)throw Error('RISK_REGISTER_RELEASE_OR_GOLD_INVALID');
            for(const risk of doc.risks){
              const witness=source.watched.find(x=>x.query===risk.query);
              if(!witness||witness.context.results?.[0]?.scene_id!==risk.observedTop1||witness.context.results?.[0]?.scene_name!==risk.observedTop1Scene||risk.semanticVerdict!=='NOT_ADJUDICATED'||!risk.hypothesis||!risk.nextStep)throw Error('SOURCE_RISK_WITNESS_INVALID '+risk.id);
            }
            console.log(JSON.stringify({status:'FOUR_SOURCE_ANCHORED_NONBLIND_RISKS_VERIFIED',cases:4,verifiedTop1:4,blindGold:0,release:false}));
          "
      - name: Compare actual CG-MAIN browser opt-in with current CG-REC on frozen 41 queries
        env:
          CG_MAIN_SHA: fbe6dc1fc71a294165f3d361655d05b2d9d65dd1
          CG_REC_SHA: 8ea1addac4dcd2df766bb6bed0e92a493e0c1463
        run: |
          set -euo pipefail
          test "$(git -C browser-current rev-parse HEAD)" = "$CG_MAIN_SHA"
          test "$(git -C candidate-current rev-parse HEAD)" = "$CG_REC_SHA"
          test "$(git -C browser-current hash-object rebuild-preview/scene1341-search-core.mjs)" = "1271f3ea4eaea371ea4db89b43d42117ae2cc644"
          test "$(git -C candidate-current hash-object scene500-recommendation/scene1341-search-core.mjs)" = "9273661434948d48ecdd36c520f37f2a1da362c1"
          mkdir -p browser-current/tools/cg-rec-eval
          cp evaluation/tools/cg-rec-eval/scene1341-current-browser-ab.mjs browser-current/tools/cg-rec-eval/
          cd browser-current
          node tools/cg-rec-eval/scene1341-current-browser-ab.mjs \
            ../source-data/tools/integration/scene1341-source/PAI_Word_Scene50_V1.5_Structural_Catalog.csv \
            ../source-data/tools/integration/scene1341-ranked \
            17c6c758e1dfd27cfa2fe1669d3f1784bedb0668 \
            803d2fccfd2d1ec200723f7f38e73d57495a5dd0 \
            ../evaluation/tools/cg-rec-eval/scene1341-provisional-22.v0.1.json \
            ../scene1341-negation-ablation14.json \
            | tee ../scene1341-current-browser-vs-rec41.json
      - name: Verify query-only 24-case blind template has no prefilled labels
        run: |
          node evaluation/tools/cg-rec-eval/validate-blind-adjudication-intake.mjs \
            evaluation/tools/cg-rec-eval/scene1341-blind-intake-24.v1.json \
            evaluation/tools/cg-rec-eval/scene1341-blind-adjudication-24.template.v1.json
      - name: Generate 24 blind-ready holdout predictions with no gold labels
        env:
          CG_MAIN_SHA: fbe6dc1fc71a294165f3d361655d05b2d9d65dd1
          CG_REC_SHA: 8ea1addac4dcd2df766bb6bed0e92a493e0c1463
        run: |
          set -euo pipefail
          mkdir -p browser-current/tools/cg-rec-eval
          cp evaluation/tools/cg-rec-eval/scene1341-blind-intake-predict.mjs browser-current/tools/cg-rec-eval/
          cd browser-current
          node tools/cg-rec-eval/scene1341-blind-intake-predict.mjs \
            ../source-data/tools/integration/scene1341-source/PAI_Word_Scene50_V1.5_Structural_Catalog.csv \
            ../source-data/tools/integration/scene1341-ranked \
            17c6c758e1dfd27cfa2fe1669d3f1784bedb0668 \
            803d2fccfd2d1ec200723f7f38e73d57495a5dd0 \
            ../evaluation/tools/cg-rec-eval/scene1341-blind-intake-24.v1.json \
            | tee ../scene1341-blind-intake-predictions24.json
      - name: Calibrate 24-case sealed scorer metrics against synthetic math controls
        run: node evaluation/tools/cg-rec-eval/test-sealed-gold-metrics.mjs
      - name: Adversarially reject synthetic invalid gold labels without saving gold
        run: node evaluation/tools/cg-rec-eval/test-sealed-gold-adversarial.mjs
      - name: Reject unsealed blind-gold scoring and forbid fabricated accuracy
        run: |
          node evaluation/tools/cg-rec-eval/score-sealed-blind-gold.mjs \
            evaluation/tools/cg-rec-eval/scene1341-blind-adjudication-24.template.v1.json \
            scene1341-blind-intake-predictions24.json \
            --expect-unsealed
      - name: Validate both outputs independently
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const ab=JSON.parse(fs.readFileSync('scene1341-lexical-vs-title-ab22.json','utf8'));
          const neg=JSON.parse(fs.readFileSync('scene1341-negation-ablation14.json','utf8'));
          const parity=JSON.parse(fs.readFileSync('scene1341-browser-vs-engine-27.json','utf8'));
          const fixed=JSON.parse(fs.readFileSync('scene1341-old-vs-fixed-36.json','utf8'));
          const coreParity=JSON.parse(fs.readFileSync('scene1341-browser-core-parity72.json','utf8'));
          const currentBrowser=JSON.parse(fs.readFileSync('scene1341-current-browser-vs-rec41.json','utf8'));
          const blindIntake=JSON.parse(fs.readFileSync('scene1341-blind-intake-predictions24.json','utf8'));
          if(blindIntake.queryCount!==24||blindIntake.labeledCount!==0||blindIntake.blindGoldCount!==0||blindIntake.releaseAllowed!==false||blindIntake.rows?.length!==24)throw Error('BLIND_INTAKE_MUST_REMAIN_UNADJUDICATED');
          if(currentBrowser.cases!==41||currentBrowser.rows?.length!==41||currentBrowser.releaseAllowed!==false||currentBrowser.goldCertified!==false||currentBrowser.catalogScenes!==1341||currentBrowser.expressions!==19371)throw Error('CURRENT_BROWSER_AB_CONTRACT_INVALID');
          if(currentBrowser.integrationUpstreamDifferent!==currentBrowser.rows.filter(x=>!x.integrationVersusUpstreamSame).length)throw Error('CURRENT_BROWSER_AB_DIFFERENCE_COUNTER_INVALID');
          if(coreParity.queries!==36||coreParity.comparisons!==72||coreParity.mismatched!==0||coreParity.identical!==72||coreParity.releaseAllowed!==false||coreParity.certified!==false)throw Error('BROWSER_CORE_PARITY_FAILED');
          if(fixed.queryCount!==36||fixed.sceneCount!==1341||fixed.expressionCount!==19371||fixed.officialGold!==false||fixed.releaseAllowed!==false||fixed.rows?.length!==36)throw Error('OLD_VS_FIXED_36_INVALID');
          if(fixed.changed!==fixed.rows.filter(x=>x.changed).length||fixed.top1Changed!==fixed.rows.filter(x=>x.top1Changed).length)throw Error('OLD_VS_FIXED_AGGREGATE_MISMATCH');
          if(ab.caseCount!==22||ab.sceneCount!==1341||ab.expressionCount!==19371||ab.official_gold!==false)throw Error('AB22_OUTPUT_MISMATCH');
          if(neg.queryCount!==14||neg.dataScenes!==1341||neg.expressionCount!==19371||neg.qa_status!=='PROVISIONAL_DIAGNOSTIC_NOT_GOLD')throw Error('NEG14_OUTPUT_MISMATCH');
          if(parity.queryCount!==27||parity.data.scenes!==1341||parity.data.expressions!==19371||parity.release_allowed!==false)throw Error('BROWSER_PARITY_OUTPUT_MISMATCH');
          // Cross-check every recorded case, not only aggregate row counts.
          const unique=(xs)=>new Set(xs).size===xs.length;
          const validScene=(id)=>/^SC50-\d{4}$/.test(id)&&+id.slice(5)>=1&&+id.slice(5)<=1341;
          const validTop=(ids)=>Array.isArray(ids)&&ids.length<=10&&unique(ids)&&ids.every(validScene);
          if(!Array.isArray(ab.rows)||ab.rows.length!==22||!unique(ab.rows.map(x=>x.id)))throw Error('AB22_ROWS_INVALID');
          if(!Array.isArray(neg.rows)||neg.rows.length!==14||!unique(neg.rows.map(x=>x.id)))throw Error('NEG14_ROWS_INVALID');
          if(!Array.isArray(parity.rows)||parity.rows.length!==27||!unique(parity.rows.map(x=>x.id)))throw Error('PARITY27_ROWS_INVALID');
          for(const c of ab.rows){
            if(!validScene(c.expected))throw Error('AB22_EXPECTED_SCENE_INVALID '+c.id);
            for(const v of Object.values(c.tested||{}))if(!validTop(v.ids))throw Error('AB22_TOP_INVALID '+c.id);
          }
          for(const c of neg.rows){
            if(!validTop(c.before?.top10)||!validTop(c.patched?.top10))throw Error('NEG14_TOP_INVALID '+c.id);
            if(c.changed!==(c.before.top10.join('|')!==c.patched.top10.join('|')))throw Error('NEG14_CHANGE_FLAG_INVALID '+c.id);
            if(c.top1Changed!==(c.before.top10[0]!==c.patched.top10[0]))throw Error('NEG14_TOP1_CHANGE_FLAG_INVALID '+c.id);
          }
          for(const c of parity.rows){
            if(!validTop(c.browserTop10)||!validTop(c.engineTop10))throw Error('PARITY27_TOP_INVALID '+c.id);
            if(c.top1Same!==(c.browserTop10[0]===c.engineTop10[0]))throw Error('PARITY27_TOP1_FLAG_INVALID '+c.id);
          }
          if(neg.changed!==neg.rows.filter(x=>x.changed).length||neg.top1Changed!==neg.rows.filter(x=>x.top1Changed).length)throw Error('NEG14_AGGREGATE_MISMATCH');
          if(parity.differentTop1!==parity.rows.filter(x=>!x.top1Same).length||parity.matchedTop1!==parity.rows.filter(x=>x.top1Same).length)throw Error('PARITY27_AGGREGATE_MISMATCH');
          if(ab.official_gold!==false||parity.release_allowed!==false||ab.production_eligible!==false)throw Error('UNCERTIFIED_OUTPUT_MISLABELED');
          const summary={
            schema:'cg-rec-eval-scene1341-ci-evidence-v1',
            status:'NONBLIND_PROVISIONAL_DIAGNOSTIC_NOT_CERTIFIED',
            evaluationHead:process.env.GITHUB_SHA,
            sourceCommit:ab.sourceCommit,
            oldEngine:fixed.candidateOld,
            negationFixedEngine:fixed.candidateFixed,
            browserCore:coreParity.browserCoreHead,
            cases:{lexicalTitle:22,negation:14,browserVersusEngine:27,nodeVersusBrowserCore:72},
            oldVersusFixed:{
              changedTop10:fixed.changed,changedTop1:fixed.top1Changed,
              top5Regressions:fixed.top5Regressions,top5Gains:fixed.top5Gains,
              historical:fixed.metrics.historical,fixed:fixed.metrics.fixed,
              changedCases:fixed.rows.filter(x=>x.changed).map(x=>({id:x.id,query:x.query,expected:x.expected,before:x.before.top10.slice(0,5),after:x.after.top10.slice(0,5)}))
            },
            coreParity:{compared:coreParity.comparisons,identical:coreParity.identical,mismatched:coreParity.mismatched},
            browserVersusEngine:{
              count:parity.queryCount,matchedTop1:parity.matchedTop1,differentTop1:parity.differentTop1,
              groups:parity.groups,
