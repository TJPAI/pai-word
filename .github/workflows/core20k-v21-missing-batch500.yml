name: Core20K V2.1 Missing Batch 500
on:
  workflow_dispatch:
  push:
    branches: [core20k-sense-v1-audit-20261027]
    paths: ['tools/core20k_sense_v1/build_missing_500_batch.py', 'tools/core20k_sense_v1/partition_all_missing_500.py', 'tools/core20k_sense_v1/author_batch001_english_learning.py', 'tools/core20k_sense_v1/author_all_missing_english_cards.py', 'tools/core20k_sense_v1/build_bilingual_editing_batches.py', 'tools/core20k_sense_v1/author_additional_context_ku.py', 'tools/core20k_sense_v1/author_additional_context_round2.py', 'tools/core20k_sense_v1/author_newly_resolved_sense_ku.py', 'tools/core20k_sense_v1/expose_editorial_source100.py', 'tools/core20k_sense_v1/author_curated_bilingual_batch01.py', '.github/workflows/core20k-v21-missing-batch500.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'wn>=0.13,<2'
      - run: python -c "import wn; wn.download('oewn:2025')"
      - run: python3 tools/core20k_sense_v1/produce_all_missing_evidence.py
      - run: python3 tools/core20k_sense_v1/build_missing_500_batch.py
      - run: python3 tools/core20k_sense_v1/partition_all_missing_500.py
      - run: python3 tools/core20k_sense_v1/author_batch001_english_learning.py
      - run: python3 tools/core20k_sense_v1/author_all_missing_english_cards.py
      - run: python3 tools/core20k_sense_v1/build_bilingual_editing_batches.py
      - run: python3 tools/core20k_sense_v1/expose_editorial_source100.py
      - run: python3 tools/core20k_sense_v1/author_curated_bilingual_batch01.py
      - run: python3 tools/core20k_sense_v1/author_additional_context_ku.py
      - run: python3 tools/core20k_sense_v1/author_additional_context_round2.py
      - run: python3 tools/core20k_sense_v1/author_newly_resolved_sense_ku.py
      - uses: actions/upload-artifact@v4
        with:
          name: core20k-v21-missing-review-batch001-500
          path: |
            tools/core20k_sense_v1/release/v21-missing-batch001-500/
            tools/core20k_sense_v1/release/v21-missing-batch500-all/
            tools/core20k_sense_v1/release/v21-missing-batch001-content/
            tools/core20k_sense_v1/release/v21-missing-batch-all/additional_original_contextual_ku.jsonl
            tools/core20k_sense_v1/release/v21-missing-batch-all/additional_original_contextual_ku_round2.jsonl
            tools/core20k_sense_v1/release/v21-missing-batch-all/newly_resolved_sense_ku_editorial.jsonl
            tools/core20k_sense_v1/release/v21-missing-batch-all/bilingual_sense_ku_curated_batch01.jsonl
