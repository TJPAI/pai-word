name: Core20K V2.1 Missing Batch 500
on:
  workflow_dispatch:
  push:
    branches: [core20k-sense-v1-audit-20261027]
    paths: ['tools/core20k_sense_v1/build_missing_500_batch.py', 'tools/core20k_sense_v1/partition_all_missing_500.py', 'tools/core20k_sense_v1/author_batch001_english_learning.py', 'tools/core20k_sense_v1/author_all_missing_english_cards.py', 'tools/core20k_sense_v1/build_bilingual_editing_batches.py', 'tools/core20k_sense_v1/author_additional_context_ku.py', 'tools/core20k_sense_v1/author_additional_context_round2.py', 'tools/core20k_sense_v1/author_newly_resolved_sense_ku.py', 'tools/core20k_sense_v1/expose_editorial_source100.py', 'tools/core20k_sense_v1/author_curated_bilingual_batch01.py', 'tools/core20k_sense_v1/author_curated_bilingual_batch02.py', 'tools/core20k_sense_v1/author_curated_bilingual_batch03.py', 'tools/core20k_sense_v1/author_curated_bilingual_batch04.py', 'tools/core20k_sense_v1/select_next500_uncovered.py', 'tools/core20k_sense_v1/author_curated_bilingual_batch05.py', 'tools/core20k_sense_v1/author_curated_bilingual_batch06.py', 'tools/core20k_sense_v1/qa_curated_crossbatch.py', 'tools/core20k_sense_v1/expose_editorial_source100.py', '.github/workflows/core20k-v21-missing-batch500.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore deterministic lexical evidence and drafts
        id: evidence-cache
        uses: actions/cache@v4
        with:
          path: |
            tools/core20k_sense_v1/release/v21-missing-batch-all/
            tools/core20k_sense_v1/release/v21-missing-batch001-500/
            tools/core20k_sense_v1/release/v21-missing-batch500-all/
            tools/core20k_sense_v1/release/v21-missing-batch001-content/
          key: core20k-evidence-v2-${{ hashFiles('data/core20k-runtime.json.gz', 'tools/core20k_sense_v1/produce_all_missing_evidence.py', 'tools/core20k_sense_v1/build_missing_500_batch.py', 'tools/core20k_sense_v1/partition_all_missing_500.py', 'tools/core20k_sense_v1/author_batch001_english_learning.py', 'tools/core20k_sense_v1/author_all_missing_english_cards.py', 'tools/core20k_sense_v1/build_bilingual_editing_batches.py') }}
      - name: Install WordNet dependency only on cache miss
        if: steps.evidence-cache.outputs.cache-hit != 'true'
        run: python -m pip install 'wn>=0.13,<2'
      - name: Download OEWN only on cache miss
        if: steps.evidence-cache.outputs.cache-hit != 'true'
        run: python -c "import wn; wn.download('oewn:2025')"
      - name: Extract evidence only on cache miss
        if: steps.evidence-cache.outputs.cache-hit != 'true'
        run: python3 tools/core20k_sense_v1/produce_all_missing_evidence.py
      - name: Build source review only on cache miss
        if: steps.evidence-cache.outputs.cache-hit != 'true'
        run: python3 tools/core20k_sense_v1/build_missing_500_batch.py
      - name: Partition into 15 batches only on cache miss
        if: steps.evidence-cache.outputs.cache-hit != 'true'
        run: python3 tools/core20k_sense_v1/partition_all_missing_500.py
      - name: Build batch 001 English learning only on cache miss
        if: steps.evidence-cache.outputs.cache-hit != 'true'
        run: python3 tools/core20k_sense_v1/author_batch001_english_learning.py
      - name: Build all English learning drafts only on cache miss
        if: steps.evidence-cache.outputs.cache-hit != 'true'
        run: python3 tools/core20k_sense_v1/author_all_missing_english_cards.py
      - name: Build bilingual triage only on cache miss
        if: steps.evidence-cache.outputs.cache-hit != 'true'
        run: python3 tools/core20k_sense_v1/build_bilingual_editing_batches.py
      - run: python3 tools/core20k_sense_v1/expose_editorial_source100.py
      - run: python3 tools/core20k_sense_v1/author_curated_bilingual_batch01.py
      - run: python3 tools/core20k_sense_v1/author_curated_bilingual_batch02.py
      - run: python3 tools/core20k_sense_v1/author_curated_bilingual_batch03.py
      - run: python3 tools/core20k_sense_v1/author_curated_bilingual_batch04.py
      - run: python3 tools/core20k_sense_v1/author_additional_context_ku.py
      - run: python3 tools/core20k_sense_v1/author_additional_context_round2.py
      - run: python3 tools/core20k_sense_v1/author_newly_resolved_sense_ku.py
      - run: python3 tools/core20k_sense_v1/author_curated_bilingual_batch05.py
      - run: python3 tools/core20k_sense_v1/author_curated_bilingual_batch06.py
      - run: python3 tools/core20k_sense_v1/qa_curated_crossbatch.py
      - run: python3 tools/core20k_sense_v1/select_next500_uncovered.py
      - uses: actions/upload-artifact@v4
        with:
          name: core20k-v21-missing-review-batch001-500
          path: |
            tools/core20k_sense_v1/release/v21-missing-batch001-500/
            tools/core20k_sense_v1/release/v21-missing-batch500-all/
            tools/core20k_sense_v1/release/v21-missing-batch001-content/
            tools/core20k_sense_v1/release/v21-missing-batch-all/additional_original_contextual_ku.jsonl
            tools/core20k_sense_v1/release/v21-missing-batch-all/additional_original_contextual_ku_round2.jsonl
            tools/core20k_sense_v1/release/v21-missing-batch-all/newly_resolved_sense_ku_editorial.jsonl
            tools/core20k_sense_v1/release/v21-missing-batch-all/bilingual_sense_ku_curated_batch01.jsonl
            tools/core20k_sense_v1/release/v21-missing-batch-all/bilingual_sense_ku_curated_batch02.jsonl
            tools/core20k_sense_v1/release/v21-missing-batch-all/bilingual_sense_ku_curated_batch03.jsonl
            tools/core20k_sense_v1/release/v21-missing-batch-all/bilingual_sense_ku_curated_batch04.jsonl
            tools/core20k_sense_v1/release/v21-missing-batch500-all/next500_uncovered_source_cards.jsonl
            tools/core20k_sense_v1/release/v21-missing-batch500-all/bilingual_sense_ku_curated_batch05.jsonl
            tools/core20k_sense_v1/release/v21-missing-batch500-all/bilingual_sense_ku_curated_batch06.jsonl
            tools/core20k_sense_v1/release/v21-missing-batch-all/curated_crossbatch_qa.json
