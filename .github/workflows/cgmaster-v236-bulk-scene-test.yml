name: CG-MASTER V236 bulk scene-first test export
on:
  workflow_dispatch:
  push:
    branches: [cg-master-kaikki-evidence-intake-20261111]
    paths:
      - 'tools/scene1341_master/build_v236_bulk_scene_test_from_v190.py'
      - '.github/workflows/cgmaster-v236-bulk-scene-test.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cg-master-kaikki-evidence-intake-20261111
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and validate all 3000 source-row scene test cards
        run: |
          python tools/scene1341_master/build_v236_bulk_scene_test_from_v190.py
          python - <<'PY'
          import json,pathlib
          d=pathlib.Path('tools/scene1341_master/qa_reports/v236_scene_test')
          m=json.loads((d/'CGMASTER_V236_MANIFEST.json').read_text())
          assert m['source_rows']==3000
          assert sum(m['by_scene'].values())==3000
          print('validated',m['scene_count'],'scenes',m['source_rows'],'rows')
          PY
      - name: Commit generated test-only scene data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/scene1341_master/qa_reports/v236_scene_test/
          git diff --cached --quiet || (git commit -m 'CG-MASTER V236 generated 3000 scene-first test cards' && git push)
