name: Core20K V2.1 Collocation27 editorial QA
on:
  workflow_dispatch:
  push:
    branches: [core20k-sense-v1-audit-20261027]
    paths:
      - 'tools/core20k_sense_v1/editorial/v21_collocation27_revised.jsonl'
      - 'tools/core20k_sense_v1/editorial/validate_collocation27.py'
      - '.github/workflows/core20k-v21-collocation27-editorial-qa.yml'
jobs:
  qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/core20k_sense_v1/editorial/validate_collocation27.py
      - uses: actions/upload-artifact@v4
        with:
          name: core20k-v21-collocation27-editorial-review
          path: tools/core20k_sense_v1/editorial/v21_collocation27_validated_review.jsonl
