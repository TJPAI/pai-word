name: CG-REC-EVAL isolated Hybrid A/B
on:
  push:
    branches: [cg-rec-eval-isolated-20261027]
    paths:
      - '.github/workflows/cg-rec-eval-isolated.yml'
      - 'tools/cg-rec-eval/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout independent evaluation
        uses: actions/checkout@v4
        with:
          path: evaluation
      - name: Checkout pinned recommendation candidate
        uses: actions/checkout@v4
        with:
          repository: TJPAI/pai-word
          ref: f75527bd52fcaad9ddf9a767c2797be59950d3b5
          path: candidate
          persist-credentials: false
      - name: Checkout latest experimental candidate (isolated)
        uses: actions/checkout@v4
        with:
          repository: TJPAI/pai-word
          ref: 79d2ce4281eb85bc95315a042f025fb03983d487
          path: candidate-new
          persist-credentials: false
      - name: Checkout boundary-fix recommendation candidate
        uses: actions/checkout@v4
        with:
          repository: TJPAI/pai-word
          ref: 16960a75dcd204180fa44cffab7944a2cd63240f
          path: candidate-boundary
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated evaluation files
        run: |
          mkdir -p candidate/tools/cg-rec-eval
          cp evaluation/tools/cg-rec-eval/evaluate.mjs candidate/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/engine-level-ab.mjs candidate/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/summarize-engine-ab.mjs candidate/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/diagnose-english.mjs candidate/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/gold-provisional-30.v0.1.json candidate/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/context-wrappers-90.v0.1.json candidate/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/novel-intents-50.v0.1.json candidate/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/targeted-challenge-20.v0.1.json candidate/tools/cg-rec-eval/
          mkdir -p candidate-new/tools/cg-rec-eval
          cp evaluation/tools/cg-rec-eval/evaluate.mjs candidate-new/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/gold-provisional-30.v0.1.json candidate-new/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/context-wrappers-90.v0.1.json candidate-new/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/novel-intents-50.v0.1.json candidate-new/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/targeted-challenge-20.v0.1.json candidate-new/tools/cg-rec-eval/
          mkdir -p candidate-boundary/tools/cg-rec-eval
          cp evaluation/tools/cg-rec-eval/engine-level-ab.mjs candidate-boundary/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/gold-provisional-30.v0.1.json candidate-boundary/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/novel-intents-50.v0.1.json candidate-boundary/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/diagnose-english.mjs candidate-boundary/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/summarize-engine-ab.mjs candidate-boundary/tools/cg-rec-eval/
          git -C candidate-boundary rev-parse HEAD
          git -C candidate-new rev-parse HEAD
          git -C candidate rev-parse HEAD
          git -C evaluation rev-parse HEAD
      - name: Extract SHA-pinned official data assets
        run: |
          mkdir -p assets
          ZIP=candidate/scene500-recommendation/assets/scene500-v0101-verified-assets.zip
          echo "664eac841f0828a8eefe3e3646555452cca50c7db33c960cc9bcb8f7a6f6169a  $ZIP" | sha256sum -c -
          for FILE in catalog-v0.2.json zh-core20k-v0101-scene500-runtime.json v094-lexical-associations.json; do
            unzip -p "$ZIP" "$FILE" > "assets/$FILE"
            test -s "assets/$FILE"
            sha256sum "assets/$FILE"
          done
      - name: Run isolated 30 case Hybrid A/B with optional experiment
        working-directory: candidate
        env:
          ENABLE_ACTION_OBJECT: '1'
        run: |
          set -o pipefail
          node tools/cg-rec-eval/evaluate.mjs \
            ../assets/catalog-v0.2.json \
            ../assets/zh-core20k-v0101-scene500-runtime.json \
            ../assets/v094-lexical-associations.json \
            tools/cg-rec-eval/gold-provisional-30.v0.1.json \
            | tee ../cg-rec-eval-ab-30.json
      - name: Run 90 derived contextual robustness variants
        working-directory: candidate
        env:
          ENABLE_ACTION_OBJECT: '1'
        run: |
          set -o pipefail
          node tools/cg-rec-eval/evaluate.mjs \
            ../assets/catalog-v0.2.json \
            ../assets/zh-core20k-v0101-scene500-runtime.json \
            ../assets/v094-lexical-associations.json \
            tools/cg-rec-eval/context-wrappers-90.v0.1.json \
            | tee ../cg-rec-eval-context90.json
      - name: Run independent 50 novel-intent A/B cases
        working-directory: candidate
        env:
          ENABLE_ACTION_OBJECT: '1'
        run: |
          set -o pipefail
          node tools/cg-rec-eval/evaluate.mjs \
            ../assets/catalog-v0.2.json \
            ../assets/zh-core20k-v0101-scene500-runtime.json \
            ../assets/v094-lexical-associations.json \
            tools/cg-rec-eval/novel-intents-50.v0.1.json \
            | tee ../cg-rec-eval-novel50.json
      - name: Attribute suspicious English recommendations
        working-directory: candidate
        run: |
          set -o pipefail
          node tools/cg-rec-eval/diagnose-english.mjs \
            ../assets/catalog-v0.2.json \
            ../assets/zh-core20k-v0101-scene500-runtime.json \
            ../assets/v094-lexical-associations.json \
            | tee ../cg-rec-eval-english-diagnostics.json
      - name: Targeted regression on old pinned experiment
        working-directory: candidate
        env:
          ENABLE_ACTION_OBJECT: '1'
        run: |
          set -o pipefail
          node tools/cg-rec-eval/evaluate.mjs \
            ../assets/catalog-v0.2.json \
            ../assets/zh-core20k-v0101-scene500-runtime.json \
            ../assets/v094-lexical-associations.json \
            tools/cg-rec-eval/targeted-challenge-20.v0.1.json \
            > ../cg-rec-eval-old-targeted20.json
      - name: Independently retest latest experimental SHA across all 170 cases
        working-directory: candidate-new
        env:
          ENABLE_ACTION_OBJECT: '1'
        run: |
          set -o pipefail
          for SET in gold-provisional-30 context-wrappers-90 novel-intents-50 targeted-challenge-20; do
            node tools/cg-rec-eval/evaluate.mjs \
              ../assets/catalog-v0.2.json \
              ../assets/zh-core20k-v0101-scene500-runtime.json \
              ../assets/v094-lexical-associations.json \
              "tools/cg-rec-eval/${SET}.v0.1.json" \
              > "../cg-rec-eval-new-${SET}.json"
          done
      - name: Genuine engine-level A/B Rule-only versus Hybrid
        working-directory: candidate
        run: |
          set -o pipefail
          for SET in gold-provisional-30 novel-intents-50; do
            node tools/cg-rec-eval/engine-level-ab.mjs \
              ../assets/catalog-v0.2.json \
              ../assets/zh-core20k-v0101-scene500-runtime.json \
              ../assets/v094-lexical-associations.json \
              "tools/cg-rec-eval/${SET}.v0.1.json" \
              > "../cg-rec-eval-engine-${SET}.json"
          done
      - name: Publish genuine engine-level 80-intent summary and case-level regressions
        working-directory: candidate
        run: |
          set -o pipefail
          node tools/cg-rec-eval/summarize-engine-ab.mjs \
            ../cg-rec-eval-engine-gold-provisional-30.json \
            ../cg-rec-eval-engine-novel-intents-50.json \
            | tee ../cg-rec-eval-engine-80-summary.json
      - name: Retest fixed-boundary Rule versus Hybrid on same 80 independent intents
        working-directory: candidate-boundary
        run: |
          set -o pipefail
          for SET in gold-provisional-30 novel-intents-50; do
            node tools/cg-rec-eval/engine-level-ab.mjs \
              ../assets/catalog-v0.2.json \
              ../assets/zh-core20k-v0101-scene500-runtime.json \
              ../assets/v094-lexical-associations.json \
              "tools/cg-rec-eval/${SET}.v0.1.json" \
              > "../cg-rec-eval-boundary-engine-${SET}.json"
          done
      - name: Print post-fix engine A/B aggregate and check regression
        working-directory: candidate-boundary
        run: |
          set -o pipefail
          node tools/cg-rec-eval/summarize-engine-ab.mjs \
            ../cg-rec-eval-boundary-engine-gold-provisional-30.json \
            ../cg-rec-eval-boundary-engine-novel-intents-50.json \
            | tee ../cg-rec-eval-boundary-engine-80-summary.json
      - name: Retest 7 English error probes after boundary fix
        working-directory: candidate-boundary
        run: |
          set -o pipefail
          node tools/cg-rec-eval/diagnose-english.mjs \
            ../assets/catalog-v0.2.json \
            ../assets/zh-core20k-v0101-scene500-runtime.json \
            ../assets/v094-lexical-associations.json \
            | tee ../cg-rec-eval-boundary-english-diagnostics.json
      - name: Checkout Scene1341 source data pinned from integration
        uses: actions/checkout@v4
        with:
          repository: TJPAI/pai-word
          ref: 17c6c758e1dfd27cfa2fe1669d3f1784bedb0668
          path: scene1341-data
          persist-credentials: false
      - name: Checkout pinned isolated Scene1341 lexical candidate
        uses: actions/checkout@v4
        with:
          repository: TJPAI/pai-word
          ref: 83a94cb1b6fd2a08143886b6be845ebc408e41e8
          path: scene1341-rec
          persist-credentials: false
      - name: Scene1341 real lexical vs title-only provisional evaluation
        env:
          CG_REC_SHA: 83a94cb1b6fd2a08143886b6be845ebc408e41e8
        run: |
          set -o pipefail
          mkdir -p scene1341-rec/tools/cg-rec-eval
          cp evaluation/tools/cg-rec-eval/scene1341-evaluate.mjs scene1341-rec/tools/cg-rec-eval/
          CATALOG=scene1341-data/tools/integration/scene1341-source/PAI_Word_Scene50_V1.5_Structural_Catalog.csv
          RANKED=scene1341-data/tools/integration/scene1341-ranked
          test -s "$CATALOG"
          for v in $(seq 51 61); do test -s "$RANKED/v${v}-ranked.csv"; done
          MANIFEST_BLOB=$(git -C scene1341-data hash-object tools/integration/scene1341-ranked/manifest.json)
          cd scene1341-rec
          node tools/cg-rec-eval/scene1341-evaluate.mjs \
            "../$CATALOG" "../$RANKED" \
            17c6c758e1dfd27cfa2fe1669d3f1784bedb0668 "$MANIFEST_BLOB" \
            ../evaluation/tools/cg-rec-eval/scene1341-provisional-22.v0.1.json \
            | tee ../cg-rec-eval-scene1341-22-provisional.json
      - name: Controlled Scene1341 negation Set.size ablation
        env:
          CG_REC_SHA: 83a94cb1b6fd2a08143886b6be845ebc408e41e8
        run: |
          set -o pipefail
          cp evaluation/tools/cg-rec-eval/scene1341-negation-audit.mjs scene1341-rec/tools/cg-rec-eval/
          CATALOG=scene1341-data/tools/integration/scene1341-source/PAI_Word_Scene50_V1.5_Structural_Catalog.csv
          RANKED=scene1341-data/tools/integration/scene1341-ranked
          MANIFEST_BLOB=$(git -C scene1341-data hash-object tools/integration/scene1341-ranked/manifest.json)
          cd scene1341-rec
          node tools/cg-rec-eval/scene1341-negation-audit.mjs \
            "../$CATALOG" "../$RANKED" \
            17c6c758e1dfd27cfa2fe1669d3f1784bedb0668 "$MANIFEST_BLOB" \
            | tee ../cg-rec-eval-scene1341-negation-ablation.json
      - name: Upload all case-level evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cg-rec-eval-ab-30-evidence
          path: |
            cg-rec-eval-ab-30.json
            cg-rec-eval-context90.json
            cg-rec-eval-novel50.json
            cg-rec-eval-english-diagnostics.json
            cg-rec-eval-new-*.json
            cg-rec-eval-old-targeted20.json
            cg-rec-eval-engine-*.json
            cg-rec-eval-boundary-*.json
            cg-rec-eval-scene1341-*.json
          if-no-files-found: warn
