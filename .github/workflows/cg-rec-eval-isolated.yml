name: CG-REC-EVAL isolated Hybrid A/B
on:
  push:
    branches: [cg-rec-eval-isolated-20261027]
    paths:
      - '.github/workflows/cg-rec-eval-isolated.yml'
      - 'tools/cg-rec-eval/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout independent evaluation
        uses: actions/checkout@v4
        with:
          path: evaluation
      - name: Checkout pinned recommendation candidate
        uses: actions/checkout@v4
        with:
          repository: TJPAI/pai-word
          ref: f75527bd52fcaad9ddf9a767c2797be59950d3b5
          path: candidate
          persist-credentials: false
      - name: Checkout latest experimental candidate (isolated)
        uses: actions/checkout@v4
        with:
          repository: TJPAI/pai-word
          ref: 79d2ce4281eb85bc95315a042f025fb03983d487
          path: candidate-new
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated evaluation files
        run: |
          mkdir -p candidate/tools/cg-rec-eval
          cp evaluation/tools/cg-rec-eval/evaluate.mjs candidate/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/diagnose-english.mjs candidate/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/gold-provisional-30.v0.1.json candidate/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/context-wrappers-90.v0.1.json candidate/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/novel-intents-50.v0.1.json candidate/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/targeted-challenge-20.v0.1.json candidate/tools/cg-rec-eval/
          mkdir -p candidate-new/tools/cg-rec-eval
          cp evaluation/tools/cg-rec-eval/evaluate.mjs candidate-new/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/gold-provisional-30.v0.1.json candidate-new/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/context-wrappers-90.v0.1.json candidate-new/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/novel-intents-50.v0.1.json candidate-new/tools/cg-rec-eval/
          cp evaluation/tools/cg-rec-eval/targeted-challenge-20.v0.1.json candidate-new/tools/cg-rec-eval/
          git -C candidate-new rev-parse HEAD
          git -C candidate rev-parse HEAD
          git -C evaluation rev-parse HEAD
      - name: Extract SHA-pinned official data assets
        run: |
          mkdir -p assets
          ZIP=candidate/scene500-recommendation/assets/scene500-v0101-verified-assets.zip
          echo "664eac841f0828a8eefe3e3646555452cca50c7db33c960cc9bcb8f7a6f6169a  $ZIP" | sha256sum -c -
          for FILE in catalog-v0.2.json zh-core20k-v0101-scene500-runtime.json v094-lexical-associations.json; do
            unzip -p "$ZIP" "$FILE" > "assets/$FILE"
            test -s "assets/$FILE"
            sha256sum "assets/$FILE"
          done
      - name: Run isolated 30 case Hybrid A/B with optional experiment
        working-directory: candidate
        env:
          ENABLE_ACTION_OBJECT: '1'
        run: |
          set -o pipefail
          node tools/cg-rec-eval/evaluate.mjs \
            ../assets/catalog-v0.2.json \
            ../assets/zh-core20k-v0101-scene500-runtime.json \
            ../assets/v094-lexical-associations.json \
            tools/cg-rec-eval/gold-provisional-30.v0.1.json \
            | tee ../cg-rec-eval-ab-30.json
      - name: Run 90 derived contextual robustness variants
        working-directory: candidate
        env:
          ENABLE_ACTION_OBJECT: '1'
        run: |
          set -o pipefail
          node tools/cg-rec-eval/evaluate.mjs \
            ../assets/catalog-v0.2.json \
            ../assets/zh-core20k-v0101-scene500-runtime.json \
            ../assets/v094-lexical-associations.json \
            tools/cg-rec-eval/context-wrappers-90.v0.1.json \
            | tee ../cg-rec-eval-context90.json
      - name: Run independent 50 novel-intent A/B cases
        working-directory: candidate
        env:
          ENABLE_ACTION_OBJECT: '1'
        run: |
          set -o pipefail
          node tools/cg-rec-eval/evaluate.mjs \
            ../assets/catalog-v0.2.json \
            ../assets/zh-core20k-v0101-scene500-runtime.json \
            ../assets/v094-lexical-associations.json \
            tools/cg-rec-eval/novel-intents-50.v0.1.json \
            | tee ../cg-rec-eval-novel50.json
      - name: Attribute suspicious English recommendations
        working-directory: candidate
        run: |
          set -o pipefail
          node tools/cg-rec-eval/diagnose-english.mjs \
            ../assets/catalog-v0.2.json \
            ../assets/zh-core20k-v0101-scene500-runtime.json \
            ../assets/v094-lexical-associations.json \
            | tee ../cg-rec-eval-english-diagnostics.json
      - name: Targeted regression on old pinned experiment
        working-directory: candidate
        env:
          ENABLE_ACTION_OBJECT: '1'
        run: |
          set -o pipefail
          node tools/cg-rec-eval/evaluate.mjs \
            ../assets/catalog-v0.2.json \
            ../assets/zh-core20k-v0101-scene500-runtime.json \
            ../assets/v094-lexical-associations.json \
            tools/cg-rec-eval/targeted-challenge-20.v0.1.json \
            > ../cg-rec-eval-old-targeted20.json
      - name: Independently retest latest experimental SHA across all 170 cases
        working-directory: candidate-new
        env:
          ENABLE_ACTION_OBJECT: '1'
        run: |
          set -o pipefail
          for SET in gold-provisional-30 context-wrappers-90 novel-intents-50 targeted-challenge-20; do
            node tools/cg-rec-eval/evaluate.mjs \
              ../assets/catalog-v0.2.json \
              ../assets/zh-core20k-v0101-scene500-runtime.json \
              ../assets/v094-lexical-associations.json \
              "tools/cg-rec-eval/${SET}.v0.1.json" \
              > "../cg-rec-eval-new-${SET}.json"
          done
      - name: Upload all case-level evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cg-rec-eval-ab-30-evidence
          path: |
            cg-rec-eval-ab-30.json
            cg-rec-eval-context90.json
            cg-rec-eval-novel50.json
            cg-rec-eval-english-diagnostics.json
            cg-rec-eval-new-*.json
            cg-rec-eval-old-targeted20.json
          if-no-files-found: warn
