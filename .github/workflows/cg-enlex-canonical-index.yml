name: CG-ENLEX canonical KU index
on:
  push:
    branches:
      - experiment/enlex-v3-production-rebuild-20261030
    paths:
      - .github/workflows/cg-enlex-canonical-index.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/core20k_lexicon/production_v3/build_canonical_ku_index.py
      - name: Publish index and summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/core20k_lexicon/production_v3/ku_canonical_index.jsonl tools/core20k_lexicon/production_v3/ku_canonical_summary.json
          git diff --cached --quiet || git commit -m "CG-ENLEX: publish canonical KU index and review summary"
          git push origin HEAD:experiment/enlex-v3-production-rebuild-20261030
