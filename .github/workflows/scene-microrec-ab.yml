name: Scene MicroRec isolated comparison
on:
  push:
    branches:
      - experiment/scene1500-microrec-ab-20261027
    paths:
      - 'experiments/scene-microrec/**'
      - '.github/workflows/scene-microrec-ab.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conservative candidate smoke QA
        run: node experiments/scene-microrec/conservative.test.mjs
      - name: Candidate size gate (2 MB)
        run: node experiments/scene-microrec/check-size.mjs
      - name: Regression and synthetic Scene1500 scale
        run: node experiments/scene-microrec/regression.test.mjs
      - name: Compare algorithms with editorial holdout and latency
        run: node experiments/scene-microrec/evaluate.mjs --write
      - name: Three-suite robustness comparison
        run: node experiments/scene-microrec/evaluate-extended.mjs
      - name: Historical V0.10.1 hybrid snapshot comparison
        run: node experiments/scene-microrec/compare-historical-v0101.mjs --write
      - name: Error taxonomy and negative controls
        run: node experiments/scene-microrec/error-audit.mjs --write
      - name: Exploratory bilingual stress probes
        run: node experiments/scene-microrec/exploratory-probes.mjs --write
      - name: Catalog-fitted sparse retrieval comparison
        run: node experiments/scene-microrec/evaluate-sparse.mjs
      - name: Seven-engine multi-metric assessment
        run: node experiments/scene-microrec/multi-metric.mjs --write
      - name: Quantized learned ranker pilot
        run: node experiments/scene-microrec/evaluate-tiny.mjs
      - name: Quantization reproducibility and Scene1500 size
        run: node experiments/scene-microrec/quantization-scale-gate.mjs
      - name: Shared prototype model scale and quality
        run: node experiments/scene-microrec/evaluate-prototype.mjs
      - name: Build provenance-pinned teacher encoding jobs (no teacher weights)
        run: node experiments/scene-microrec/build-teacher-jobs.mjs --write
      - name: Validate optional teacher encoder syntax
        run: python -m py_compile experiments/scene-microrec/encode-teacher.py
      - name: Student trainer Python syntax
        run: python -m py_compile experiments/scene-microrec/train-student.py experiments/scene-microrec/test-student-pipeline.py
      - name: Install numpy for synthetic training pipeline QA
        run: python -m pip install numpy
      - name: Synthetic student pipeline QA (not real teacher inference)
        run: python experiments/scene-microrec/test-student-pipeline.py
      - name: Download successful real E5 distillation artifact
        uses: actions/download-artifact@v4
        with:
          name: scene-microrec-real-student-and-teacher
          path: /tmp/real-distill-artifacts
          github-token: ${{ github.token }}
          run-id: 40477803071
      - name: Real E5 INT8 student versus Conservative A/B
        run: |
          mkdir -p /tmp/real-distill-ab
          node experiments/scene-microrec/evaluate-real-student-vs-conservative.mjs \
            /tmp/real-distill-artifacts/scene-student-real.json \
            /tmp/real-distill-ab/real-student-vs-conservative.json
      - name: Validate independently attributed blind-review verdicts
        run: node experiments/scene-microrec/validate-independent-review.mjs --write
      - name: Validate source-preserving revision proposals
        run: node experiments/scene-microrec/test-semantic-revisions.mjs --write
      - name: Export independent blind-review input
        run: node experiments/scene-microrec/build-semantic-blind-input.mjs --write
      - name: Generate 500-scene bilingual editorial queue
        run: node experiments/scene-microrec/build-bilingual-queue.mjs --write
      - name: Verify all 500 bilingual candidates have accountable review state
        run: node experiments/scene-microrec/test-semantic-coverage.mjs
      - name: Check first-pass semantic review traceability
        run: node experiments/scene-microrec/test-semantic-review-pilot.mjs
      - name: Verify bilingual candidate pool isolation
        run: node experiments/scene-microrec/test-bilingual-seeds.mjs
      - name: Audit real bilingual supervision coverage
        run: node experiments/scene-microrec/audit-bilingual-coverage.mjs --write
      - uses: actions/upload-artifact@v4
        with:
          name: scene-microrec-ab-results
          path: |
            experiments/scene-microrec/results.json
            experiments/scene-microrec/historical-hybrid-comparison.json
            experiments/scene-microrec/error-audit.json
            experiments/scene-microrec/exploratory-probes.json
            experiments/scene-microrec/multi-metric-report.json
            experiments/scene-microrec/teacher-encoding-jobs.json
            experiments/scene-microrec/bilingual-coverage-audit.json
            experiments/scene-microrec/bilingual-editorial-queue.json
            experiments/scene-microrec/semantic-blind-input-500.json
            experiments/scene-microrec/semantic-revision-diff.json
            experiments/scene-microrec/independent-review-readiness.json
            /tmp/real-distill-ab/real-student-vs-conservative.json

# Bilingual audit gate must appear in the executed job steps.
