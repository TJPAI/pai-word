name: Four-line integration contract QA
on:
  push:
    branches:
      - main-answer-cleanup-20261026
      - cg-main-fourline-integration-20261026
    paths:
      - '.github/workflows/four-line-integration-qa.yml'
      - 'scripts/four-line-*.mjs'
      - 'tools/integration/**'
      - 'scripts/approved-teaching-release-gate.mjs'
      - 'scripts/materialize-zh-core20k-v0101.mjs'
      - 'data/zh-core20k-v0101-scene500-runtime.json.gz.b64'
      - 'tools/answer-enrichment/test-standard-answer-cleanup.mjs'
      - 'rebuild-preview/learning-runtime.js'
      - 'rebuild-preview/ku-durable-store.js'
      - 'rebuild-preview/home-dashboard.js'
      - 'home-dashboard.css'
      - 'learning.css'
      - 'rebuild-preview/scene500-recommendation-bridge.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-and-answer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned English Core20K runtime exists
        run: |
          test -s data/core20k-runtime.json.gz
          node -e "const z=require('zlib'),f=require('fs');const j=JSON.parse(z.gunzipSync(f.readFileSync('data/core20k-runtime.json.gz')));if(j.headwords?.length!==20000)throw Error('English Core20K count');console.log('PASS English Core20K 20000 headwords')"
      - name: Verify real English KU adapter indices and playability
        run: node scripts/core20k-unified-runtime-test.mjs data/core20k-runtime.json.gz
      - name: Materialize verified Chinese Core20K V0.10.1
        run: node scripts/materialize-zh-core20k-v0101.mjs
      - name: Assert exact bilingual runtime identity and size
        run: |
          test -s scene500-recommendation/zh-core20k-v0101-scene500-runtime.json
          node -e "const fs=require('fs'),crypto=require('crypto');const b=fs.readFileSync('scene500-recommendation/zh-core20k-v0101-scene500-runtime.json');const h=crypto.createHash('sha256').update(b).digest('hex');if(h!=='18adea58a3615935c1b632c22934a91855171063862f7471999f9900415e8093'||b.length!==6454987)throw Error('ZH_V0101_BINARY_DRIFT');console.log('PASS Chinese Core20K V0.10.1 source identity')"
      - name: Check actual loaded Chinese runtime version diagnostic
        run: |
          node --check rebuild-preview/scene500-recommendation-bridge.mjs
          node -e "const fs=require('fs');const b=fs.readFileSync('rebuild-preview/scene500-recommendation-bridge.mjs','utf8'),h=fs.readFileSync('rebuild-preview/home-dashboard.js','utf8');if(!b.includes('runtimeDataVersion:instance?.mode')||!h.includes('diagnostic=bridge.status?.()')||!h.includes('lexiconVerifiedLoaded,elapsedMs:'))throw Error('NO_RUNTIME_VERSION_BRIDGE');console.log('PASS runtime diagnostic wiring')"
      - name: Verify handwriting scratch is temporary and gesture-safe
        run: node tools/integration/test-handwriting-scratch.mjs
      - name: Guard global card-face preference and speech-ended auto interval
        run: node tools/integration/test-global-face-and-audio-interval.mjs
      - name: Check compact home query and settings heading alignment
        run: |
          node -e "const fs=require('fs'),assert=require('assert');const h=fs.readFileSync('rebuild-preview/home-dashboard.js','utf8'),c=fs.readFileSync('home-dashboard.css','utf8'),l=fs.readFileSync('learning.css','utf8');assert(h.includes('rows=\"2\" placeholder='));assert(c.includes('min-height:74px;max-height:160px'));assert(l.includes('.panel-screen .panel-top h2{margin:0 0 0 4px;line-height:1.25;align-self:center}'));console.log('PASS compact query and settings title alignment')"
      - name: Execute home engine status display assertions
        run: node tools/integration/test-home-engine-status.mjs
      - name: Check home status copy is not stale or overclaiming
        run: |
          node --check rebuild-preview/home-dashboard.js
          node -e "const s=require('fs').readFileSync('rebuild-preview/home-dashboard.js','utf8');if(s.includes('隔离6 Sense')||s.includes(\"mode==='hybrid'?'Hybrid 已加载'\"))throw Error('STALE_OR_OVERCLAIMING_HOME_STATUS');console.log('PASS home version status wording')"
      - name: Check standard answer page cleanup
        run: node tools/answer-enrichment/test-standard-answer-cleanup.mjs
      - name: Check four-line identity and activation contract
        run: node tools/integration/test-four-line-contract.mjs
      - name: Reject uncertified teaching activation and partial release
        run: node tools/integration/test-approved-teaching-release-gate.mjs
      - name: Verify staged S113 teaching cards against frozen English runtime without activation
        run: node tools/integration/test-s113-staging-overlay.mjs
      - name: Check isolated V2.2 durable storage namespace
        run: node tools/integration/test-storage-namespace.mjs
      - name: Verify nonblocking Scene500 cold-search warmup
        run: node tools/integration/test-scene500-cold-warmup.mjs
      - name: Check S500 search bridge and reject unsafe mapping
        run: node tools/integration/test-four-line-scene-bridge.mjs
