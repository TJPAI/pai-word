name: Four-line integration contract QA
on:
  push:
    branches:
      - main-answer-cleanup-20261026
    paths:
      - '.github/workflows/four-line-integration-qa.yml'
      - 'scripts/four-line-*.mjs'
      - 'tools/integration/**'
      - 'scripts/materialize-zh-core20k-v0101.mjs'
      - 'data/zh-core20k-v0101-scene500-runtime.json.gz.b64'
      - 'tools/answer-enrichment/test-standard-answer-cleanup.mjs'
      - 'rebuild-preview/learning-runtime.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-and-answer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned English Core20K runtime exists
        run: |
          test -s data/core20k-runtime.json.gz
          node -e "const z=require('zlib'),f=require('fs');const j=JSON.parse(z.gunzipSync(f.readFileSync('data/core20k-runtime.json.gz')));if(j.headwords?.length!==20000)throw Error('English Core20K count');console.log('PASS English Core20K 20000 headwords')"
      - name: Materialize verified Chinese Core20K V0.10.1
        run: node scripts/materialize-zh-core20k-v0101.mjs
      - name: Assert exact bilingual runtime identity and size
        run: |
          test -s scene500-recommendation/zh-core20k-v0101-scene500-runtime.json
          node -e "const fs=require('fs'),crypto=require('crypto');const b=fs.readFileSync('scene500-recommendation/zh-core20k-v0101-scene500-runtime.json');const h=crypto.createHash('sha256').update(b).digest('hex');if(h!=='18adea58a3615935c1b632c22934a91855171063862f7471999f9900415e8093'||b.length!==6454987)throw Error('ZH_V0101_BINARY_DRIFT');console.log('PASS Chinese Core20K V0.10.1 source identity')"
      - name: Check standard answer page cleanup
        run: node tools/answer-enrichment/test-standard-answer-cleanup.mjs
      - name: Check four-line identity and activation contract
        run: node tools/integration/test-four-line-contract.mjs
      - name: Check S500 search bridge and reject unsafe mapping
        run: node tools/integration/test-four-line-scene-bridge.mjs
