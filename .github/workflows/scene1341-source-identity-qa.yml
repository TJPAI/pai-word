name: Scene1341 raw source identity QA
on:
  push:
    branches:
      - cg-main-fourline-integration-20261026
    paths:
      - 'tools/integration/scene1341-source/*.csv'
      - 'tools/integration/audit-scene1341-legacy-references.py'
      - 'tools/integration/build-scene1341-crosswalk-candidates.py'
      - 'tools/integration/scene1341-staging-catalog.mjs'
      - 'tools/integration/test-scene1341-staging-catalog.mjs'
      - '.github/workflows/scene1341-source-identity-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-canonical-raw-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact bytes, IDs, names and non-certification
        run: python tools/integration/validate-scene1341-raw-sources.py
      - name: Audit SC50 references without approving identity migrations
        run: python tools/integration/audit-scene1341-legacy-references.py
      - name: Validate read-only Scene1341 staging adapter
        run: node tools/integration/test-scene1341-staging-catalog.mjs
      - name: Build and validate unapproved SC50 crosswalk candidates
        run: |
          python tools/integration/build-scene1341-crosswalk-candidates.py > /tmp/scene1341-crosswalk-candidates.json
          python -c 'import json; x=json.load(open("/tmp/scene1341-crosswalk-candidates.json")); assert x["migration_approved"] is False and x["legacy_id_coverage"]==500 and len(x["entries"])==410; print("PASS SC50 crosswalk candidate gate",x["review_queue_count"])'
