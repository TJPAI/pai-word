name: Scene500 real-assets regression
on:
  push:
    branches: [home-perf-safe-load-20261022]
    paths:
      - 'scene500-recommendation/**'
      - 'rebuild-preview/scene500-recommendation-bridge.mjs'
      - '.github/workflows/scene500-recommendation-qa.yml'
  workflow_dispatch:
jobs:
  real-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real Scene500 assets and ten Top5 queries
        run: |
          node scene500-recommendation/real-assets-top10-qa.mjs \
            scene500-recommendation/catalog-v0.2.json \
            scene500-recommendation/zh-core20k-v094.min.json \
            scene500-recommendation/v094-lexical-associations.json
