name: CG-MAIN Scene1341 atomic Master blob contract

on:
  push:
    branches:
      - cg-main-fourline-integration-20261026
    paths:
      - 'tools/integration/verify-scene1341-master-blob-index.mjs'
      - 'tools/integration/test-scene1341-master-blob-index.mjs'
      - 'tools/integration/test-scene1341-master-rollover.mjs'
      - 'tools/integration/test-scene1341-search-entry-parity.mjs'
      - 'tools/integration/test-scene1341-master-continue.mjs'
      - 'tools/integration/test-scene1341-master-fresh-entry.mjs'
      - 'tools/integration/test-scene1341-aba-tap.mjs'
      - 'tools/integration/test-scene1341-home-cancels-entry.mjs'
      - 'tools/integration/test-scene1341-startup-entry-race.mjs'
      - 'tools/integration/test-scene1341-startup-index-guard.mjs'
      - 'tools/integration/test-scene1341-retry-request-guard.mjs'
      - 'tools/integration/test-scene1341-release-badge-on-entry.mjs'
      - 'tools/integration/test-scene1341-phase-auto-behavior.mjs'
      - 'tools/integration/test-scene1341-native-cycle-behavior.mjs'
      - 'tools/integration/test-scene1341-settings-persistence.mjs'
      - 'rebuild-preview/scene1341-readonly/scene500-readonly-settings.js'
      - 'rebuild-preview/scene1341-readonly/scene500-native-cycle-exact.js'
      - 'rebuild-preview/scene1341-readonly/scene500-readonly-phase.js'
      - 'tools/integration/test-scene1341-scene-entry-race.mjs'
      - 'rebuild-preview/scene1341-readonly/index.html'
      - 'tools/integration/CGMAIN_CURRENT_STATE.json'
      - '.github/workflows/cgmain-scene1341-master-blob-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scene1341-master-blob-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout CG-MAIN verifier
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - name: Checkout current CG-MASTER production snapshot
        uses: actions/checkout@v4
        with:
          ref: cg-master-kaikki-evidence-intake-20261111
          path: master
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify synthetic 1341-scene regression
        run: node source/tools/integration/test-scene1341-master-blob-index.mjs
      - name: Verify index rollover remains fail-closed
        run: node source/tools/integration/test-scene1341-master-rollover.mjs
      - name: Verify Scene1341 scene-entry race guard
        run: node source/tools/integration/test-scene1341-scene-entry-race.mjs
      - name: Verify Scene500-style search entry
        run: node source/tools/integration/test-scene1341-search-entry-parity.mjs
      - name: Verify full-catalog Master Continue bookmark
        run: node source/tools/integration/test-scene1341-master-continue.mjs
      - name: Verify fresh Master index on scene entry
        run: node source/tools/integration/test-scene1341-master-fresh-entry.mjs
      - name: Verify A-B-A last-tap scene entry
        run: node source/tools/integration/test-scene1341-aba-tap.mjs
      - name: Verify Home cancels pending scene entry
        run: node source/tools/integration/test-scene1341-home-cancels-entry.mjs
      - name: Verify startup index race isolation
        run: node source/tools/integration/test-scene1341-startup-entry-race.mjs
      - name: Verify startup snapshot stale-completion guard
        run: node source/tools/integration/test-scene1341-startup-index-guard.mjs
      - name: Verify Master retry request guard
        run: node source/tools/integration/test-scene1341-retry-request-guard.mjs
      - name: Verify visible Master release badge after scene entry
        run: node source/tools/integration/test-scene1341-release-badge-on-entry.mjs
      - name: Verify Scene500 face and auto-browse behavior
        run: node source/tools/integration/test-scene1341-phase-auto-behavior.mjs
      - name: Verify Scene500 native 10/25/50 round navigation
        run: node source/tools/integration/test-scene1341-native-cycle-behavior.mjs
      - name: Verify Scene1341 isolated settings persistence
        run: node source/tools/integration/test-scene1341-settings-persistence.mjs
      - name: Verify all 1341 real Master scene files against atomic index
        run: node source/tools/integration/verify-scene1341-master-blob-index.mjs master/tools/scene1341_master/production
