name: CG-MAIN V234 Phase1 study intake
on:
  push:
    branches:
      - cg-main-fourline-integration-20261026
    paths:
      - rebuild-preview/scene1341-readonly/scene1341-v234-phase1-test-overlay.mjs
      - rebuild-preview/scene1341-readonly/index.html
      - rebuild-preview/scene1341-readonly/scene1341-v238-v239-scene25-feed.mjs
      - tools/integration/test-scene1341-v234-phase1-test-overlay.mjs
      - tools/integration/test-scene1341-v238-v239-scene25-feed.mjs
      - tools/integration/test-scene1341-master-scene-v1.mjs
      - tools/integration/audit-scene1341-master-ipa.mjs
      - tools/integration/test-scene1341-master-ipa-audit.mjs
      - tools/integration/test-scene1341-answer-settings.mjs
      - rebuild-preview/scene1341-readonly/scene500-readonly-settings.js
      - rebuild-preview/scene1341-readonly/scene1341-master-scene-v1.mjs
      - rebuild-preview/scene1341-readonly/scene1341-first-review-stage.mjs
      - .github/workflows/cgmain-v234-phase1-smoke.yml
  workflow_dispatch:
jobs:
  phase1-v234-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check V234 source-identity, authored precedence and QA isolation
        run: node tools/integration/test-scene1341-v234-phase1-test-overlay.mjs
      - name: Check full Master IPA coverage audit arithmetic
        run: node tools/integration/test-scene1341-master-ipa-audit.mjs
      - name: Check all-1341 generic Master scene hot-swap contract
        run: node tools/integration/test-scene1341-master-scene-v1.mjs
      - name: Check rich answer show-hide preferences and SRS isolation
        run: node tools/integration/test-scene1341-answer-settings.mjs
      - name: Check dynamic V238/V239 16-scene L1 test feed
        run: node tools/integration/test-scene1341-v238-v239-scene25-feed.mjs
      - name: Check existing Phase1 immutable draft overlay regression
        run: node tools/integration/test-scene1341-phase1-fresh-drafts.mjs
