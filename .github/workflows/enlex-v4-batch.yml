name: ENLEX V4 1000-headword real batch
on:
  workflow_dispatch:
  push:
    branches: [experiment/enlex-v3-production-rebuild-20261030]
    paths:
      - '.github/workflows/enlex-v4-batch.yml'
      - 'tools/core20k_lexicon/production_v3/v4_batch_factory.py'
jobs:
  produce:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build complete Core20K V4 base in 20 batches
        run: |
          for start in $(seq 1 1000 19001); do
            python3 tools/core20k_lexicon/production_v3/v4_batch_factory.py --start-rank "$start" --headwords 1000
          done
          python3 - <<'PY'
          import pathlib,json,collections
          root=pathlib.Path('tools/core20k_lexicon/production_v3/v4_output')
          files=sorted(root.glob('rank_*/manifest.json'))
          assert len(files)==20,len(files)
          a=[json.loads(p.read_text()) for p in files]
          assert sum(x['unique_headwords'] for x in a)==19995
          assert sum(x['sense_count'] for x in a)==27471
          print('CORE20K_V4_TOTAL',{'headwords':sum(x['unique_headwords'] for x in a),'senses':sum(x['sense_count'] for x in a),'with_zh':sum(x['gloss_count'] for x in a),'missing_zh':sum(x['missing_zh'] for x in a)})
          PY
      - name: Persist verified complete batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/core20k_lexicon/production_v3/v4_output/
          git diff --cached --quiet || git commit -m "V4 produce full Core20K 20K-headword Sense candidate baseline"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: enlex-v4-full-core20k
          path: tools/core20k_lexicon/production_v3/v4_output/
          retention-days: 30
