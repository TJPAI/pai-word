name: ENLEX V4 1000-headword real batch
on:
  workflow_dispatch:
  push:
    branches: [experiment/enlex-v3-production-rebuild-20261030]
    paths:
      - '.github/workflows/enlex-v4-batch.yml'
      - 'tools/core20k_lexicon/production_v3/v4_batch_factory.py'
jobs:
  produce:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build next two 1000-headword batches
        run: |
          python3 tools/core20k_lexicon/production_v3/v4_batch_factory.py --start-rank 3001 --headwords 1000
          python3 tools/core20k_lexicon/production_v3/v4_batch_factory.py --start-rank 4001 --headwords 1000
      - name: Persist verified complete batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/core20k_lexicon/production_v3/v4_output/
          git diff --cached --quiet || git commit -m "V4 produce Core20K ranks 3001-5000 Sense draft batches"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: enlex-v4-core20k-rank3001-5000
          path: tools/core20k_lexicon/production_v3/v4_output/
          retention-days: 30
