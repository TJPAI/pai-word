name: CG-MAIN Scene1341 UI-only bookmark parity

on:
  push:
    branches:
      - cg-main-fourline-integration-20261026
    paths:
      - 'rebuild-preview/scene1341-readonly/index.html'
      - 'rebuild-preview/scene1341-readonly/scene1341-display-bookmark.js'
      - 'tools/integration/test-scene1341-display-bookmark-parity.mjs'
      - '.github/workflows/cgmain-scene1341-display-bookmark-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bookmark-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Scene500-like continue-learning with isolated UI-only bookmark
        run: node tools/integration/test-scene1341-display-bookmark-parity.mjs
