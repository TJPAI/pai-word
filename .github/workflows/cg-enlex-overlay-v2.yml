name: CG-ENLEX corrected lexical overlay V2
on:
  push:
    branches:
      - experiment/enlex-v3-production-rebuild-20261030
    paths:
      - .github/workflows/cg-enlex-overlay-v2.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/core20k_lexicon/production_v3/build_lexical_overlay_v2.py
      - name: Publish tested V2 draft overlay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/core20k_lexicon/production_v3/lexical_review_overlay_v2.jsonl tools/core20k_lexicon/production_v3/lexical_review_overlay_v2_summary.json
          git diff --cached --quiet || git commit -m "CG-ENLEX: publish corrected 539-entry draft lexical overlay V2"
          git push origin HEAD:experiment/enlex-v3-production-rebuild-20261030
