name: Scene1341 pronunciation source inspection
on:
  pull_request:
    paths:
      - 'tools/integration/inspect-core20k-pronunciation.mjs'
      - '.github/workflows/scene1341-pronunciation-inspect.yml'
  push:
    branches: [cg-main-sc1341-ipa-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/integration/inspect-core20k-pronunciation.mjs
