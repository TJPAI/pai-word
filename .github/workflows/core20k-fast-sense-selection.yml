name: Core20K Fast Incremental Sense Selection
on:
  workflow_dispatch:
  push:
    branches: [core20k-sense-v1-audit-20261027]
    paths:
      - tools/core20k_sense_v1/measure_selection_efficiency.py
      - tools/core20k_sense_v1/dedup_exact_definition_cards_v5.py
      - tools/core20k_sense_v1/source_examples_selection_v6.py
      - tools/core20k_sense_v1/select_attested_keep_v7.py
      - tools/core20k_sense_v1/semcor_sense_evidence_v8.py
      - .github/workflows/core20k-fast-sense-selection.yml
jobs:
  fast-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse frozen full20k source and selection artifacts
        uses: actions/download-artifact@v4
        with:
          name: core20k-oewn2025-full-source-candidates
          run-id: 40684148197
          github-token: ${{ github.token }}
          path: .
      - name: Install source lexicon lookup dependency
        run: python -m pip install "wn>=0.13,<2"
      - name: Install OEWN 2025 source examples
        run: python -c "import wn; wn.download('oewn:2025')"
      - name: Measure fast incremental selection efficiency and actual decision delta
        run: python3 tools/core20k_sense_v1/measure_selection_efficiency.py
      - name: Apply exact duplicated definition card display suppression V5
        run: python3 tools/core20k_sense_v1/dedup_exact_definition_cards_v5.py
      - name: Obtain actual OEWN usage examples for deferred Senses
        run: python3 tools/core20k_sense_v1/source_examples_selection_v6.py
      - name: Generate attested-use Keep proposals V7
        run: python3 tools/core20k_sense_v1/select_attested_keep_v7.py
      - name: Download SemCor annotated source corpus
        run: |
          python -m pip install nltk
          python -c "import nltk; nltk.download('semcor', quiet=True); nltk.download('wordnet', quiet=True)"
      - name: Extract SemCor Sense evidence V8
        run: python3 tools/core20k_sense_v1/semcor_sense_evidence_v8.py
      - uses: actions/upload-artifact@v4
        with:
          name: core20k-fast-selection-efficiency
          path: |
            **/selection_efficiency_round1.json
            **/sense_selection_v5_efficiency.json
            **/sense_selection_v5_exact_card_dedup.jsonl
            **/sense_selection_v6_manifest.json
            **/sense_selection_v6_attested_examples.jsonl
            **/sense_selection_v7_manifest.json
            **/sense_selection_v7_keep_attested.jsonl
            **/semcor_selection_v8_manifest.json
            **/semcor_exact_sense_evidence_v8.jsonl
          retention-days: 30
