name: CG-ENLEX Muse PatchC Mapping Candidates
on:
  push:
    branches:
      - experiment/enlex-v3-production-rebuild-20261030
    paths:
      - tools/core20k_lexicon/production_v3/prepare_mu_patchC_mapping.py
      - .github/workflows/cg-enlex-mu-patchC.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patchC_mapping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/core20k_lexicon/production_v3/prepare_mu_patchC_mapping.py
      - shell: bash
        run: |
          set -euo pipefail
          D=tools/core20k_lexicon/production_v3/qa_reports/cg_enlex_mu_patchC_v1
          mkdir -p /tmp/enlex-c
          cp "$D"/*.json* /tmp/enlex-c/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin experiment/enlex-v3-production-rebuild-20261030
            git reset --hard origin/experiment/enlex-v3-production-rebuild-20261030
            mkdir -p "$D"; cp /tmp/enlex-c/* "$D/"
            git add "$D"
            if git diff --cached --quiet; then break; fi
            git commit -m "CG-ENLEX Muse patchC mapping candidate report"
            if git push origin HEAD:experiment/enlex-v3-production-rebuild-20261030; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
          done
          python3 - <<'PY'
          import json,pathlib
          d=pathlib.Path("tools/core20k_lexicon/production_v3/qa_reports/cg_enlex_mu_patchC_v1")
          m=json.loads((d/"summary.json").read_text())
          assert m["input"]==98
          assert m["fix_mapping_candidates"]+m["keep"]+m["blocked"]==98
          assert not m["rank_or_existing_ku_modified"]
          print("PATCHC REMOTE CHECK",m)
          PY
