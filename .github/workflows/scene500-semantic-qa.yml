name: Scene500 Semantic QA
on:
  push:
    branches: [scene500-recommendation-dev]
    paths:
      - 'data/scene500-semantic-overlay-v0.2.json'
      - 'data/scene500-semantic-overlay-v1.1.json'
      - 'data/scene500-semantic-overlay-v1.2.json'
      - 'scripts/scene500-semantic-ranker.cjs'
      - 'scripts/validate-scene500-semantic.cjs'
      - 'tests/scene500-semantic-ranker.test.cjs'
      - '.github/workflows/scene500-semantic-qa.yml'
      - 'scripts/build-scene500-recommendation-catalog.cjs'
      - 'tests/scene500-recommendation-catalog.test.cjs'
      - 'scene500-recommendation/**'
      - 'scripts/audit-scene500-recommendation.cjs'
      - 'scripts/evaluate-scene500-recommendation.cjs'
      - 'scripts/verify-scene500-generated.cjs'
      - 'scene500-recommendation/query-holdout-v0.1.json'
      - 'scene500-recommendation/query-holdout-v0.2.json'
      - 'scene500-recommendation/query-expansions-v0.1.json'
      - 'data/scene500-recommendation-catalog-v0.1.json'
      - 'scene500-recommendation/catalog-v0.2.json'
      - 'rebuild-preview/data/home-scene-index-v1.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate overlay
        run: node scripts/validate-scene500-semantic.cjs
      - name: Run ranking regressions
        run: node tests/scene500-semantic-ranker.test.cjs
      - name: Build and test 500-scene catalog
        run: node tests/scene500-recommendation-catalog.test.cjs
      - name: Verify generated catalogs match committed semantic data
        run: node scripts/verify-scene500-generated.cjs
      - name: Audit all 500 scenes
        run: node scripts/audit-scene500-recommendation.cjs --strict
      - name: Test canonical title retrieval diagnostic
        run: node --test scene500-recommendation/coverage.test.mjs
      - name: Report natural language query diagnostics (unreviewed)
        run: node scripts/evaluate-scene500-recommendation.cjs --assert-structure > scene500-diagnostics-report.json
      - name: Report separate editorial holdout (not a release gate)
        run: node scripts/evaluate-scene500-recommendation.cjs --holdout --assert-structure > scene500-holdout-report.json
      - name: Report first-look holdout v0.2 (non-gating)
        run: node scripts/evaluate-scene500-recommendation.cjs --holdout-v2 --assert-structure > scene500-holdout-v2-report.json
      - name: Upload query diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene500-quality-reports
          path: |
            scene500-diagnostics-report.json
            scene500-holdout-report.json
            scene500-holdout-v2-report.json
          if-no-files-found: warn
      - name: Test Chinese20K lexical association builder
        run: node --test tests/scene500-chinese-associations.test.cjs
      - name: Test 20K Chinese lexicon intake
        run: node --test tests/scene500-chinese20k-intake.test.cjs
      - name: Test V0.9.4 exact-first word identity and overlap extraction
        run: node --test scene500-recommendation/zh-v094-runtime-bridge.test.mjs
      - name: Test Chinese Core20K RC1 lazy loader and fallback
        run: node --test scene500-recommendation/chinese-lexicon-loader.test.mjs
      - name: Verify cross-project data and recommendation interface contract
        run: node --test scene500-recommendation/contract-adapter.test.mjs
      - name: Test experimental sparse term-scene retriever
        run: node --test scene500-recommendation/sparse-retriever.test.mjs
      - name: Test independent browser ESM module
        run: node --test scene500-recommendation/engine.test.mjs
      - name: Test scene identity, eligibility, paging and diagnostic performance
        run: node --test scene500-recommendation/isolation-performance.test.mjs
