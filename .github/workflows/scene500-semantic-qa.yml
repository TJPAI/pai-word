name: Scene500 Semantic QA
on:
  push:
    branches: [core20k-rebuild-v1]
    paths:
      - 'data/scene500-semantic-overlay-v0.2.json'
      - 'data/scene500-semantic-overlay-v0.4.json'
      - 'scripts/scene500-semantic-ranker.cjs'
      - 'scripts/validate-scene500-semantic.cjs'
      - 'tests/scene500-semantic-ranker.test.cjs'
      - '.github/workflows/scene500-semantic-qa.yml'
      - 'scripts/build-scene500-recommendation-catalog.cjs'
      - 'tests/scene500-recommendation-catalog.test.cjs'
      - 'scene500-recommendation/**'
      - 'scripts/audit-scene500-recommendation.cjs'
      - 'data/scene500-recommendation-catalog-v0.1.json'
      - 'scene500-recommendation/catalog-v0.2.json'
      - 'rebuild-preview/data/home-scene-index-v1.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate overlay
        run: node scripts/validate-scene500-semantic.cjs
      - name: Run ranking regressions
        run: node tests/scene500-semantic-ranker.test.cjs
      - name: Build and test 500-scene catalog
        run: node tests/scene500-recommendation-catalog.test.cjs
      - name: Verify generated compact catalog is committed
        run: git diff --exit-code -- scene500-recommendation/catalog-v0.2.json
      - name: Audit all 500 scenes
        run: node scripts/audit-scene500-recommendation.cjs --strict
      - name: Test canonical title retrieval diagnostic
        run: node --test scene500-recommendation/coverage.test.mjs
      - name: Test independent browser ESM module
        run: node --test scene500-recommendation/engine.test.mjs
