name: CG ENLEX POS Overlay V2
on:
  push:
    branches: [experiment/enlex-v3-production-rebuild-20261030]
    paths:
      - tools/core20k_lexicon/production_v3/apply_mu_pos_overlay_v2.py
      - .github/workflows/cg-enlex-mu-pos-overlay-v2.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pos_overlay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/core20k_lexicon/production_v3/apply_mu_pos_overlay_v2.py
      - shell: bash
        run: |
          set -euo pipefail
          D=tools/core20k_lexicon/production_v3/qa_reports/cg_enlex_mu_pos_overlay_v2
          mkdir -p /tmp/pos-v2
          cp "$D"/*.json* /tmp/pos-v2/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin experiment/enlex-v3-production-rebuild-20261030
            git reset --hard origin/experiment/enlex-v3-production-rebuild-20261030
            mkdir -p "$D"; cp /tmp/pos-v2/* "$D/"
            git add "$D"
            if git diff --cached --quiet; then break; fi
            git commit -m "CG ENLEX high confidence POS overlay V2"
            if git push origin HEAD:experiment/enlex-v3-production-rebuild-20261030; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
          done
          python3 - <<'PY'
          import json,pathlib
          d=pathlib.Path("tools/core20k_lexicon/production_v3/qa_reports/cg_enlex_mu_pos_overlay_v2")
          m=json.loads((d/"summary.json").read_text())
          assert m["input"]==m["applied_candidates"]+m["blocked"]==101
          print("POS V2 VERIFIED",m)
          PY
