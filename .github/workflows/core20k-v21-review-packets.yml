name: Core20K V2.1 ENLEX ENTEACH review packets
on:
  workflow_dispatch:
  push:
    branches: [core20k-sense-v1-audit-20261027]
    paths:
      - 'tools/core20k_sense_v1/build_v21_review_packets.py'
      - '.github/workflows/core20k-v21-review-packets.yml'
jobs:
  packets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Download verified source-alignment and frozen-runtime handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tools/core20k_sense_v1/reports/cross_source_merged tools/core20k_sense_v1/reports/enlex_enteach_handoff
          gh run download 40564916587 -n core20k-oewn2025-kaikki-merged-20k -D tools/core20k_sense_v1/reports/cross_source_merged
          gh run download 40562810167 -n core20k-enlex-enteach-staging-20k -D tools/core20k_sense_v1/reports/enlex_enteach_handoff
      - name: Build ENLEX review and ENTEACH KU mapping candidates
        run: python3 tools/core20k_sense_v1/build_v21_review_packets.py
      - uses: actions/upload-artifact@v4
        with:
          name: core20k-v21-sense-ku-review-20k
          path: tools/core20k_sense_v1/reports/v21_review_packets/
          retention-days: 30
