name: CG ENLEX Definition Candidate QA
on:
  push:
    branches: [experiment/enlex-v3-production-rebuild-20261030]
    paths:
      - tools/core20k_lexicon/production_v3/qa_mu_definition_candidates_v1.py
      - .github/workflows/cg-enlex-mu-definitions.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate_definitions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/core20k_lexicon/production_v3/qa_mu_definition_candidates_v1.py
      - shell: bash
        run: |
          set -euo pipefail
          D=tools/core20k_lexicon/production_v3/qa_reports/cg_enlex_mu_definition_candidates_v1
          mkdir -p /tmp/enlex-defs
          cp "$D"/*.json* /tmp/enlex-defs/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin experiment/enlex-v3-production-rebuild-20261030
            git reset --hard origin/experiment/enlex-v3-production-rebuild-20261030
            mkdir -p "$D"
            cp /tmp/enlex-defs/* "$D/"
            git add "$D"
            if git diff --cached --quiet; then break; fi
            git commit -m "CG ENLEX curated definition QA output"
            if git push origin HEAD:experiment/enlex-v3-production-rebuild-20261030; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
          done
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("tools/core20k_lexicon/production_v3/qa_reports/cg_enlex_mu_definition_candidates_v1/summary.json")
          s=json.loads(p.read_text())
          assert s["patchF_input"]==s["candidate_definitions"]+s["deferred"]+s["blocked"]==96
          assert s["candidate_definitions"]==70
          print("DEFINITION CANDIDATES REMOTE VERIFIED",s)
          PY
