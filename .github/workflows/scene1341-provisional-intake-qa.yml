name: Scene1341 provisional KU intake source and QA gate
on:
  push:
    branches:
      - cg-main-provisional-1779-intake-20261112
      - cg-main-v51-provisional-v2-1778-20261112
      - main
    paths:
      - 'rebuild-preview/scene1341-provisional-intake.mjs'
      - 'rebuild-preview/scene1341-native-display-projection.mjs'
      - 'tools/integration/scene1341-provisional-intake-pin-20261112.v2.json'
      - 'tools/integration/validate-scene1341-provisional-intake.mjs'
      - 'tools/integration/test-scene1341-native-display-projection.mjs'
      - 'tools/integration/scene1341-native-answer-renderer-harness.mjs'
      - 'rebuild-preview/learning-runtime.js'
      - '.github/workflows/scene1341-provisional-intake-qa.yml'
      - 'tools/integration/test-scene1341-v2-intake-gate-regression.mjs'
  pull_request:
    paths:
      - 'rebuild-preview/scene1341-provisional-intake.mjs'
      - 'rebuild-preview/scene1341-native-display-projection.mjs'
      - 'tools/integration/scene1341-provisional-intake-pin-20261112.v2.json'
      - 'tools/integration/validate-scene1341-provisional-intake.mjs'
      - 'tools/integration/test-scene1341-native-display-projection.mjs'
      - 'tools/integration/scene1341-native-answer-renderer-harness.mjs'
      - 'rebuild-preview/learning-runtime.js'
      - '.github/workflows/scene1341-provisional-intake-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-source-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check fail-closed provisional gate syntax
        run: node --check rebuild-preview/scene1341-provisional-intake.mjs
      - name: Regression V2 hold, source identity and unauthorized staging
        run: node tools/integration/test-scene1341-v2-intake-gate-regression.mjs
      - name: Check actual Scene500 renderer harness syntax
        run: node --check tools/integration/scene1341-native-answer-renderer-harness.mjs
      - name: Verify Scene500 answerHtml-compatible read-only projection
        run: node tools/integration/test-scene1341-native-display-projection.mjs
      - name: Verify CG-QA corrected V2 1778 KU and reject held duplicate
        run: node tools/integration/validate-scene1341-provisional-intake.mjs
