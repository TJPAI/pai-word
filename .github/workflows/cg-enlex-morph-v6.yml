name: CG ENLEX Morphology V6
on:
  push:
    branches: [experiment/enlex-v3-production-rebuild-20261030]
    paths:
      - tools/core20k_lexicon/production_v3/build_mu_morph_v6.py
      - .github/workflows/cg-enlex-morph-v6.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  morphology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/core20k_lexicon/production_v3/build_mu_morph_v6.py
      - shell: bash
        run: |
          set -euo pipefail
          D=tools/core20k_lexicon/production_v3/qa_reports/cg_enlex_mu_morph_v6
          mkdir -p /tmp/morphv6
          cp "$D"/*.json* /tmp/morphv6/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin experiment/enlex-v3-production-rebuild-20261030
            git reset --hard origin/experiment/enlex-v3-production-rebuild-20261030
            mkdir -p "$D"; cp /tmp/morphv6/* "$D/"
            git add "$D"
            if git diff --cached --quiet; then break; fi
            git commit -m "CG ENLEX morphology candidates V6"
            if git push origin HEAD:experiment/enlex-v3-production-rebuild-20261030; then break; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
          done
          python3 - <<'PY'
          import json,pathlib
          d=pathlib.Path("tools/core20k_lexicon/production_v3/qa_reports/cg_enlex_mu_morph_v6")
          m=json.loads((d/"summary.json").read_text())
          assert m["total"]==71 and sum(m["classification"].values())==71
          print("VERIFIED",m)
          PY
