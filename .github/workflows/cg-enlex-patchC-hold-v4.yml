name: CG ENLEX PatchC Hold V4
on:
  push:
    branches: [experiment/enlex-v3-production-rebuild-20261030]
    paths:
      - tools/core20k_lexicon/production_v3/build_mu_patchC_hold_v4.py
      - .github/workflows/cg-enlex-patchC-hold-v4.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/core20k_lexicon/production_v3/build_mu_patchC_hold_v4.py
      - shell: bash
        run: |
          set -euo pipefail
          D=tools/core20k_lexicon/production_v3/qa_reports/cg_enlex_mu_patchC_hold_v4
          mkdir -p /tmp/hold-v4
          cp "$D"/*.json* /tmp/hold-v4/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin experiment/enlex-v3-production-rebuild-20261030
            git reset --hard origin/experiment/enlex-v3-production-rebuild-20261030
            mkdir -p "$D"; cp /tmp/hold-v4/* "$D/"
            git add "$D"
            if git diff --cached --quiet; then break; fi
            git commit -m "CG ENLEX enforce PatchC hold on 77 risk records"
            if git push origin HEAD:experiment/enlex-v3-production-rebuild-20261030; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
          done
          python3 - <<'PY'
          import pathlib,json,hashlib
          d=pathlib.Path("tools/core20k_lexicon/production_v3/qa_reports/cg_enlex_mu_patchC_hold_v4")
          m=json.loads((d/"summary.json").read_text())
          assert m["held_patchC"]==77 and m["total"]==27471
          assert hashlib.sha256((d/"review_pack_patchC_hold.jsonl").read_bytes()).hexdigest()==m["sha256"]
          print("VERIFIED",m)
          PY
