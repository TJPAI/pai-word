name: CG ENLEX PatchC Action Queue V3
on:
  push:
    branches: [experiment/enlex-v3-production-rebuild-20261030]
    paths:
      - tools/core20k_lexicon/production_v3/build_mu_patchC_actions_v3.py
      - .github/workflows/cg-enlex-patchC-actions-v3.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  action_queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/core20k_lexicon/production_v3/build_mu_patchC_actions_v3.py
      - shell: bash
        run: |
          set -euo pipefail
          D=tools/core20k_lexicon/production_v3/qa_reports/cg_enlex_mu_patchC_actions_v3
          mkdir -p /tmp/patc
          cp "$D"/*.json* /tmp/patc/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin experiment/enlex-v3-production-rebuild-20261030
            git reset --hard origin/experiment/enlex-v3-production-rebuild-20261030
            mkdir -p "$D"; cp /tmp/patc/* "$D/"
            git add "$D"
            if git diff --cached --quiet; then break; fi
            git commit -m "CG ENLEX patchC action queue V3"
            if git push origin HEAD:experiment/enlex-v3-production-rebuild-20261030; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
          done
          python3 - <<'PY'
          import json,pathlib
          d=pathlib.Path("tools/core20k_lexicon/production_v3/qa_reports/cg_enlex_mu_patchC_actions_v3")
          s=json.loads((d/"summary.json").read_text())
          assert s["total"]==77 and s["hold_single_answer"]==77
          print("VERIFIED",s)
          PY
