name: CG-MASTER Phase1 editorial integrity
on:
  push:
    branches: [cg-master-kaikki-evidence-intake-20261111]
    paths:
      - 'tools/scene1341_master/CGMASTER_CURRENT_STATE.json'
      - 'tools/scene1341_master/validate_phase1_editor_drafts.mjs'
      - 'tools/scene1341_master/validate_v212_editorial_handoff.mjs'
      - 'tools/scene1341_master/validate_v222_unified_qa_batch.mjs'
      - 'tools/scene1341_master/qa_reports/CGMASTER_V214_*'
      - 'tools/scene1341_master/qa_reports/CGMASTER_V220_*'
      - 'tools/scene1341_master/qa_reports/CGMASTER_V221_*'
      - 'tools/scene1341_master/qa_reports/CGMASTER_V208_*'
      - 'tools/scene1341_master/qa_reports/CGMASTER_V209_*'
      - 'tools/scene1341_master/qa_reports/CGMASTER_V211_*'
      - 'tools/scene1341_master/qa_reports/CGMASTER_V212_*'
      - 'tools/scene1341_master/qa_reports/CGMASTER_V19*_PHASE1*'
      - 'tools/scene1341_master/qa_reports/CGMASTER_V20*_PHASE1*'
      - '.github/workflows/cgmaster-phase1-integrity.yml'
  workflow_dispatch:
jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/scene1341_master/validate_phase1_editor_drafts.mjs
      - run: node tools/scene1341_master/validate_v212_editorial_handoff.mjs
      - run: node tools/scene1341_master/validate_v222_unified_qa_batch.mjs
