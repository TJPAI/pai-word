name: CG-ENLEX high-frequency KU QA 001
on:
  push:
    branches:
      - experiment/enlex-v3-production-rebuild-20261030
    paths:
      - .github/workflows/cg-enlex-highfreq-qa001.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Screen 500 selected recognition KU records
        run: python3 tools/core20k_lexicon/production_v3/audit_highfreq_ku_batch001.py
      - name: Submit ten 50-entry QA groups, then summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for n in $(seq -w 1 10); do
            git add "tools/core20k_lexicon/production_v3/teaching_qa/batch001/qa_recognition_001_${n}.jsonl"
            git diff --cached --quiet || git commit -m "CG-ENLEX teaching QA batch001 group ${n} (50)"
            git push origin HEAD:experiment/enlex-v3-production-rebuild-20261030
          done
          git add tools/core20k_lexicon/production_v3/teaching_qa/batch001/summary.json
          git diff --cached --quiet || git commit -m "CG-ENLEX: finalize 500-item teaching QA screening summary"
          git push origin HEAD:experiment/enlex-v3-production-rebuild-20261030
