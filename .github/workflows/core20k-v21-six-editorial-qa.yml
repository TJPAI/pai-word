name: Core20K V2.1 six editorial Sense KU QA
on:
  workflow_dispatch:
  push:
    branches: [core20k-sense-v1-audit-20261027]
    paths:
      - 'tools/core20k_sense_v1/editorial/**'
      - '.github/workflows/core20k-v21-six-editorial-qa.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/core20k_sense_v1/editorial/test_v21_first6_edits.py
      - run: python3 tools/core20k_sense_v1/editorial/test_v21_second_batch.py
      - run: python3 tools/core20k_sense_v1/editorial/build_safe_ku_review_pack.py
      - uses: actions/upload-artifact@v4
        with:
          name: core20k-v21-safe-ku-review-pack
          path: |
            tools/core20k_sense_v1/editorial/v21_enteach_valid_review_pack.jsonl
            tools/core20k_sense_v1/editorial/v21_enteach_valid_review_summary.json
