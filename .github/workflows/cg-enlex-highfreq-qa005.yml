name: CG-ENLEX high-frequency KU QA 005
on:
  push:
    branches:
      - experiment/enlex-v3-production-rebuild-20261030
    paths:
      - .github/workflows/cg-enlex-highfreq-qa005.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cg-enlex-highfreq-qa005
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Screen 500 recognition KUs
        run: python3 tools/core20k_lexicon/production_v3/audit_highfreq_ku_batch005.py
      - name: Commit each QA group and summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for n in $(seq -w 1 10); do
            git add "tools/core20k_lexicon/production_v3/teaching_qa/batch005/qa_recognition_005_${n}.jsonl"
            git diff --cached --quiet || git commit -m "CG-ENLEX teaching QA batch005 group ${n} (50)"
            git push origin HEAD:experiment/enlex-v3-production-rebuild-20261030
          done
          git add tools/core20k_lexicon/production_v3/teaching_qa/batch005/summary.json
          git diff --cached --quiet || git commit -m "CG-ENLEX: finalize Batch005 500 KU screening results"
          git push origin HEAD:experiment/enlex-v3-production-rebuild-20261030
