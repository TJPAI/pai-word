name: CG-ENLEX KU gloss triage
on:
  push:
    branches:
      - experiment/enlex-v3-production-rebuild-20261030
    paths:
      - .github/workflows/cg-enlex-gloss-triage.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/core20k_lexicon/production_v3/triage_gloss_variants.py
      - name: Publish triage report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/core20k_lexicon/production_v3/ku_gloss_triage.jsonl tools/core20k_lexicon/production_v3/ku_gloss_triage_summary.json
          git diff --cached --quiet || git commit -m "CG-ENLEX: publish KU gloss triage"
          git push origin HEAD:experiment/enlex-v3-production-rebuild-20261030
