name: Core20K Sense multi-source coverage QA
on:
  workflow_dispatch:
  push:
    branches: [core20k-sense-v1-audit-20261027]
    paths:
      - 'tools/core20k_sense_v1/join_online_evidence.py'
      - 'tools/core20k_sense_v1/prioritize_semantic_queue.py'
      - 'tools/core20k_sense_v1/build_first500_review_evidence.py'
      - 'tools/core20k_sense_v1/triage_first500_meanings.py'
      - 'tools/core20k_sense_v1/build_first500_review_actions.py'
      - 'tools/core20k_sense_v1/build_first500_provisional_decisions.py'
      - 'tools/core20k_sense_v1/find_semantic_neighbors_500.py'
      - 'tools/core20k_sense_v1/inspect_first500_merge_pairs.py'
      - 'tools/core20k_sense_v1/adjudicate_first8_pairs.py'
      - 'tools/core20k_sense_v1/precluster_full20k.py'
      - 'tools/core20k_sense_v1/build_full20k_review_manifest.py'
      - 'tools/core20k_sense_v1/build_full20k_release_gate.py'
      - '.github/workflows/core20k-sense-multisource.yml'
jobs:
  join:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch existing source datasets (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tools/core20k_sense_v1/reports/source_join
          gh run download 40538038296 -n sense-v1-oewn2025-full20k -D tools/core20k_sense_v1/reports/source_join/oewn
          gh run download 40546946174 -n core20k-online-source-collection -D tools/core20k_sense_v1/reports/source_join/ecdict
          gh run download 40547394067 -n core20k-zhwiktionary-matched -D tools/core20k_sense_v1/reports/source_join/zh
          gh run download 40547512665 -n core20k-kaikki-en-matched -D tools/core20k_sense_v1/reports/source_join/kaikki
          find tools/core20k_sense_v1/reports/source_join -maxdepth 3 -type f | head -30
      - name: Join 20K rank evidence and verify
        run: python3 tools/core20k_sense_v1/join_online_evidence.py
      - name: Prioritize missing and low-support Sense evidence
        run: python3 tools/core20k_sense_v1/prioritize_semantic_queue.py
      - name: Produce evidence-level first 500 review records
        run: python3 tools/core20k_sense_v1/build_first500_review_evidence.py
      - name: Triage meaning evidence for 500 words
        run: python3 tools/core20k_sense_v1/triage_first500_meanings.py
      - name: Build actionable semantic review queues
        run: python3 tools/core20k_sense_v1/build_first500_review_actions.py
      - name: Build provenance-aware provisional Sense decisions
        run: python3 tools/core20k_sense_v1/build_first500_provisional_decisions.py
      - name: Detect same-POS semantic merge candidates
        run: python3 tools/core20k_sense_v1/find_semantic_neighbors_500.py
      - name: Inspect exact candidate merge pairs
        run: python3 tools/core20k_sense_v1/inspect_first500_merge_pairs.py
      - name: Adjudicate eight observed grammatical/semantic neighbor pairs
        run: python3 tools/core20k_sense_v1/adjudicate_first8_pairs.py
      - name: Batch precluster all 20,000 headwords
        run: python3 tools/core20k_sense_v1/precluster_full20k.py
      - name: Full 20K review manifest and semantic QA priorities
        run: python3 tools/core20k_sense_v1/build_full20k_review_manifest.py
      - name: Verify full 20K lexical anomaly and semantic release gates
        run: python3 tools/core20k_sense_v1/build_full20k_release_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: sense-v1-multisource-coverage-20k
          path: |
            tools/core20k_sense_v1/reports/source_join/joined_coverage_20000.jsonl
            tools/core20k_sense_v1/reports/source_join/joined_coverage_summary.json
            tools/core20k_sense_v1/reports/source_join/prioritized_semantic_queue_20k.jsonl
            tools/core20k_sense_v1/reports/source_join/priority_summary.json
            tools/core20k_sense_v1/reports/source_join/first500_semantic_evidence.jsonl
            tools/core20k_sense_v1/reports/source_join/first500_semantic_evidence_summary.json
            tools/core20k_sense_v1/reports/source_join/first500_meaning_triage.jsonl
            tools/core20k_sense_v1/reports/source_join/first500_meaning_triage_summary.json
            tools/core20k_sense_v1/reports/source_join/first500_review_actions.jsonl
            tools/core20k_sense_v1/reports/source_join/first500_review_actions_summary.json
            tools/core20k_sense_v1/reports/source_join/first500_provisional_decisions.jsonl
            tools/core20k_sense_v1/reports/source_join/first500_provisional_decisions_summary.json
            tools/core20k_sense_v1/reports/source_join/first500_semantic_neighbor_suggestions.jsonl
            tools/core20k_sense_v1/reports/source_join/first500_semantic_neighbor_summary.json
            tools/core20k_sense_v1/reports/source_join/first500_merge_review_8_pairs.json
            tools/core20k_sense_v1/reports/source_join/first500_merge_editorial_decisions_8.json
            tools/core20k_sense_v1/reports/source_join/full20k_sense_preclusters.jsonl
            tools/core20k_sense_v1/reports/source_join/full20k_precluster_summary.json
            tools/core20k_sense_v1/reports/source_join/full20k_review_manifest.jsonl
            tools/core20k_sense_v1/reports/source_join/full20k_review_manifest_summary.json
            tools/core20k_sense_v1/reports/source_join/sense20k_release_gate.jsonl
            tools/core20k_sense_v1/reports/source_join/sense20k_release_gate_summary.json
