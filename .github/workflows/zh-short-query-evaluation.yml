name: ZH Core20K Short Query Evaluation
on:
  push:
    branches: [chinese-core20k-dev]
    paths:
      - 'tools/chinese-core20k/segmentation/**'
      - 'tools/chinese-core20k/qa/zh-short-query-segmentation-fixtures-20261026.json'
      - 'scripts/evaluate-zh-short-query-core20k.mjs'
      - 'scripts/test-zh-short-query-candidates.mjs'
      - 'scripts/test-zh-short-query-edgecases.mjs'
      - 'scripts/test-zh-short-query-segmentation-fixtures.mjs'
      - 'scripts/materialize-zh-core20k-v0101.mjs'
      - 'data/zh-core20k-v0101-scene500-runtime.json.gz.b64'
      - '.github/workflows/zh-short-query-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize and SHA verify canonical Chinese Core20K
        run: node scripts/materialize-zh-core20k-v0101.mjs
      - name: QA annotation integrity
        run: node scripts/test-zh-short-query-segmentation-fixtures.mjs
      - name: QA segmentation candidates (fixture dictionary)
        run: node scripts/test-zh-short-query-candidates.mjs
      - name: QA edge cases and deterministic candidate generation
        run: node scripts/test-zh-short-query-edgecases.mjs
      - name: Evaluate real Core20K dictionary
        run: |
          set -o pipefail
          node scripts/evaluate-zh-short-query-core20k.mjs | tee zh-short-query-core20k-evaluation.json
      - name: Publish evaluation summary
        if: always()
        run: |
          if test -s zh-short-query-core20k-evaluation.json; then
            node -e '
              const fs=require("fs");
              const r=JSON.parse(fs.readFileSync("zh-short-query-core20k-evaluation.json","utf8"));
              const lines=[
                "## Chinese Core20K short-query evaluation",
                "",
                "| Measurement | Result |",
                "|---|---:|",
                "| Runtime terms | "+r.term_count+" |",
                "| Gold paths found | "+r.gold_paths_found+"/"+r.fixture_count+" |",
                "| Gold paths missing | "+r.gold_paths_missing+" |",
                "| Recall by candidate cap | "+r.recall_by_candidate_cap.map(x=>"K"+x.k+": "+x.gold_paths_found+"/"+r.fixture_count).join("; ")+" |",
                "| Total measured latency (ms) | "+r.elapsed_ms_total+" |",
                "",
                "**Non-production experiment; this is not Scene500 semantic certification.**"
              ];
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join("\n")+"\n");
            '
          else
            echo "Evaluation JSON absent; inspect failed steps" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zh-short-query-core20k-evaluation
          path: zh-short-query-core20k-evaluation.json
          if-no-files-found: ignore
