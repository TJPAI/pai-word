name: Core20K V2.1 Top1000 Content Export
on:
  workflow_dispatch:
  push:
    branches: [core20k-sense-v1-audit-20261027]
    paths:
      - 'tools/core20k_sense_v1/export_top1000_content.py'
      - 'tools/core20k_sense_v1/audit_top1000_senses.py'
      - 'tools/core20k_sense_v1/export_top1000_missing19.py'
      - 'tools/core20k_sense_v1/build_top1000_unified_teaching.py'
      - 'tools/core20k_sense_v1/export_top1000_l2_contextual.py'
      - 'tools/core20k_sense_v1/export_top1000_contextual_34.py'
      - '.github/workflows/core20k-v21-top1000-export.yml'
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Export top1000 actual bilingual sense and reusable teaching KUs
        run: python3 tools/core20k_sense_v1/export_top1000_content.py
      - name: Audit bilingual Sense/KU candidates
        run: python3 tools/core20k_sense_v1/audit_top1000_senses.py
      - name: Export exact missing Sense headwords
        run: python3 tools/core20k_sense_v1/export_top1000_missing19.py
      - name: Build and validate unified 1000-word teaching review pack
        run: python3 tools/core20k_sense_v1/build_top1000_unified_teaching.py
      - name: Export source-checked L2 contextual six KU sample
        run: python3 tools/core20k_sense_v1/export_top1000_l2_contextual.py
      - name: Import 34 contextual grammar and collocation exercises with blocker QA
        run: python3 tools/core20k_sense_v1/export_top1000_contextual_34.py
      - uses: actions/upload-artifact@v4
        with:
          name: Core20K-V2.1-TOP1000-Sense-KU-Staging
          path: tools/core20k_sense_v1/release/v2.1-top1000/
          retention-days: 90
