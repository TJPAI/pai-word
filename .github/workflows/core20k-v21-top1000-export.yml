name: Core20K V2.1 Top1000 Content Export
on:
  workflow_dispatch:
  push:
    branches: [core20k-sense-v1-audit-20261027]
    paths:
      - 'tools/core20k_sense_v1/export_top1000_content.py'
      - '.github/workflows/core20k-v21-top1000-export.yml'
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Export top1000 actual bilingual sense and reusable teaching KUs
        run: python3 tools/core20k_sense_v1/export_top1000_content.py
      - uses: actions/upload-artifact@v4
        with:
          name: Core20K-V2.1-TOP1000-Sense-KU-Staging
          path: tools/core20k_sense_v1/release/v2.1-top1000/
          retention-days: 90
