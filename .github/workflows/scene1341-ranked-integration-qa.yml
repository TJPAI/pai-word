name: Scene1341 ranked V51–V61 integration QA
on:
  push:
    branches:
      - cg-main-fourline-integration-20261026
    paths:
      - 'tools/integration/scene1341-ranked/**'
      - 'tools/integration/validate-scene1341-ranked.py'
      - 'tools/integration/test-scene1341-ranked-browser.mjs'
      - 'tools/integration/scene1341-provisional-intake-pin-20261112.v1.json'
      - 'tools/integration/validate-scene1341-provisional-intake.mjs'
      - 'rebuild-preview/scene1341-provisional-intake.mjs'
      - 'rebuild-preview/scene1341-ranked-**'
      - 'rebuild-preview/scene1341-ranked/**'
      - 'rebuild-preview/home-dashboard.js'
      - 'rebuild-preview/scene1341-home-adapter.mjs'
      - 'tools/integration/test-scene1341-home-replacement.mjs'
      - 'tools/integration/test-scene1341-teaching-consumption.mjs'
      - 'tools/integration/scene1341-teaching/**'
      - 'rebuild-preview/scene1341-teaching-consumption.mjs'
      - 'rebuild-preview/scene1341-srs-v2.mjs'
      - 'tools/integration/test-scene1341-srs-v2.mjs'
      - 'tools/integration/test-scene1341-srs-legacy-parity.mjs'
      - 'rebuild-preview/memory-schedulers.js'
      - 'rebuild-preview/scene1341-srs-indexeddb.mjs'
      - 'rebuild-preview/scene1341-release-gate.mjs'
      - 'rebuild-preview/scene1341-study-session.mjs'
      - 'tools/integration/test-scene1341-study-session.mjs'
      - 'tools/integration/test-scene1341-release-gate.mjs'
      - 'rebuild-preview/scene1341-study-preview.mjs'
      - 'rebuild-preview/scene1341-qa-preview.mjs'
      - 'tools/integration/test-scene1341-qa-preview.mjs'
      - 'rebuild-preview/scene1341-readonly/index.html'
      - 'tools/integration/test-scene1341-readonly-mobile-demo.mjs'
      - 'tools/integration/test-scene1341-v111-master-loader.mjs'
      - 'rebuild-preview/scene1341-readonly/scene1341-master-preview-loader.mjs'
      - 'rebuild-preview/scene1341-readonly/scene1341-v120-sc0011-loader.mjs'
      - 'rebuild-preview/scene1341-readonly/scene1341-v123-sc0011-loader.mjs'
      - 'rebuild-preview/scene1341-readonly/scene1341-v128-sc0011-loader.mjs'
      - 'rebuild-preview/scene1341-readonly/scene1341-next-three-master-loader.mjs'
      - 'tools/integration/test-scene1341-study-preview.mjs'
      - 'tools/integration/test-scene1341-srs-indexeddb.mjs'
      - 'tools/integration/test-scene1341-ranked-offline-shell.mjs'
      - 'tools/integration/test-scene1341-ranked-service-worker.mjs'
      - 'tools/integration/test-scene1341-ranked-pages-route.mjs'
      - '.github/workflows/scene1341-ranked-integration-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 11 source Git blobs and 19371 ranked expressions
        run: python tools/integration/validate-scene1341-ranked.py
      - name: Verify CG-QA 1779 answer candidates remain quarantined until Master approval
        run: node tools/integration/validate-scene1341-provisional-intake.mjs
      - name: Validate Safari-safe isolated preview module
        run: |
          node --check rebuild-preview/scene1341-ranked-preview.mjs
          node --check rebuild-preview/scene1341-ranked-ui.mjs
          node tools/integration/test-scene1341-ranked-browser.mjs
          node --check rebuild-preview/scene1341-ranked/sw.js
          node tools/integration/test-scene1341-ranked-offline-shell.mjs
          node tools/integration/test-scene1341-ranked-service-worker.mjs
          node tools/integration/test-scene1341-ranked-pages-route.mjs
          node --check rebuild-preview/home-dashboard.js
          node --check rebuild-preview/scene1341-home-adapter.mjs
          node tools/integration/test-scene1341-home-replacement.mjs
          node --check rebuild-preview/scene1341-teaching-consumption.mjs
          node tools/integration/test-scene1341-teaching-consumption.mjs
          node --check rebuild-preview/scene1341-srs-v2.mjs
          node tools/integration/test-scene1341-srs-v2.mjs
          node tools/integration/test-scene1341-srs-legacy-parity.mjs
          node --check rebuild-preview/scene1341-srs-indexeddb.mjs
          node tools/integration/test-scene1341-srs-indexeddb.mjs
          node --check rebuild-preview/scene1341-release-gate.mjs
          node tools/integration/test-scene1341-release-gate.mjs
          node --check rebuild-preview/scene1341-study-session.mjs
          node tools/integration/test-scene1341-study-session.mjs
          node --check rebuild-preview/scene1341-study-preview.mjs
          node tools/integration/test-scene1341-study-preview.mjs
          node --check rebuild-preview/scene1341-qa-preview.mjs
          node tools/integration/test-scene1341-qa-preview.mjs
      - name: Validate manifest-pinned V116+V128+V134/V142/V147 Master
        run: node tools/integration/test-scene1341-v111-master-loader.mjs
      - name: Validate isolated read-only mobile demo
        run: node tools/integration/test-scene1341-readonly-mobile-demo.mjs
