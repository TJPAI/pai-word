name: CG-MASTER Kaikki evidence gap audit
# Inspect ipa_candidates field values in addition to evidence gaps.
on:
  push:
    branches: [cg-master-kaikki-evidence-intake-20261111]
    paths:
      - .github/workflows/cgmaster-evidence-gap-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        range:
          - {start: 1, end: 150}
          - {start: 151, end: 300}
          - {start: 301, end: 450}
          - {start: 451, end: 600}
          - {start: 601, end: 750}
          - {start: 751, end: 900}
          - {start: 901, end: 1050}
          - {start: 1051, end: 1200}
          - {start: 1201, end: 1341}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect missing Kaikki evidence and candidate field structure
        run: |
          node --check tools/scene1341_master/audit_kaikki_evidence_gaps.mjs
          node tools/scene1341_master/audit_kaikki_evidence_gaps.mjs ${{ matrix.range.start }} ${{ matrix.range.end }} > /tmp/cgmaster-evidence-gaps.json
          cat /tmp/cgmaster-evidence-gaps.json
          node --check tools/scene1341_master/ipa_consensus_probe.mjs
          node tools/scene1341_master/ipa_consensus_probe.mjs ${{ matrix.range.start }} ${{ matrix.range.end }} > /tmp/cgmaster-ipa-consensus.json
          cat /tmp/cgmaster-ipa-consensus.json
      - uses: actions/upload-artifact@v4
        with:
          name: cgmaster-evidence-gaps-${{ matrix.range.start }}-${{ matrix.range.end }}
          path: |
            /tmp/cgmaster-evidence-gaps.json
            /tmp/cgmaster-ipa-consensus.json
