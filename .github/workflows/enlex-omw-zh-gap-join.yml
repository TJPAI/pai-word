name: ENLEX OMW Chinese source-evidence gap join
on:
  workflow_dispatch:
  push:
    branches:
      - experiment/enlex-v3-production-rebuild-20261030
    paths:
      - '.github/workflows/enlex-omw-zh-gap-join.yml'
jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve verified historical V109 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/12945699845/zip" \
            -o /tmp/enlex-v109-ili-bridge.zip
          unzip -t /tmp/enlex-v109-ili-bridge.zip >/dev/null
      - name: Build exact-OEWN-synset Chinese candidate evidence
        run: |
          python3 tools/core20k_lexicon/production_v3/coverage/enlex_omw_gap_join.py \
            --omw-zip /tmp/enlex-v109-ili-bridge.zip \
            --out tools/core20k_lexicon/production_v3/coverage/omw-zh-gap-output
      - name: Persist source-evidence candidates in GitHub JSONL shards
        run: |
          python3 - <<'PY'
          import pathlib,json
          src=pathlib.Path('tools/core20k_lexicon/production_v3/coverage/omw-zh-gap-output')
          dst=pathlib.Path('tools/core20k_lexicon/production_v3/coverage/omw_zh_gap_persistence')
          dst.mkdir(parents=True,exist_ok=True)
          lines=(src/'omw_zh_evidence_candidates.jsonl').read_text(encoding='utf-8').splitlines()
          assert len(lines)==7302
          for idx in range(0,len(lines),500):
              (dst/f'candidates_{idx//500+1:03}.jsonl').write_text(chr(10).join(lines[idx:idx+500])+chr(10),encoding='utf-8')
          (dst/'manifest.json').write_bytes((src/'manifest.json').read_bytes())
          print('persisted rows',len(lines),'shards',(len(lines)+499)//500)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/core20k_lexicon/production_v3/coverage/omw_zh_gap_persistence/
          git diff --cached --quiet || git commit -m "Persist 7302 exact OMW Chinese source evidence candidates (uncertified)"
          git push origin HEAD:experiment/enlex-v3-production-rebuild-20261030
      - uses: actions/upload-artifact@v4
        with:
          name: enlex-omw-zh-gap-evidence
          path: tools/core20k_lexicon/production_v3/coverage/omw-zh-gap-output/
          retention-days: 60
