name: ENLEX frozen Runtime gloss census
on:
  push:
    branches: [enlex-gloss-audit-20261026]
    paths:
      - 'tools/core20k_lexicon/qa/audit_runtime_glosses.py'
      - '.github/workflows/enlex-gloss-census.yml'
      - 'tools/core20k_lexicon/qa/validate_enlex_26_gloss_overlay.py'
      - 'tools/core20k_lexicon/qa/ENLEX_26_KU_GLOSS_CANDIDATE_OVERLAY.v1.json'
      - 'tools/core20k_lexicon/qa/ENLEX_23_DUAL_AI_PASS_GLOSS_PREACTIVATION.v1.json'
      - 'tools/core20k_lexicon/qa/validate_enlex_23_dual_ai_package.py'
      - 'tools/core20k_lexicon/qa/prepare_enlex_23_gloss_overlay.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run frozen 20K census and strict SHA/identity checks
        run: python tools/core20k_lexicon/qa/audit_runtime_glosses.py --runtime data/core20k-runtime.json.gz --out tools/core20k_lexicon/qa/gloss-census-out
      - name: Validate 26 exact-KU candidate overlay against frozen source
        run: python tools/core20k_lexicon/qa/validate_enlex_26_gloss_overlay.py
      - name: Validate 23 dual-AI agreed glosses against production Runtime
        run: python tools/core20k_lexicon/qa/validate_enlex_23_dual_ai_package.py
      - name: Dry-run exact KU 23 gloss overlay with no Runtime modification
        run: python tools/core20k_lexicon/qa/prepare_enlex_23_gloss_overlay.py
      - name: Publish read-only audit result
        uses: actions/upload-artifact@v4
        with:
          name: enlex-gloss-census-${{ github.sha }}
          path: tools/core20k_lexicon/qa/gloss-census-out/
          retention-days: 30
      - name: Commit reproducible census output to isolated audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/core20k_lexicon/qa/gloss-census-out/
          if ! git diff --cached --quiet; then
            git commit -m "qa(enlex): save frozen Runtime gloss census result"
            git push origin HEAD:enlex-gloss-audit-20261026
          fi
