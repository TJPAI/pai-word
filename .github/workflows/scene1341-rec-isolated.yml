name: CG-REC Scene1341 isolated bilingual retrieval
on:
  push:
    branches: [scene500-recommendation-dev]
    paths:
      - 'scene500-recommendation/scene1341-isolated-search.mjs'
      - 'scene500-recommendation/scene1341-search-core.mjs'
      - 'scene500-recommendation/scene1341-experimental-intent-aliases.mjs'
      - 'scene500-recommendation/qa/test-scene1341-isolated-search.mjs'
      - 'scene500-recommendation/qa/benchmark-scene1341-cache.mjs'
      - 'scene500-recommendation/qa/measure-scene1341-memory.mjs'
      - 'scene500-recommendation/qa/validate-scene1341-budget.mjs'
      - 'scene500-recommendation/qa/scene1341-nonblind-error-casebook.mjs'
      - 'scene500-recommendation/qa/scene1341-casebook-provenance-trace.mjs'
      - 'scene500-recommendation/qa/scene1341-functional-token-ab.mjs'
      - 'scene500-recommendation/qa/scene1341-eight-query-review-packet.mjs'
      - 'scene500-recommendation/qa/scene1341-factorial-open-ab.mjs'
      - 'scene500-recommendation/qa/scene1341-open-counterfactual-top5-audit.mjs'
      - 'scene500-recommendation/qa/scene1341-ticket-refund-contrastive-ab.mjs'
      - 'scene500-recommendation/qa/test-scene1341-budget.mjs'
      - '.github/workflows/scene1341-rec-isolated.yml'
  pull_request:
    branches: [scene500-recommendation-dev]
    paths:
      - 'scene500-recommendation/**'
      - '.github/workflows/scene1341-rec-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: rec
      - uses: actions/checkout@v4
        with:
          repository: TJPAI/pai-word
          ref: 17c6c758e1dfd27cfa2fe1669d3f1784bedb0668
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: TJPAI/pai-word
          ref: 6e66864e8fe494fb5d83c443a912b997d2b0d926
          path: rec/baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preflight syntax and frozen comparison checkout
        run: |
          node --check rec/scene500-recommendation/scene1341-search-core.mjs
          node --check rec/scene500-recommendation/scene1341-isolated-search.mjs
          node --check rec/scene500-recommendation/qa/test-scene1341-isolated-search.mjs
          node --check rec/scene500-recommendation/qa/benchmark-scene1341-cache.mjs
          node --check rec/scene500-recommendation/qa/measure-scene1341-memory.mjs
          node --check rec/scene500-recommendation/qa/validate-scene1341-budget.mjs
          node --check rec/scene500-recommendation/qa/scene1341-nonblind-error-casebook.mjs
          node --check rec/scene500-recommendation/qa/scene1341-casebook-provenance-trace.mjs
          node --check rec/scene500-recommendation/qa/scene1341-functional-token-ab.mjs
          node --check rec/scene500-recommendation/qa/scene1341-eight-query-review-packet.mjs
          node --check rec/scene500-recommendation/qa/scene1341-factorial-open-ab.mjs
          node --check rec/scene500-recommendation/qa/scene1341-open-counterfactual-top5-audit.mjs
          node --check rec/scene500-recommendation/qa/scene1341-ticket-refund-contrastive-ab.mjs
          node --check rec/scene500-recommendation/qa/test-scene1341-budget.mjs
          node --check rec/baseline/scene500-recommendation/scene1341-search-core.mjs
          test "$(git -C rec/baseline rev-parse HEAD)" = "6e66864e8fe494fb5d83c443a912b997d2b0d926"
      - name: Verify engineering budget gate fails closed
        run: |
          node rec/scene500-recommendation/qa/test-scene1341-budget.mjs
      - name: Verify pinned editorial input identities
        run: |
          test "$(git -C source rev-parse HEAD)" = "17c6c758e1dfd27cfa2fe1669d3f1784bedb0668"
          test "$(git -C source rev-parse HEAD:tools/integration/scene1341-ranked/manifest.json)" = "803d2fccfd2d1ec200723f7f38e73d57495a5dd0"
          test "$(git -C source rev-parse HEAD:tools/integration/scene1341-ranked/v51-ranked.csv)" = "eaa6d729bb04a9bedbafd8e1081a11fc791caa39"
      - name: Run real 1341 catalog and 19371-row isolated recommendation smoke
        run: |
          node rec/scene500-recommendation/qa/test-scene1341-isolated-search.mjs \
            source/tools/integration/scene1341-source/PAI_Word_Scene50_V1.5_Structural_Catalog.csv \
            source/tools/integration/scene1341-ranked \
            17c6c758e1dfd27cfa2fe1669d3f1784bedb0668 \
            803d2fccfd2d1ec200723f7f38e73d57495a5dd0 \
            > scene1341-isolated-search-smoke.json
          node -e "const r=require('./scene1341-isolated-search-smoke.json');if(r.status!=='PASS_ISOLATED_STRUCTURE_AND_SMOKE'||r.release_allowed!==false||r.independent_certified!==0)process.exit(1);"
      - name: Benchmark cached normalization against pinned uncached baseline
        run: |
          test "$(git -C rec/baseline rev-parse HEAD)" = "6e66864e8fe494fb5d83c443a912b997d2b0d926"
          node rec/scene500-recommendation/qa/benchmark-scene1341-cache.mjs \
            source/tools/integration/scene1341-source/PAI_Word_Scene50_V1.5_Structural_Catalog.csv \
            source/tools/integration/scene1341-ranked \
            17c6c758e1dfd27cfa2fe1669d3f1784bedb0668 \
            803d2fccfd2d1ec200723f7f38e73d57495a5dd0 \
            > scene1341-normalization-cache-ab.json
          node -e "const r=require('./scene1341-normalization-cache-ab.json');if(r.status!=='PASS_SOURCE_PINNED_PARITY'||r.parityComparisons!==52||r.release_allowed!==false)process.exit(1);"
      - name: Measure separate-process Node heap and cold index construction
        run: |
          node --expose-gc rec/scene500-recommendation/qa/measure-scene1341-memory.mjs baseline \
            source/tools/integration/scene1341-source/PAI_Word_Scene50_V1.5_Structural_Catalog.csv \
            source/tools/integration/scene1341-ranked \
            17c6c758e1dfd27cfa2fe1669d3f1784bedb0668 \
            803d2fccfd2d1ec200723f7f38e73d57495a5dd0 \
            > scene1341-memory-baseline.json
          node --expose-gc rec/scene500-recommendation/qa/measure-scene1341-memory.mjs candidate \
            source/tools/integration/scene1341-source/PAI_Word_Scene50_V1.5_Structural_Catalog.csv \
            source/tools/integration/scene1341-ranked \
            17c6c758e1dfd27cfa2fe1669d3f1784bedb0668 \
            803d2fccfd2d1ec200723f7f38e73d57495a5dd0 \
            > scene1341-memory-candidate.json
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('scene1341-memory-baseline.json'));const b=JSON.parse(fs.readFileSync('scene1341-memory-candidate.json'));if(a.variant!=='baseline'||b.variant!=='candidate'||a.trials.length!==5||b.trials.length!==5||a.processIsolation!=='FRESH_NODE_PROCESS_PER_TRIAL'||b.processIsolation!=='FRESH_NODE_PROCESS_PER_TRIAL'||a.sourceBytes!==b.sourceBytes||a.sourceBytes<1000000||a.release_allowed||b.release_allowed||![...a.trials,...b.trials].every(x=>Number.isFinite(x.buildMs)&&Number.isFinite(x.retainedHeapDeltaBytes)))process.exit(1);"
      - name: Enforce pinned query latency and Node heap/build budgets
        run: |
          node rec/scene500-recommendation/qa/validate-scene1341-budget.mjs \
            scene1341-normalization-cache-ab.json \
            scene1341-memory-baseline.json \
            scene1341-memory-candidate.json \
            > scene1341-engineering-budget-gate.json
      - name: Capture 32 nonblind real-source query contrast diagnostics
        run: |
          node rec/scene500-recommendation/qa/scene1341-nonblind-error-casebook.mjs \
            source/tools/integration/scene1341-source/PAI_Word_Scene50_V1.5_Structural_Catalog.csv \
            source/tools/integration/scene1341-ranked \
            17c6c758e1dfd27cfa2fe1669d3f1784bedb0668 \
            803d2fccfd2d1ec200723f7f38e73d57495a5dd0 \
            > scene1341-nonblind-error-casebook.json
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('scene1341-nonblind-error-casebook.json'));if(r.caseCount!==32||r.queryExecutions!==64||r.independentGoldCount!==0||r.engineReleaseAllowed!==false||r.cases.length!==32)process.exit(1);"
      - name: Trace source-provenance and real catalog names for nonblind retrieval risks
        run: |
          node rec/scene500-recommendation/qa/scene1341-casebook-provenance-trace.mjs \
            scene1341-nonblind-error-casebook.json \
            source/tools/integration/scene1341-source/PAI_Word_Scene50_V1.5_Structural_Catalog.csv \
            source/tools/integration/scene1341-ranked \
            17c6c758e1dfd27cfa2fe1669d3f1784bedb0668 \
            803d2fccfd2d1ec200723f7f38e73d57495a5dd0 \
            > scene1341-nonblind-source-provenance.json
          node -e "const r=require('./scene1341-nonblind-source-provenance.json');if(r.caseCount!==32||r.watched.length!==4||r.sourceSenseRows!==19371||r.sourceSceneRows!==1341||r.independentGoldCount!==0||r.release_allowed!==false)process.exit(1);"
      - name: Compare 128 opt-in functional-token hypothesis trials against frozen open casebook
        run: |
          node rec/scene500-recommendation/qa/scene1341-functional-token-ab.mjs \
            scene1341-nonblind-error-casebook.json \
            source/tools/integration/scene1341-source/PAI_Word_Scene50_V1.5_Structural_Catalog.csv \
            source/tools/integration/scene1341-ranked \
            17c6c758e1dfd27cfa2fe1669d3f1784bedb0668 \
            803d2fccfd2d1ec200723f7f38e73d57495a5dd0 \
            > scene1341-functional-token-ab.json
          node -e "const r=require('./scene1341-functional-token-ab.json');if(r.caseCount!==32||r.queryEvaluations!==128||r.distinctTop1ChangedQueryCount!==3||r.distinctQueryCount>128||r.independentGoldCount!==0||r.release_allowed!==false||r.experiment!=='ONLY_OPT_IN')process.exit(1);"
      - name: Build eight unique-query independent semantic adjudication handoff
        run: |
          node rec/scene500-recommendation/qa/scene1341-eight-query-review-packet.mjs \
            scene1341-functional-token-ab.json \
            scene1341-nonblind-source-provenance.json \
            > scene1341-eight-unique-query-review-packet.json
          node -e "const r=require('./scene1341-eight-unique-query-review-packet.json');if(r.affectedUniqueQueries!==8||r.top1ChangedUniqueQueries!==3||r.formalHumanGold!==0||r.release_allowed!==false||r.reviewItems.some(x=>x.independentRelevanceVerdict!=='NOT_ADJUDICATED'))process.exit(1);"
      - name: Evaluate 59 distinct open queries across four source-pinned counterfactual engines
        run: |
          node rec/scene500-recommendation/qa/scene1341-factorial-open-ab.mjs \
            scene1341-nonblind-error-casebook.json \
            source/tools/integration/scene1341-source/PAI_Word_Scene50_V1.5_Structural_Catalog.csv \
            source/tools/integration/scene1341-ranked \
            17c6c758e1dfd27cfa2fe1669d3f1784bedb0668 \
            803d2fccfd2d1ec200723f7f38e73d57495a5dd0 \
            > scene1341-four-arm-open-factorial.json
          node -e "const x=require('./scene1341-four-arm-open-factorial.json');if(x.stats.queries!==59||x.stats.evaluations!==236||x.formalHumanGold!==0||x.release_allowed!==false||!x.defaultFlagsBothFalse||x.protectedBlind24Accessed)process.exit(1);"
      - name: Audit four open failure cases with full Top5 rank deltas and source-only anchors
        run: |
          node rec/scene500-recommendation/qa/scene1341-open-counterfactual-top5-audit.mjs \
            scene1341-four-arm-open-factorial.json > scene1341-open-counterfactual-top5-audit.json
          node -e "const a=require('./scene1341-open-counterfactual-top5-audit.json');if(a.targetCases.length!==4||a.formalHumanGold!==0||a.blind24Accessed||a.release_allowed||a.algorithmChanged||a.sourceQueries!==59||a.fourArmExecutions!==236)process.exit(1);"
      - name: Test isolated contrastive ticket refund opt-in against untouched default
        run: |
          node rec/scene500-recommendation/qa/scene1341-ticket-refund-contrastive-ab.mjs \
            source/tools/integration/scene1341-source/PAI_Word_Scene50_V1.5_Structural_Catalog.csv \
            source/tools/integration/scene1341-ranked \
            17c6c758e1dfd27cfa2fe1669d3f1784bedb0668 \
            803d2fccfd2d1ec200723f7f38e73d57495a5dd0 \
            scene1341-four-arm-open-factorial.json \
            > scene1341-ticket-refund-contrastive-ab.json
          node -e "const x=require('./scene1341-ticket-refund-contrastive-ab.json');if(x.queries!==5||x.searches!==10||x.independentHumanGold!==0||x.release_allowed||!x.defaultBehaviorUnchanged||x.protectedBlind24Accessed)process.exit(1);"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cg-rec-scene1341-isolated-mixed-smoke
          path: |
            scene1341-isolated-search-smoke.json
            scene1341-normalization-cache-ab.json
            scene1341-memory-baseline.json
            scene1341-memory-candidate.json
            scene1341-engineering-budget-gate.json
            scene1341-nonblind-error-casebook.json
            scene1341-nonblind-source-provenance.json
            scene1341-functional-token-ab.json
            scene1341-eight-unique-query-review-packet.json
            scene1341-four-arm-open-factorial.json
            scene1341-open-counterfactual-top5-audit.json
            scene1341-ticket-refund-contrastive-ab.json
