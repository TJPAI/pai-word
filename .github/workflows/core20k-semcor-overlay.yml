name: Core20K Fast Corpus Evidence Overlay
on:
  workflow_dispatch:
  push:
    branches: [core20k-sense-v1-audit-20261027]
    paths:
      - tools/core20k_sense_v1/semcor_overlay_v9.py
      - tools/core20k_sense_v1/build_teaching_sense_v1_provisional.py
      - tools/core20k_sense_v1/build_provisional_ku_gate.py
      - tools/core20k_sense_v1/audit_placeholder4176.py
      - tools/core20k_sense_v1/ku_authoring_safety_gate_v11.py
      - tools/core20k_sense_v1/semcor_context_cloze_v12.py
      - tools/core20k_sense_v1/qa_semcor_cloze_v13.py
      - tools/core20k_sense_v1/repair_screen_cloze_v14.py
      - .github/workflows/core20k-semcor-overlay.yml
jobs:
  semcor-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: core20k-fast-selection-efficiency
          run-id: 40687574253
          github-token: ${{ github.token }}
          path: .
      - uses: actions/download-artifact@v4
        with:
          name: core20k-oewn2025-full-source-candidates
          run-id: 40684148197
          github-token: ${{ github.token }}
          path: .
      - name: Overlay SemCor evidence onto candidate selection
        run: python3 tools/core20k_sense_v1/semcor_overlay_v9.py
      - name: Materialize provisional teaching Sense inclusion mask
        run: python3 tools/core20k_sense_v1/build_teaching_sense_v1_provisional.py
      - name: Build KU authoring gate for provisional selected Senses
        run: python3 tools/core20k_sense_v1/build_provisional_ku_gate.py
      - name: Audit arbitrary coverage placeholders
        run: python3 tools/core20k_sense_v1/audit_placeholder4176.py
      - name: Correct KU queue to block unsupported Sense choices
        run: python3 tools/core20k_sense_v1/ku_authoring_safety_gate_v11.py
      - name: Download SemCor for sourced cloze draft production
        run: |
          python -m pip install nltk
          python -c "import nltk; nltk.download('semcor', quiet=True); nltk.download('wordnet', quiet=True)"
      - name: Generate sourced contextual cloze draft candidates
        run: python3 tools/core20k_sense_v1/semcor_context_cloze_v12.py
      - name: Structural QA and quarantine of sourced cloze drafts
        run: python3 tools/core20k_sense_v1/qa_semcor_cloze_v13.py
      - name: Repair structure and screen cloze answer risks V14
        run: python3 tools/core20k_sense_v1/repair_screen_cloze_v14.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core20k-semcor-evidence-v9
          path: |
            **/sense_selection_v9_manifest.json
            **/sense_selection_v9_corpus_evidence_overlay.jsonl
            **/teaching_sense_v1_provisional_selection.jsonl
            **/teaching_sense_v1_provisional_manifest.json
            **/teaching_sense_v1_ku_drafting_queue.jsonl
            **/teaching_sense_v1_ku_drafting_manifest.json
            **/placeholder4176_audit_manifest.json
            **/placeholder4176_semantic_review_queue.jsonl
            **/ku_authoring_safety_v11_manifest.json
            **/ku_draft_allowed_v11.jsonl
            **/ku_draft_blocked_v11.jsonl
            **/semcor_context_cloze_staging_v12.jsonl
            **/semcor_cloze_v12_manifest.json
            **/semcor_cloze_v13_qa_manifest.json
            **/semcor_cloze_v13_structural_pass.jsonl
            **/semcor_cloze_v13_quarantine.jsonl
            **/cloze_v14_manifest.json
            **/cloze_v14_structural_candidates.jsonl
            **/cloze_v14_ambiguity_review.jsonl
            **/cloze_v14_unresolved.jsonl
          retention-days: 30
