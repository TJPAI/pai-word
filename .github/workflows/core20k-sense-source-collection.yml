name: Core20K Sense collect online lexical sources
on:
  workflow_dispatch:
  push:
    branches: [core20k-sense-v1-audit-20261027]
    paths:
      - 'tools/core20k_sense_v1/collect_online_sources.py'
      - '.github/workflows/core20k-sense-source-collection.yml'
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tools/core20k_sense_v1/collect_online_sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: core20k-online-source-collection
          path: tools/core20k_sense_v1/reports/online_sources/
          retention-days: 30
