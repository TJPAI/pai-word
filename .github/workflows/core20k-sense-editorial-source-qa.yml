name: Core20K Sense 20-word OEWN2025 evidence review
on:
  workflow_dispatch:
  push:
    branches: [core20k-sense-v1-audit-20261027]
    paths:
      - 'tools/core20k_sense_v1/review_editorial20_oewn2025.py'
      - '.github/workflows/core20k-sense-editorial-source-qa.yml'
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'wn>=0.13,<2'
      - run: python -c "import wn; wn.download('oewn:2025')"
      - run: python tools/core20k_sense_v1/review_editorial20_oewn2025.py
      - uses: actions/upload-artifact@v4
        with:
          name: core20k-sense-editorial20-source-evidence
          path: |
            tools/core20k_sense_v1/reports/editorial20_oewn2025_evidence.jsonl
            tools/core20k_sense_v1/reports/editorial20_oewn2025_summary.json
