name: CG-MASTER ENTEACH draft matching
on:
  workflow_dispatch:
  push:
    branches:
      - cg-master-kaikki-evidence-intake-20261111
    paths:
      - tools/scene1341_master/prepare_enteach_drafts.mjs
      - tools/scene1341_master/audit_enteach_import_readiness.mjs
      - tools/scene1341_master/publish_enteach_ready.mjs
      - tools/scene1341_master/triage_enteach_blockers.mjs
      - .github/workflows/cgmaster-enteach-intake.yml
permissions:
  contents: write
concurrency:
  group: cgmaster-enteach-atomic-publisher
  cancel-in-progress: false
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cg-master-kaikki-evidence-intake-20261111
          path: master
      - uses: actions/checkout@v4
        with:
          ref: answer-enrichment-main-dev-20261026
          path: author
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scripts
        run: |
          node --check master/tools/scene1341_master/prepare_enteach_drafts.mjs
          node --check master/tools/scene1341_master/audit_enteach_import_readiness.mjs
          node --check master/tools/scene1341_master/publish_enteach_ready.mjs
          node --check master/tools/scene1341_master/triage_enteach_blockers.mjs
      - name: Match all author draft packs against immutable Master
        run: |
          mkdir -p master/tools/answer-enrichment
          cp author/tools/answer-enrichment/scene1341-v51-*.json master/tools/answer-enrichment/
          test -f master/tools/answer-enrichment/scene1341-v51-answer-only-v2-manifest-1782.json
          cd master
          node tools/scene1341_master/prepare_enteach_drafts.mjs tools/answer-enrichment/scene1341-v51-answer-only-v2-manifest-1782.json ../cgmaster-enteach-matched-candidates.jsonl | tee ../cgmaster-enteach-matching-summary.json
      - name: Audit nine-field import readiness
        run: |
          cd master
          node tools/scene1341_master/audit_enteach_import_readiness.mjs ../cgmaster-enteach-matched-candidates.jsonl | tee ../cgmaster-enteach-readiness.json
      - name: Prioritize evidence-backed missing-field production
        run: |
          cd master
          node tools/scene1341_master/triage_enteach_blockers.mjs ../cgmaster-enteach-matched-candidates-blocked.jsonl | tee ../cgmaster-enteach-blocker-triage.json
      - name: Validate complete two-page ready packages
        run: |
          cd master
          node tools/scene1341_master/validate_two_page_import.mjs ../cgmaster-enteach-matched-candidates-ready.jsonl | tee ../cgmaster-enteach-two-page-validation.json
      - name: Publish verified complete packages atomically
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git -C master config user.name 'github-actions[bot]'
          git -C master config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ ! -s cgmaster-enteach-matched-candidates-ready.jsonl ]; then
            echo 'NOOP: no complete nine-field Sense packages; release unchanged'
            exit 0
          fi
          cd master
          node tools/scene1341_master/publish_enteach_ready.mjs "$GITHUB_WORKSPACE/cgmaster-enteach-matched-candidates-ready.jsonl" | tee ../cgmaster-enteach-publication.json
      - name: Upload candidate evidence and HOLD summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cgmaster-enteach-matching
          path: |
            cgmaster-enteach-matched-candidates.jsonl
            cgmaster-enteach-matched-candidates-holds.jsonl
            cgmaster-enteach-matching-summary.json
            cgmaster-enteach-readiness.json
            cgmaster-enteach-two-page-validation.json
            cgmaster-enteach-publication.json
            cgmaster-enteach-blocker-triage.json
            cgmaster-enteach-matched-candidates-blocked-triage.jsonl
            cgmaster-enteach-matched-candidates-ready.jsonl
            cgmaster-enteach-matched-candidates-blocked.jsonl
          if-no-files-found: warn
          retention-days: 30
