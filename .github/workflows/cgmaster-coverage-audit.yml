name: CG-MASTER full teaching coverage audit
on:
  workflow_dispatch:
  push:
    branches:
      - cg-master-kaikki-evidence-intake-20261111
    paths:
      - tools/scene1341_master/production/SCENE1341_LIVE_INDEX.json
      - tools/scene1341_master/report_master_coverage.mjs
      - tools/scene1341_master/report_field_gap_queue.mjs
      - tools/scene1341_master/apply_source_safe_ipa_pos.mjs
permissions:
  contents: read
concurrency:
  group: cgmaster-coverage-audit
  cancel-in-progress: true
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate coverage program
        run: |
          node --check tools/scene1341_master/report_master_coverage.mjs
          node --check tools/scene1341_master/report_field_gap_queue.mjs
          node --check tools/scene1341_master/apply_source_safe_ipa_pos.mjs
      - name: Verify 1341 scene identities and emit teaching field counts
        run: node tools/scene1341_master/report_master_coverage.mjs | tee cgmaster-coverage.json
      - name: Emit actionable 3000-row missing-field batches
        run: |
          node tools/scene1341_master/report_field_gap_queue.mjs > cgmaster-field-gap-queue.json
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("cgmaster-field-gap-queue.json","utf8"));console.log(JSON.stringify(d.summary,null,2))'
      - name: Preview first 3000 source-safe IPA/POS field fills without modifying data
        run: |
          node tools/scene1341_master/apply_source_safe_ipa_pos.mjs --start 1 --end 1341 --max-rows 3000 > cgmaster-ipa-pos-dry-run.json
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("cgmaster-ipa-pos-dry-run.json","utf8"));console.log(JSON.stringify({mode:d.mode,verified_rows:d.verified_rows,changed_rows:d.changed_rows,changed_scenes:d.changed_scenes,qa_stage:d.qa_stage},null,2))'
          test -z "$(git status --porcelain -- tools/scene1341_master/production)"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cgmaster-coverage
          path: |
            cgmaster-coverage.json
            cgmaster-field-gap-queue.json
            cgmaster-ipa-pos-dry-run.json
          retention-days: 30
