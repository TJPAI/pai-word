name: B217 Overlay QA
on:
  push:
    branches: [home-perf-safe-load-20261022]
    paths:
      - 'scripts/core20k-approved-*.mjs'
      - 'scripts/core20k-b218-*.mjs'
      - 'rebuild-preview/b218-isolated/**'
      - '.github/workflows/b217-overlay-qa.yml'
  workflow_dispatch:
jobs:
  overlay-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Print environment and required files
        run: |
          node --version
          git rev-parse HEAD
          ls -l scripts/core20k-approved-*.mjs scripts/core20k-b218-*.mjs
          ls -l rebuild-preview/b218-isolated/index.html
      - name: B217 overlay contract tests
        run: node scripts/core20k-approved-teaching-overlay.test.mjs
      - name: B217 loader isolation tests
        run: node scripts/core20k-approved-overlay-loader.test.mjs
      - name: B218 contextual answer and identity tests
        run: node scripts/core20k-b218-contextual-grading.test.mjs
      - name: Boot and learning syntax
        run: |
          node --check scripts/core20k-approved-overlay-boot.mjs
          node --check scripts/core20k-dev-boot.mjs
          node --check rebuild-preview/learning-runtime.js
      - name: Isolated HTML module syntax
        run: node scripts/core20k-b218-html-module-qa.mjs
