name: CG-MASTER gloss blocker diagnostics
on:
  push:
    branches: [cg-master-kaikki-evidence-intake-20261111]
    paths:
      - .github/workflows/cgmaster-gloss-gap-diagnostics.yml
      - tools/scene1341_master/batch_enrich_master.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        range:
          - {start: 1, end: 150}
          - {start: 151, end: 300}
          - {start: 301, end: 450}
          - {start: 451, end: 600}
          - {start: 601, end: 750}
          - {start: 751, end: 900}
          - {start: 901, end: 1050}
          - {start: 1051, end: 1200}
          - {start: 1201, end: 1341}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate diagnostic syntax
        run: node --check tools/scene1341_master/batch_enrich_master.mjs
      - name: Report gloss blockers without modifying production
        run: |
          node tools/scene1341_master/batch_enrich_master.mjs --start ${{ matrix.range.start }} --end ${{ matrix.range.end }} --batch-size 3000 --dry-run > gloss-diagnostics.json
          node -e "const x=require('./gloss-diagnostics.json'); console.log(JSON.stringify({range:[${{ matrix.range.start }},${{ matrix.range.end }}],records:x.records_scanned,gloss_blockers:x.gloss_candidate_diagnostics,eligible_glosses:x.records_enriched,pos:x.pos_enriched,ipa:x.ipa_enriched},null,2))"
      - uses: actions/upload-artifact@v4
        with:
          name: cgmaster-gloss-blockers-${{ matrix.range.start }}-${{ matrix.range.end }}
          path: gloss-diagnostics.json
  aggregate:
    needs: diagnose
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cgmaster-gloss-blockers-*
          path: shards
          merge-multiple: false
      - name: Summarize all available shard diagnostics
        run: |
          python3 - <<'PY'
          import json,glob,os
          files=glob.glob('shards/**/gloss-diagnostics.json',recursive=True)
          if len(files)!=9:
              raise SystemExit(f'Expected 9 shard reports; received {len(files)}')
          total={}
          scenes=[]
          records=0
          for file in files:
              d=json.load(open(file))
              records+=d['records_scanned']
              for k,v in d['gloss_candidate_diagnostics'].items():
                  total[k]=total.get(k,0)+v
              scenes.extend(d.get('gloss_priority_scenes',[]))
          scenes.sort(key=lambda x:x.get('no_evidence',0)+x.get('multiple_senses',0)+x.get('multiple_entries',0),reverse=True)
          result={'shards':len(files),'records_scanned':records,'gloss_blockers':total,'top_30_scenes':scenes[:30]}
          with open('gloss-all-scenes-summary.json','w') as out: json.dump(result,out,ensure_ascii=False,indent=2)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## CG-MASTER all-scene gloss blocker audit\\n\\n')
              out.write(f'Shards: {len(files)}; associations scanned: {records}\\n\\n')
              out.write('| Reason | Records |\\n|---|---:|\\n')
              for k,v in sorted(total.items(),key=lambda x:-x[1]):out.write(f'| {k} | {v:,} |\\n')
              out.write('\\nTop 30 scenes are in the JSON artifact.\\n')
          print(json.dumps(result,ensure_ascii=False)[:12000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cgmaster-gloss-all-scenes-summary
          path: gloss-all-scenes-summary.json
