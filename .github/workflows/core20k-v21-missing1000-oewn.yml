name: Core20K V2.1 Missing1000 OEWN Sense Discovery
on:
  workflow_dispatch:
  push:
    branches: [core20k-sense-v1-audit-20261027]
    paths: ['tools/core20k_sense_v1/discover_missing1000_oewn.py', 'tools/core20k_sense_v1/triage_missing1000_bilingual.py', 'tools/core20k_sense_v1/create_priority258_review_cards.py', 'tools/core20k_sense_v1/author_bilingual_editorial_pilot.py', 'tools/core20k_sense_v1/author_17_contextual_ku.py', 'tools/core20k_sense_v1/qa_17_contextual_ku.py', 'tools/core20k_sense_v1/author_17_second_context_ku.py', 'tools/core20k_sense_v1/qa_dual_context34.py', 'tools/core20k_sense_v1/create_next100_lexical_candidates.py', 'tools/core20k_sense_v1/adjudicate_next13_bilingual.py', 'tools/core20k_sense_v1/author_next9_ku.py', 'tools/core20k_sense_v1/qa_bilingual_candidate_gate.py', '.github/workflows/core20k-v21-missing1000-oewn.yml']
jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'wn>=0.13,<2'
      - run: python -c "import wn; wn.download('oewn:2025')"
      - run: python3 tools/core20k_sense_v1/source_missing_first1000_ecdict.py
      - run: python3 tools/core20k_sense_v1/discover_missing1000_oewn.py
      - run: python3 tools/core20k_sense_v1/triage_missing1000_bilingual.py
      - run: python3 tools/core20k_sense_v1/create_priority258_review_cards.py
      - run: python3 tools/core20k_sense_v1/author_bilingual_editorial_pilot.py
      - run: python3 tools/core20k_sense_v1/author_17_contextual_ku.py
      - run: python3 tools/core20k_sense_v1/qa_17_contextual_ku.py
      - run: python3 tools/core20k_sense_v1/author_17_second_context_ku.py
      - run: python3 tools/core20k_sense_v1/qa_dual_context34.py
      - run: python3 tools/core20k_sense_v1/create_next100_lexical_candidates.py
      - run: python3 tools/core20k_sense_v1/adjudicate_next13_bilingual.py
      - run: python3 tools/core20k_sense_v1/author_next9_ku.py
      - run: python3 tools/core20k_sense_v1/qa_bilingual_candidate_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: core20k-v21-missing1000-oewn-sense-evidence
          path: tools/core20k_sense_v1/release/v2.1-missing-first1000-sourced/
