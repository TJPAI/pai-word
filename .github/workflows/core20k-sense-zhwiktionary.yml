name: Core20K Sense Chinese Wiktionary collection
on:
  workflow_dispatch:
  push:
    branches: [core20k-sense-v1-audit-20261027]
    paths:
      - 'tools/core20k_sense_v1/collect_zhwiktionary.py'
      - '.github/workflows/core20k-sense-zhwiktionary.yml'
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Stream Chinese Wiktionary dataset
        run: python3 tools/core20k_sense_v1/collect_zhwiktionary.py
      - uses: actions/upload-artifact@v4
        with:
          name: core20k-zhwiktionary-matched
          path: |
            tools/core20k_sense_v1/reports/online_sources/zhwiktionary_core20k.jsonl
            tools/core20k_sense_v1/reports/online_sources/zhwiktionary_summary.json
          retention-days: 30
