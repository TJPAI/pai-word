    paths: ['tools/core20k_sense_v1/source_missing_first1000_ecdict.py', '.github/workflows/core20k-v21-source-missing1000.yml']
jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/core20k_sense_v1/source_missing_first1000_ecdict.py
      - uses: actions/upload-artifact@v4
        with:
          name: core20k-v21-first1000-missing-ecdict-evidence
