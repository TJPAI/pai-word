name: Original Scene500 home defaults to Scene1341
on:
  pull_request:
    paths:
      - 'rebuild-preview/home-dashboard.js'
      - 'rebuild-preview/welcome.js'
      - 'tools/integration/test-scene1341-original-home-default.mjs'
      - '.github/workflows/scene1341-original-home-default.yml'
  push:
    branches: [cg-main-scene1341-native-home-default-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-home:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute ORIGINAL Scene500 homepage with new Scene1341 default
        run: |
          node --check rebuild-preview/home-dashboard.js
          node tools/integration/test-scene1341-original-home-default.mjs
      - name: Verify full source-pinned Scene1341 search and browser ranker
        run: |
          node tools/integration/test-scene1341-rec-browser-ab.mjs
          node tools/integration/test-scene1341-readonly-rec-integration.mjs
      - name: Preserve native Scene500 controls and SRS isolation
        run: |
          node tools/integration/test-scene500-native-card-shell.mjs
          node tools/integration/test-scene500-native-navigation-parity.mjs
          node tools/integration/test-scene500-native-handwriting.mjs
          node tools/integration/test-scene500-native-audio-lifecycle.mjs
          node tools/integration/test-scene1341-isolated-registry-srs.mjs
      - name: No deployment
        run: echo 'DEPLOY_GITHUB_PAGES_ONLY_VIA_OWNER_RUN_WORKFLOW'
