<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scene500 A/B 实测</title><style>
body{font:15px system-ui,-apple-system,sans-serif;max-width:1120px;margin:auto;padding:24px;color:#172033;background:#f6f8fb}h1{font-size:24px}textarea{width:100%;box-sizing:border-box;padding:12px;font:inherit;border:1px solid #b5c1d0;border-radius:9px}button{padding:9px 16px;margin:8px 6px 8px 0;cursor:pointer;border:1px solid #aab6c7;border-radius:8px;background:white}button.primary{background:#174ea6;color:white}button:disabled{opacity:.5}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}section{background:white;padding:16px;border:1px solid #dce3ed;border-radius:12px}li{padding:9px 0;border-bottom:1px solid #e8edf4}small,.muted{color:#5b6676}select{margin-left:8px;padding:5px}#status{white-space:pre-wrap} .error{color:#a11} .score{font-variant-numeric:tabular-nums}</style></head>
<body><h1>Scene500 双引擎 A/B 对比</h1><p>真实规则引擎 vs E5 V1.6；不写入学习数据。E5首次加载可能超过40秒并下载约160MB，请在Wi-Fi下测试。</p>
<label for="query">测试句子</label><textarea id="query" rows="2">我想学习量子计算和人工智能</textarea>
<div><button class="primary" id="run">运行两个引擎</button><button id="cancel">取消</button><button id="export">导出JSON</button></div>
<p id="status" role="status">尚未运行。此页面不展示模拟结果。</p><p id="eligibility" class="muted">正在读取共享场景集合…</p>
<main><section><h2>A · 规则推荐</h2><div id="a">待运行</div></section><section><h2>B · E5 V1.6</h2><div id="b">待运行</div></section></main>
<p class="muted">人工标注：0无关、1弱相关、2相关、3高度相关。标注只在当前页面内存保存，点击导出JSON留存。</p>
<script type="module">
import {createScene500Recommender} from '../scene500-recommendation/engine.mjs';
import {createE5Provider} from '../rebuild-preview/create-e5-provider.mjs';
const $=id=>document.getElementById(id);
let seq=0,controller=null,provider=null,runData=null,allowed=[],catalog=null,rule=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fetchJson=async p=>{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error(p+': HTTP '+r.status);return r.json()};
async function setup(){
 const [cat,inventory]=await Promise.all([fetchJson('../scene500-recommendation/catalog-v0.2.json'),fetchJson('../data/scene500-v40-inventory.json')]);
 catalog=cat;rule=createScene500Recommender({catalog:cat});
 // Shared, explicit eligibility *proxy*: coarse playable references are not verified KU counts.
 allowed=Object.keys(cat.scenes).filter(id=>Number(inventory.scenes?.[id]?.playableReferences)>0);
 $('eligibility').textContent='两侧统一使用 '+allowed.length+' 个候选场景（依据v40 playableReferences；并非实时已审核KU库存）。';
}
function draw(side,entry){
 const root=$(side);root.replaceChildren();
 const info=document.createElement('p');info.textContent='状态：'+entry.status+' ｜ 耗时：'+Math.round(entry.elapsedMs)+'ms'+(entry.error?' ｜ 错误：'+entry.error:'');root.append(info);
 const ol=document.createElement('ol');root.append(ol);
 for(const item of entry.results){const li=document.createElement('li');li.innerHTML='<strong>'+esc(item.sceneId)+' · '+esc(item.displayName)+'</strong><br><small class="score">分数：'+esc(item.score)+'（不同引擎不可直接比较）</small>';
 const label=document.createElement('label');label.textContent=' 人工相关性 ';
 const select=document.createElement('select');select.innerHTML='<option value="">未标注</option>'+[0,1,2,3].map(n=>'<option value="'+n+'">'+n+'</option>').join('');
 select.addEventListener('change',()=>{item.humanRelevance=select.value===''?null:Number(select.value)});
 label.append(select);li.append(label);ol.append(li)}
}
function recordFailure(side,code,start){const x={status:'unavailable',elapsedMs:performance.now()-start,error:String(code),results:[]};draw(side,x);return x}
async function run(){
 const ticket=++seq;controller?.abort();controller=new AbortController();const signal=controller.signal;
 $('status').textContent='运行中：规则推荐与E5同时启动…';$('run').disabled=true;
 const query=$('query').value.trim();if(!query){$('status').textContent='请输入查询';$('run').disabled=false;return}
 const current={query,at:new Date().toISOString(),taxonomy:catalog?.schema,eligibilitySource:'v40-inventory.playableReferences (coarse proxy, not verified KU)',eligibleSceneIds:allowed.slice(),engines:{}};
 runData=current;
 const a=(async()=>{const start=performance.now();try{const result=rule.search(query,{limit:10,eligibleSceneIds:allowed});const x={status:'ok',elapsedMs:performance.now()-start,results:result.results.map((r,i)=>({sceneId:r.sceneId,displayName:r.name,rank:i+1,score:r.score,humanRelevance:null}))};if(ticket===seq){current.engines.rule=x;draw('a',x)}return x}catch(e){if(ticket===seq)current.engines.rule=recordFailure('a',e,start)}})();
 const b=(async()=>{const start=performance.now();try{provider??=createE5Provider({baseUrl:new URL('../scene500-e5/',location.href).href,timeoutMs:60000});const response=await provider.recommend(query,{topK:10,signal});if(signal.aborted)return;const results=(response.recommendations||[]).filter(r=>allowed.includes(r.sceneId)).slice(0,10).map(r=>({...r,humanRelevance:null}));const x={status:response.status,modeUsed:response.modeUsed,error:response.errorCode||null,elapsedMs:performance.now()-start,results};if(ticket===seq){current.engines.e5=x;draw('b',x)}return x}catch(e){if(ticket===seq)current.engines.e5=recordFailure('b',e.name==='AbortError'?'aborted':e.message,start)}})();
 await Promise.allSettled([a,b]);if(ticket===seq){$('status').textContent='完成：请检查两侧状态和真实推荐结果。';$('run').disabled=false}
}
$('run').onclick=()=>{if(!rule){$('status').textContent='目录尚未加载';return}void run()};
$('cancel').onclick=()=>{seq++;controller?.abort();$('run').disabled=false;$('status').textContent='已取消本次请求；旧结果不会覆盖新结果。'};
$('export').onclick=()=>{if(!runData){$('status').textContent='请先运行测试';return}const blob=new Blob([JSON.stringify(runData,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='scene500-ab-'+Date.now()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
setup().catch(e=>{$('status').textContent='初始化失败：'+e.message;$('status').className='error'});
</script></body></html>
